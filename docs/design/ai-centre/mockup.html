<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI centre mockup</title>
<style>
/* Atelier tokens, copied from app/atelier.css (light + dark). Mockup only: fictional data, no product code. */
:root{
  --canvas:#fff;--fg:#1c1c1f;--card:#fff;--sidebar:#f8f8f9;--sidebar-fg:#4b4b52;--primary:#c2410c;--primary-fg:#fff;
  --muted:#f4f4f5;--muted-fg:#5f5f67;--accent:#efeff1;--border:#e8e8eb;--input:#d4d4d8;--line-strong:#dcdce0;
  --accent-wash:#fdf1ea;--accent-hover:#a8380a;--tan:#8a5a2e;--tan-wash:#f5ede5;--ok:#17703f;--ok-wash:#e8f5ed;
  --warn:#8a5300;--warn-wash:#fdf4e1;--info:#2353b8;--info-wash:#ebf1fd;--llm:#6d28d9;--llm-wash:#f3effd;--selected:#e9e9ec;
  --shadow-pop:0 4px 12px -2px rgb(20 20 30/.08),0 16px 40px -8px rgb(20 20 30/.14);
  --ease:cubic-bezier(.16,1,.3,1);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Noto Sans SC','Noto Sans Thai','Noto Sans Tamil',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#111113;--fg:#ededef;--card:#18181b;--sidebar:#161618;--sidebar-fg:#b4b4bc;--primary:#fb8a4a;--primary-fg:#1c1c1f;
  --muted:#222226;--muted-fg:#a8a8b0;--accent:#26262b;--border:#2a2a2f;--input:#3a3a40;--line-strong:#34343a;
  --accent-wash:#3a2418;--accent-hover:#fca06c;--tan:#e0b48a;--tan-wash:#2e241c;--ok:#7fd3a1;--ok-wash:#16281e;
  --warn:#f2c26b;--warn-wash:#2c2312;--info:#9cbcff;--info-wash:#18223a;--llm:#c4b5fd;--llm-wash:#241d38;--selected:#2c2c32;color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#111113;--fg:#ededef;--card:#18181b;--sidebar:#161618;--sidebar-fg:#b4b4bc;--primary:#fb8a4a;--primary-fg:#1c1c1f;
  --muted:#222226;--muted-fg:#a8a8b0;--accent:#26262b;--border:#2a2a2f;--input:#3a3a40;--line-strong:#34343a;
  --accent-wash:#3a2418;--accent-hover:#fca06c;--tan:#e0b48a;--tan-wash:#2e241c;--ok:#7fd3a1;--ok-wash:#16281e;
  --warn:#f2c26b;--warn-wash:#2c2312;--info:#9cbcff;--info-wash:#18223a;--llm:#c4b5fd;--llm-wash:#241d38;--selected:#2c2c32;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--fg);font:14px/1.43 var(--font)}
::selection{background:var(--accent-wash);color:var(--fg)}
a{color:var(--primary);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* Reviewer bar: not part of the product. */
.rv{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:#1c1c1f;color:#ededef;font-size:12px}
.rv b{font-weight:600;margin-right:6px}
.rv button,.rv select{background:#2a2a2f;border:1px solid #3a3a40;color:#ededef;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
.rv button[aria-current="true"]{background:#fb8a4a;color:#1c1c1f;border-color:#fb8a4a}
.rv .sp{flex:1}

/* Shell */
.shell{display:grid;grid-template-columns:15.5rem 1fr;min-height:calc(100vh - 41px)}
.shell>div{min-width:0}
.rail{background:var(--sidebar);border-right:1px solid var(--border);padding:12px 8px;color:var(--sidebar-fg);font-size:13.5px}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 14px;font-weight:600;color:var(--fg)}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--fg);display:inline-block}
.row{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:6px;text-decoration:none;color:inherit;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.row:hover{background:var(--accent)}
.row[aria-current="page"]{background:var(--selected);color:var(--fg);font-weight:500}
.row .badge{margin-left:auto}
.sub{margin:2px 0 6px 15px;padding-left:9px;border-left:1px solid var(--line-strong)}
.cap{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-fg);padding:14px 8px 4px;font-weight:600}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--primary);color:var(--primary-fg);font-size:11px;font-weight:600}
.top{height:48px;display:flex;align-items:center;gap:12px;padding:0 32px;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted-fg)}
.top .scope{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--input);border-radius:8px;padding:4px 10px;color:var(--fg)}
.top .me{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--fg)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--fg)}
main{padding:28px 32px 40px;min-width:0}
.wrap{max-width:72rem}
h1{font-size:1.375rem;line-height:1.25;letter-spacing:-.015em;font-weight:600;margin:0}
.lede{color:var(--muted-fg);margin:6px 0 0;max-width:68ch}
h2{font-size:15px;font-weight:600;margin:0}
h3{font-size:14px;font-weight:600;margin:0}
.muted{color:var(--muted-fg)}
.small{font-size:12.5px}

/* Centre tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:20px 0 22px;overflow-x:auto}
.tab{text-decoration:none;display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border:0;background:none;color:var(--muted-fg);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--primary)}
.tab .badge{height:17px;min-width:17px;font-size:10.5px}
.tab.admin{margin-left:0}
.tabsep{width:1px;background:var(--border);margin:8px 6px}

/* Card + buttons */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:6px 14px;border-radius:8px;border:1px solid transparent;background:var(--primary);color:var(--primary-fg);font-weight:500;cursor:pointer;text-decoration:none;font-size:13.5px}
.btn:hover{background:var(--accent-hover)}
.btn.o{background:var(--card);color:var(--fg);border-color:var(--line-strong)}
.btn.o:hover{background:var(--accent)}
.btn.g{background:none;color:var(--muted-fg);border-color:transparent}
.btn.g:hover{background:var(--accent);color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--muted);color:var(--muted-fg);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-wash);color:var(--ok)}.pill.warn{background:var(--warn-wash);color:var(--warn)}
.pill.info{background:var(--info-wash);color:var(--info)}.pill.llm{background:var(--llm-wash);color:var(--llm)}
.pill.off{background:var(--muted);color:var(--muted-fg)}.pill.off::before{background:none;border:1px dashed currentColor}

/* Maker's Mark: the existing human-confirmation signature. */
.mark{width:22px;height:22px;border-radius:50%;flex:none;border:1.5px dashed var(--line-strong);display:inline-block;position:relative}
.mark.signed{border:0;background:var(--tan-wash);box-shadow:inset 0 0 0 2px var(--tan),inset 0 0 0 5px var(--tan-wash),inset 0 0 0 6px color-mix(in srgb,var(--tan) 55%,transparent)}

/* Inbox */
.inbox{display:grid;grid-template-columns:minmax(0,1fr) 17rem;gap:24px;align-items:start}
.group{margin-bottom:22px}
.group>header{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.group>header .count{color:var(--muted-fg);font-size:12.5px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--sidebar-fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--canvas);border-color:var(--fg)}

/* The ONE proposal card. Every surface renders this. */
.pc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.pc+.pc{margin-top:8px}
.pc .ico{grid-row:span 3;width:32px;height:32px;border-radius:8px;background:var(--muted);display:flex;align-items:center;justify-content:center;color:var(--fg)}
.pc .ico.dec{background:var(--accent-wash);color:var(--primary)}
.pc .ico.prep{background:var(--info-wash);color:var(--info)}
.pc .ico.fyi{background:var(--muted);color:var(--muted-fg)}
.pc .t{font-weight:600;line-height:1.35}
.pc .who{color:var(--muted-fg);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pc .checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-width:0}
.pc .checks .pill{white-space:normal}
.pc>*{min-width:0}
.pc .t,.pc .who,.pc .checks{grid-column:2}
.pc .ico{grid-column:1;grid-row:1/4}
.pc .act{grid-column:3;grid-row:1/4}
.pc.compact .act,.pc.compact details{grid-column:1/3;grid-row:auto}
.pc .act{grid-row:span 3;display:flex;flex-direction:column;align-items:flex-end;gap:6px;justify-content:center}
.pc .exp{font-size:12px;color:var(--muted-fg);display:inline-flex;gap:4px;align-items:center}
.pc details{grid-column:2/4;margin-top:4px;font-size:12.5px}
.pc summary{cursor:pointer;color:var(--muted-fg);list-style:none;display:inline-flex;gap:4px;align-items:center}
.pc summary::-webkit-details-marker{display:none}
.pc summary:hover{color:var(--fg)}
.or{margin-top:8px;display:grid;grid-template-columns:9rem 1fr;gap:4px 12px;padding:10px 12px;background:var(--muted);border-radius:8px}
.or dt{color:var(--muted-fg)}.or dd{margin:0}
.pc.compact{grid-template-columns:auto minmax(0,1fr);padding:12px}
.pc.compact .act{grid-column:1/3;grid-row:auto;flex-direction:row;justify-content:space-between;align-items:center;margin-top:8px}

.side .card{padding:14px 16px}
.side .card+.card{margin-top:12px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--border);font-size:13px}
.kv:first-of-type{border-top:0}

/* Review page pattern */
.crumb{display:inline-flex;align-items:center;gap:4px;color:var(--muted-fg);text-decoration:none;font-size:13px;margin-bottom:10px}
.crumb:hover{color:var(--fg)}
.review{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:24px;align-items:start;margin-top:20px}
.sec{padding:16px 18px}
.sec+.sec{margin-top:12px}
.sec h2{margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:12.5px;font-weight:500;color:var(--muted-fg);text-align:left;padding:0 10px;height:36px;border-bottom:1px solid var(--border)}
td{padding:0 10px;height:44px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
.confirm{position:sticky;top:60px;padding:18px}
.confirm .who{display:flex;gap:10px;align-items:center;margin:12px 0 14px;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:10px;font-size:13px}
.confirm .btn{width:100%}
.confirm .btn+.btn{margin-top:8px}

/* Workers */
.stop{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:16px}
.switch{position:relative;width:34px;height:20px;border-radius:999px;background:var(--input);border:0;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 2px rgb(0 0 0/.2)}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(14px)}
.fam{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.fam i{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--muted)}
.fam i svg{width:13px;height:13px}
.tbl{overflow-x:auto}
.tbl td:first-child{font-weight:500}

/* Delegations */
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(20rem,1fr));gap:12px}
.dg .card{padding:16px}
.facts{display:grid;grid-template-columns:7rem 1fr;gap:4px 10px;font-size:12.5px;margin:12px 0}
.facts dt{color:var(--muted-fg)}.facts dd{margin:0}
.never{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* Ask */
.ask{display:grid;grid-template-columns:14rem minmax(0,1fr);gap:0;border:1px solid var(--border);border-radius:12px;min-height:34rem;overflow:hidden;background:var(--card)}
.threads{border-right:1px solid var(--border);padding:10px;background:var(--sidebar)}
.threads .row{font-size:13px}
.conv{display:flex;flex-direction:column;min-width:0}
.log{flex:1;padding:24px 28px;display:flex;flex-direction:column;gap:16px;max-width:46rem;width:100%;margin:0 auto}
.q{align-self:flex-end;background:var(--muted);padding:8px 12px;border-radius:12px;max-width:80%}
.a{max-width:100%}
.composer{margin:0 auto 18px;width:calc(100% - 56px);max-width:44rem;border:1px solid var(--line-strong);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 1px 2px rgb(20 20 30/.05),0 8px 24px -12px rgb(20 20 30/.18)}
.composer textarea{flex:1;border:0;resize:none;background:none;font:inherit;color:var(--fg);outline:none;min-height:36px;padding:8px 0}
.send{width:32px;height:32px;border-radius:8px;border:0;background:var(--primary);color:var(--primary-fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.thinking{color:var(--muted-fg);font-size:12.5px}

/* Floating chat */
.fab{position:fixed;right:24px;bottom:24px;z-index:40;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--card);color:var(--fg);box-shadow:var(--shadow-pop);cursor:pointer;font-weight:500}
.fab .badge{margin-left:2px}
.fw{position:fixed;right:24px;bottom:24px;z-index:41;width:25rem;max-height:min(40rem,calc(100vh - 90px));display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-pop);transform-origin:bottom right;animation:pop .28s var(--ease)}
.fw.docked{top:41px;bottom:0;right:0;border-radius:0;width:26rem;max-height:none;border-width:0 0 0 1px;animation:slide .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.fw header{display:flex;align-items:flex-start;gap:8px;padding:12px 10px 10px 16px;border-bottom:1px solid var(--border)}
.fw header .ttl{flex:1;min-width:0}
.ib{width:36px;height:36px;border-radius:8px;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted-fg)}
.ib:hover{background:var(--accent);color:var(--fg)}
.fw .strip{display:flex;align-items:center;gap:8px;margin:10px 12px 0;padding:8px 10px;border-radius:10px;background:var(--accent-wash);font-size:12.5px;text-decoration:none;color:var(--fg)}
.fw .strip b{font-weight:600}
.fw .body{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.fw .composer{width:auto;margin:0 12px 10px;box-shadow:none}
.fw .foot{padding:0 16px 12px;font-size:11.5px;color:var(--muted-fg)}
.suggest{display:flex;flex-wrap:wrap;gap:6px}
.suggest button{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;height:30px;padding:0 12px;font-size:12.5px;color:var(--sidebar-fg);cursor:pointer}

/* Leave backdrop page for the floating chat */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:16px}
.cal div{background:var(--card);min-height:76px;padding:6px 8px;font-size:12px;color:var(--muted-fg)}
.cal .ev{display:block;margin-top:4px;font-size:11.5px;padding:2px 6px;border-radius:5px;background:var(--info-wash);color:var(--info)}
.cal .ev.al{background:var(--ok-wash);color:var(--ok)}

/* How it works */
.chapters{display:inline-flex;gap:2px;padding:3px;background:var(--muted);border-radius:10px;margin:18px 0 18px;flex-wrap:wrap}
.chapters button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted-fg);font-weight:500;font-size:13px}
.chapters button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgb(20 20 30/.08)}
.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px;align-items:start}
.map{position:relative;padding:18px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
.layer{position:relative;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:2px 12px;padding:12px 36px 12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);transition:border-color .25s,background-color .25s,opacity .25s}
.layer+.layer{margin-top:8px}
.layer .n{grid-row:span 2;width:2rem;height:2rem;border-radius:8px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12.5px;color:var(--muted-fg);transition:background-color .25s,color .25s}
.layer .nm{font-weight:600}
.layer .ds{font-size:12.5px;color:var(--muted-fg)}
.layer.on{border-color:var(--primary);background:var(--accent-wash)}
.layer.on .n{background:var(--primary);color:var(--primary-fg)}
.map.focus .layer:not(.on){opacity:.55}
.model{grid-column:2;margin-top:8px;display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px dashed color-mix(in srgb,var(--llm) 55%,transparent);border-radius:10px;background:var(--llm-wash);color:var(--llm);font-size:12.5px;transition:box-shadow .3s}
.model b{font-weight:600}
.layer.on .model{box-shadow:0 0 0 4px color-mix(in srgb,var(--llm) 14%,transparent)}
.found{margin-top:10px;padding:12px 14px;border-radius:10px;border:1px solid var(--line-strong);background:repeating-linear-gradient(135deg,var(--muted) 0 6px,var(--card) 6px 12px);transition:border-color .25s}
.found .nm{font-weight:600}
.found .parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.found .parts span{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:12px;transition:border-color .25s,color .25s}
.found.on{border-color:var(--primary)}
.found .parts span.on{border-color:var(--primary);color:var(--primary);font-weight:500}
.token{position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 22%,transparent),0 2px 6px rgb(0 0 0/.18);transition:transform .65s var(--ease),opacity .2s;pointer-events:none;z-index:3}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted-fg)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.story{padding:20px;min-height:100%}
.story .k{font-size:12.5px;color:var(--muted-fg)}
.story h2{font-size:18px;letter-spacing:-.01em;margin:4px 0 8px;line-height:1.3}
.story p{margin:0 0 12px;max-width:52ch}
.story .quote{padding:10px 12px;border-radius:10px;background:var(--muted);margin-bottom:12px}
.cl{list-style:none;padding:0;margin:0 0 12px}
.cl li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--border);font-size:13px;animation:tick .35s var(--ease) both}
.cl li:first-child{border-top:0}
.cl li svg{color:var(--ok);margin-top:2px}
.cl li:has(.muted) svg{color:var(--muted-fg)}
@keyframes tick{from{opacity:0;transform:translateY(4px)}}
.ctrls{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.dots{display:flex;gap:4px;margin-left:auto}
.dots button{width:26px;height:26px;border-radius:50%;border:0;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.dots button::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--line-strong);transition:background .2s,transform .2s}
.dots button[aria-selected="true"]::after{background:var(--primary);transform:scale(1.25)}
.fams{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.fams .card{padding:14px}
.fams .card h3{margin:10px 0 4px}
.fams .role{margin-top:10px;font-size:12px}
.nevers{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:10px}
.nevers .card{padding:14px 16px;display:flex;gap:10px}
.keys{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:center}
.keys .card{padding:16px}
.keys .arrow{color:var(--muted-fg)}
.draft{font-size:12px;color:var(--warn);background:var(--warn-wash);border-radius:8px;padding:6px 10px;display:inline-block;margin-top:10px}

[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .token{transition:opacity .2s}
  .layer,.found,.found .parts span{transition:border-color .15s,background-color .15s}
  .switch::after{transition:none}
}
@media (max-width:900px){
  .pc .act{grid-column:1/3!important;grid-row:auto!important}
  .pc .t,.pc .who,.pc .checks{grid-column:2}
  .shell{grid-template-columns:1fr}.rail{display:none}
  main{padding:20px 16px 96px}.top{padding:0 16px}
  .inbox,.review,.stage{grid-template-columns:minmax(0,1fr)}
  .ask{grid-template-columns:minmax(0,1fr)}.threads{display:none}
  .fams{grid-template-columns:1fr 1fr}
  .keys{grid-template-columns:1fr}.keys .arrow{transform:rotate(90deg);justify-self:center}
  .pc{grid-template-columns:auto minmax(0,1fr)}
  .pc .act{grid-column:1/3;grid-row:auto;flex-direction:row;justify-content:space-between;align-items:center;margin-top:8px}
  .pc details{grid-column:1/3}
  .fw{left:8px;right:8px;bottom:8px;width:auto}
  .fw.docked{left:0;width:auto}
  .confirm{position:static}
}

   </div>
   <form class="composer" onsubmit="return false"><textarea rows="1" aria-label="Your question" placeholder="Ask about this page or your records"></textarea><button class="send" aria-label="Send">${ic('up')}</button></form>
   <p class="foot">Nothing is changed for you. <a href="#ask">Continue in the ${PRODUCT.centre}</a></p>`;
  $('#dock').onclick=()=>{state.docked=!state.docked;floating()};
  $('#close').onclick=()=>{state.fwOpen=false;floating();$('#fab').focus()};
}

function placeToken(){
  const map=$('#map'),tok=$('#token');if(!map||!tok)return;
  const tgt=STEP_TARGET[state.step];
  map.classList.toggle('focus',!!tgt);
  map.querySelectorAll('.layer,.found,.found .parts span').forEach(e=>e.classList.remove('on'));
  if(!tgt){tok.style.opacity=0;return}
  const [k,part]=tgt.split(':');const el=map.querySelector(`[data-layer="${k}"]`);el.classList.add('on');
  let anchor=el;if(part!==undefined){anchor=el.querySelector(`[data-part="${part}"]`);anchor.classList.add('on')}
  const m=map.getBoundingClientRect(),a=anchor.getBoundingClientRect();
  const x=(part!==undefined?a.right+6:a.right-22)-m.left-7, y=a.top+a.height/2-m.top-7;
  tok.style.opacity=1;tok.style.transform=`translate(${x}px,${y}px)`;
}
let timer=null;const reduce=matchMedia('(prefers-reduced-motion: reduce)');
function setStep(n,focus){const m=(HW[state.lang]||HW.en).S.length;state.step=Math.max(0,Math.min(m-1,n));if(state.step===m-1&&state.playing)stopPlay();render(false);if(focus)document.querySelector(`.dots [data-step="${state.step}"]`)?.focus()}
function stopPlay(){state.playing=false;clearInterval(timer);timer=null}
function play(){if(state.playing){stopPlay();render(false);return}
  /* Reduced motion: no autoplay; the person steps through. Play still advances once per press. */
  if(reduce.matches){setStep(state.step+1);return}
  state.playing=true;if(state.step===(HW[state.lang]||HW.en).S.length-1)state.step=0;
  timer=setInterval(()=>setStep(state.step+1),3200);render(false)}

function render(scrollTop=true){
  const admin=state.role==='admin';
  document.documentElement.lang=state.view==='how'?state.lang:'en';
  if(!admin&&['workers','setup','spend'].includes(state.view))state.view='inbox';
  $('#main').innerHTML=(R[state.view]||R.inbox)();
  $('#rvViews').innerHTML=[...VIEWS.filter(v=>admin||!v[3]).map(v=>[v[0],v[1]]),...EXTRA].map(([k,l])=>`<button aria-current="${state.view===k}" data-go="${k}">${l}</button>`).join(' ');
  $('#railSub').innerHTML=VIEWS.filter(v=>admin||!v[3]).map(v=>`<a class="row" href="#${v[0]}" ${state.view===v[0]?'aria-current="page"':''}>${v[1]}${v[0]==='inbox'?`<span class="badge">${admin?3:1}</span>`:''}</a>`).join('');
  document.querySelectorAll('[data-admin]').forEach(e=>e.hidden=!admin);
  document.querySelectorAll('[data-count]').forEach(e=>e.textContent=admin?3:1);
  document.querySelectorAll('.rail > .row').forEach(e=>e.removeAttribute('aria-current'));
  document.querySelector(state.view==='leave'?'[data-nav="leave"]':'[data-nav="centre"]').setAttribute('aria-current','page');
  $('#meName').textContent=admin?'Siti Aminah · HR administrator':'Aina Rahman · Employee';$('#meAv').textContent=admin?'SA':'AR';
  floating();
  /* wiring */
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render(false)});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.go});
  document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{state.chapter=b.dataset.chapter;stopPlay();render(false)});
  document.querySelectorAll('.switch').forEach(b=>b.onclick=()=>b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true'));
  const ap=$('#approve');if(ap)ap.onclick=()=>{state.signed=true;render(false)};
  if(state.view==='how'&&state.chapter==='request'){
    $('#prev').onclick=()=>setStep(state.step-1);$('#next').onclick=()=>setStep(state.step+1);$('#play').onclick=play;
    document.querySelectorAll('.dots [data-step]').forEach(b=>{b.onclick=()=>setStep(+b.dataset.step);
      b.onkeydown=e=>{const k=e.key;if(k==='ArrowRight'||k==='ArrowDown'){e.preventDefault();setStep(state.step+1,true)}else if(k==='ArrowLeft'||k==='ArrowUp'){e.preventDefault();setStep(state.step-1,true)}else if(k==='Home'){e.preventDefault();setStep(0,true)}else if(k==='End'){e.preventDefault();setStep(99,true)}}});
    requestAnimationFrame(placeToken);
  }
  if(scrollTop)window.scrollTo(0,0);
}
$('#fab').onclick=()=>{state.fwOpen=true;floating();$('#fw textarea')?.focus()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.fwOpen&&state.view==='leave'&&!state.docked){state.fwOpen=false;floating();$('#fab').focus()}});
$('#rvRole').onchange=e=>{state.role=e.target.value;state.filter='all';render()};
$('#rvTheme').onchange=e=>{e.target.value?document.documentElement.dataset.theme=e.target.value:delete document.documentElement.dataset.theme;render(false)};
$('#rvLang').onchange=e=>{state.lang=e.target.value;if(state.view!=='how')location.hash='how';else render(false)};
addEventListener('resize',()=>placeToken());
function route(){const h=location.hash.slice(1);const p=new URLSearchParams(h.split('?')[1]||'');state.view=(h.split('?')[0])||'inbox';
  if(p.get('step'))state.step=+p.get('step');if(p.get('lang'))state.lang=p.get('lang'),$('#rvLang').value=state.lang;if(p.get('role'))state.role=p.get('role'),$('#rvRole').value=state.role;
  if(p.get('theme'))document.documentElement.dataset.theme=p.get('theme'),$('#rvTheme').value=p.get('theme');if(p.get('chapter'))state.chapter=p.get('chapter');
  if(p.get('docked'))state.docked=true;state.filter='all';stopPlay();render()}
addEventListener('hashchange',route);route();
</script>
</body>
</html>

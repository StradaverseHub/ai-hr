{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block body %}
<div class="card login-card">
  <h1>Change password</h1>
  <p class="muted">Signed in as <strong>{{ user['full_name'] }}</strong>.</p>
  <form method="post">
    <label><span>Current password <span class="req" aria-hidden="true">*</span></span>
      <input type="password" name="current" required autofocus>
    </label>
    <label><span>New password <span class="req" aria-hidden="true">*</span></span>
      <input type="password" name="new" minlength="8" maxlength="128" required>
    </label>
    <label><span>Confirm new password <span class="req" aria-hidden="true">*</span></span>
      <input type="password" name="confirm" minlength="8" maxlength="128" required>
    </label>
    <button type="submit">Update password</button>
  </form>
  <p class="muted small" style="margin-top:10px">At least 8 characters. Not your Employee ID, your name, a common word or one of your last 5 passwords.</p>
</div>
{% endblock %}

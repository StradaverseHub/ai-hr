name: delivery-qualification
run-name: Delivery controller qualification · ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: ['codex/cicd-redesign-*']
    paths: ['scripts/delivery/**', '.github/workflows/delivery-qualification.yml', '.github/ci/ci-install-grant.mjs', '.github/ci/operator-release.mjs']
permissions: {contents: read, actions: read}
concurrency:
  group: delivery-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Evidence identity and every upgrade failure boundary
        run: node --test scripts/delivery/*.test.mjs
      - name: Multi-process ownership, crash recovery and stale completion
        run: python3 -m unittest discover -s scripts/delivery -p 'test_coordinator.py' -v
      - name: Real root versus application immutable-tree boundary
        run: sudo -n python3 -m unittest discover -s scripts/delivery -p 'test_seal.py' -v
  planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: ./.github/actions/setup-alpha
        with: {path: '.', mobile: 'false'}
      - name: File-read closure refusal controls
        run: node --import tsx --test scripts/delivery/runtime-inputs.test.ts
      - name: Reconstruct the actual complete candidate inventory
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          node --import tsx scripts/delivery/plan.ts "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$(git merge-base HEAD origin/main)" "$RUNNER_TEMP/delivery-plan.json"
          node -e 'const p=require(process.argv[1]); console.log(JSON.stringify({policy:p.policy,profile:p.profile,checks:p.checks.length,inventory:p.inventory.length,bytes:require("fs").statSync(process.argv[1]).size,reasons:p.reasons}));' "$RUNNER_TEMP/delivery-plan.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delivery-controller-qualification
          path: ${{ runner.temp }}/delivery-plan.json
          if-no-files-found: error
          retention-days: 14

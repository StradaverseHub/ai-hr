name: alpha-staging-loaded-diagnostics
run-name: Loaded unit diagnostic only · ${{ inputs.candidate_ref }}
on:
  workflow_dispatch:
    inputs:
      candidate_ref: {description: Original frozen branch, required: true, type: string}
      expected_sha: {description: Exact original candidate SHA, required: true, type: string}
      cleanup_controller: {description: Pure cleanup controller and packaging controls only, required: false, default: false, type: boolean}
permissions: {contents: read, actions: read}
concurrency:
  group: alpha-loaded-diagnostic-${{ inputs.candidate_ref }}
  cancel-in-progress: false
env:
  TZ: Asia/Kuala_Lumpur
  DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', persist-credentials: false}
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_BASE_SHA: ${{ vars.STAGING_DEPLOYED_SHA }}
        run: node .github/ci/resolve.mjs
  loaded-unit:
    if: ${{ !inputs.cleanup_controller }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: {unit: [nodb-3, nodb-4]}
    defaults: {run: {working-directory: source}}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.resolve.outputs.sha }}', path: source, fetch-depth: 0, persist-credentials: false}
      - uses: ./automation/.github/actions/setup-alpha
      - name: Match original full-suite PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils python3-venv
          python3 -m venv "$RUNNER_TEMP/pdf-tools"
          "$RUNNER_TEMP/pdf-tools/bin/pip" install --quiet pymupdf
          echo "$RUNNER_TEMP/pdf-tools/bin" >> "$GITHUB_PATH"
      - run: node ../automation/.github/ci/diagnostics/instrument-nodb.mjs
      - name: Measure original loaded unit with one labelled instrumented target
        run: node ../automation/.github/ci/diagnostics/run-loaded-nodb.mjs "$UNIT"
        env: {UNIT: '${{ matrix.unit }}'}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-loaded-${{ matrix.unit }}
          path: ${{ runner.temp }}/diagnostic-loaded-*/
          if-no-files-found: error
          retention-days: 14
  cleanup-controller:
    if: ${{ inputs.cleanup_controller }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.1'}
      - name: Pure synthetic cleanup boundaries and original owned-engine controls
        run: |
          node --check .github/ci/post-arrival-cleanup-server.mjs
          node --check .github/ci/post-arrival-cleanup-runtime.mjs
          node --check .github/ci/post-arrival-cleanup-operator.mjs
          node --test .github/ci/post-arrival-cleanup-policy.test.mjs .github/ci/post-arrival-cleanup-session.test.mjs .github/ci/post-arrival-cleanup-io.test.mjs .github/ci/post-arrival-cleanup-operator.test.mjs .github/ci/post-arrival-source-snapshot.test.mjs .github/ci/staging-cleanup-protocol.test.mjs
          python3 .github/ci/cleanup-install.test.py
      - name: Package exact reviewed operator bytes without execution authority
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git fetch --no-tags origin f2ca511f4ded441399fd30437bb75553bb92efbb
          python3 .github/ci/post-arrival-cleanup-package.py "$RUNNER_TEMP/cleanup-tool" > "$RUNNER_TEMP/cleanup-package-summary.json"
          python3 .github/ci/post-arrival-cleanup-package.test.py "$RUNNER_TEMP/cleanup-tool"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleanup-controller-diagnostic-not-authority
          path: ${{ runner.temp }}/cleanup-package-summary.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleanup-operator-tool-not-execution-authority
          path: ${{ runner.temp }}/cleanup-tool/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

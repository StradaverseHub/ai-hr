name: ai-orchestrator-walkthrough
run-name: Production renderer only · ${{ inputs.candidate_ref }}
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Existing same-repository harness candidate branch
        required: true
        type: string
      expected_sha:
        description: Exact clean candidate SHA; no staging deployment
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: ai-orchestrator-renderer-${{ inputs.candidate_ref }}
  cancel-in-progress: false
env:
  TZ: Asia/Kuala_Lumpur
  LANG: en_US.UTF-8
  AIHR_CI_CONTROL_HEAD: ${{ github.workflow_sha }}
  AIHR_CI_PG_MEMORY_GIB: '2'
  AIHR_CI_PG_JIT: 'on'
jobs:
  resolve:
    if: ${{ github.repository == 'StradaverseHub/ai-hr' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - run: node --test .github/ci/orchestrator-browser.test.mjs
      - name: Resolve frozen candidate
        id: candidate
        run: node .github/ci/resolve.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_BASE_SHA: ${{ vars.STAGING_DEPLOYED_SHA }}
  production-renderer:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with:
          node: '20'
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and walk through the actual production renderer on fresh fictional data
        run: node ../automation/.github/ci/orchestrator-browser.mjs "$RUNNER_TEMP/orchestrator-production-renderer"
      - name: Preserve owned database evidence and clean up after interrupted walkthrough
        if: always()
        run: |
          cleanup_status=0
          if docker container inspect "aihr-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-db-1" >/dev/null 2>&1; then
            node --input-type=module <<'JS' || cleanup_status=$?
          import {mkdirSync, writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {capturePostgresEvidence, validatePostgresEvidence} from '../automation/.github/ci/postgres-evidence.mjs';
          import {CI_EXECUTION} from '../automation/.github/ci/manifest.mjs';
          const dir = join(process.env.RUNNER_TEMP, 'orchestrator-production-renderer');
          mkdirSync(dir, {recursive: true, mode: 0o700});
          try {
            const snapshot = capturePostgresEvidence('db-1');
            writeFileSync(join(dir, 'postgres-cleanup-evidence.json'), JSON.stringify({
              kind: 'INTERRUPTED_CLEANUP_ONLY', releaseEligible: false,
              sha: process.env.AIHR_CI_HEAD, controller: process.env.AIHR_CI_CONTROL_HEAD,
              run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, snapshot,
            }, null, 2) + '\n', {mode: 0o600});
            validatePostgresEvidence(snapshot, CI_EXECUTION);
          } catch (error) {
            writeFileSync(join(dir, 'postgres-cleanup-error.json'), JSON.stringify({error: String(error).slice(0, 3000)}) + '\n', {mode: 0o600});
            process.exitCode = 1;
          }
          JS
          fi
          timeout 20s bash ../automation/.github/ci/postgres.sh stop || cleanup_status=$?
          exit "$cleanup_status"
        env:
          AIHR_CI_UNIT: db-1
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orchestrator-production-renderer-development-evidence
          path: ${{ runner.temp }}/orchestrator-production-renderer/
          if-no-files-found: error
          retention-days: 14

name: worker-fence-metadata-prototype
run-name: Metadata prototype only · ${{ github.sha }}
on:
  push:
    branches: ['codex/worker-fence-metadata-prototype-*']
permissions:
  contents: read
jobs:
  metadata-prototype-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Existing descriptor and race controls, no release authority
        run: python3 -I -B test/fixtures/bank-import-worker-fences-tests.py
      - name: Frozen baseline first, two CPUs, real65322nodes and four roots
        run: python3 -I -B test/fixtures/bank-import-worker-fence-metadata-benchmark.py
      - name: Preserve actual development measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fence-metadata-prototype
          path: ${{ runner.temp }}/fence-metadata-prototype
          if-no-files-found: warn
          retention-days: 7

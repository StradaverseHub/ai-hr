name: mobile-sdk58-security-evaluation
run-name: Disposable SDK58 patched-glob evaluation · 4741774b2
on:
  push:
    branches: [codex/mobile-sdk58-eval-20261103]
    paths: [.github/workflows/mobile-sdk58-security-evaluation.yml]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 4741774b2839fb62365d5b5d89429142116948f1
          path: source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Install frozen SDK58 candidate
        run: |
          test "$(git -C source rev-parse HEAD)" = 4741774b2839fb62365d5b5d89429142116948f1
          npm ci --prefix source/mobile --no-audit --no-fund
      - name: Evaluate patched glob consumers without disabling peer checks
        working-directory: source/mobile
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.overrides={...p.overrides,glob:'14.0.3',minimatch:'11.0.4'};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --no-audit --no-fund
      - name: Check aligned SDK packages and widget entry
        working-directory: source/mobile
        run: |
          npm exec --offline -- expo install --check
          npm run eas-build-post-install
      - name: Rehearse real config plugins and fingerprint matching consumers
        working-directory: source/mobile
        run: |
          ./node_modules/.bin/expo prebuild --platform all --no-install
          node -e "const assert=require('assert/strict');const p=require('@expo/fingerprint/build/utils/Path');assert.equal(p.isIgnoredPath('node_modules/a/index.js',['**/node_modules/**']),true);assert.equal(p.isIgnoredPath('lib/auth.ts',['**/node_modules/**']),false)"
      - name: Capture audit without hiding its advisory exit code
        if: always()
        working-directory: source/mobile
        run: |
          mkdir -p "$RUNNER_TEMP/sdk58-evaluation"
          set +e
          npm audit --package-lock-only --omit=dev --ignore-scripts --json > "$RUNNER_TEMP/sdk58-evaluation/audit.json"
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/sdk58-evaluation/audit-exit.txt"
          cp package.json package-lock.json "$RUNNER_TEMP/sdk58-evaluation/"
      - name: Strict native typecheck on the disposable upgrade
        run: npm --prefix source/mobile run typecheck
      - name: Export both platform production bundles on the disposable upgrade
        working-directory: source/mobile
        run: npm exec --offline -- expo export --platform ios --platform android --max-workers 2 --output-dir "$RUNNER_TEMP/sdk58-evaluation-bundles"
      - name: Retain public package metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onehr-sdk58-evaluation-e57335aed
          path: ${{ runner.temp }}/sdk58-evaluation/
          retention-days: 1
          if-no-files-found: error

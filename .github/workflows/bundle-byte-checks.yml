name: Bundle byte checks
run-name: Bundle byte checks · ${{ github.sha }}
on:
  push:
    branches: [codex/audit-bundle-reduction-20261102]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed workflow and producer candidate
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: bundle-byte-checks-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Refuse a moved candidate
        if: github.event_name == 'workflow_dispatch'
        env: {EXPECTED: '${{ inputs.expected_sha }}'}
        run: test "$GITHUB_SHA" = "$EXPECTED"
      - name: Producer and receiver security fixtures
        run: |
          python3 .github/ci/build-bundle.test.py
          python3 .github/ci/build-transport-extract.test.py
          python3 .github/ci/build-activate.test.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - run: node --test .github/ci/build-artifact.test.mjs .github/ci/build-transport.test.mjs
  same-input:
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {path: candidate, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 5ffb75186cfeed7c569fc6eeaa3230fa2e560a29
          path: source
          persist-credentials: false
      - uses: ./candidate/.github/actions/setup-alpha
        with: {path: source, mobile: 'false', node: '22.23.3'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13124015164'
          run-id: '41405151781'
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/original-build'
          merge-multiple: true
      - name: Authenticate the original build packet
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh run view 41405151781 --repo StradaverseHub/ai-hr --json jobs > "$RUNNER_TEMP/producer-jobs.json"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {inspectCiBuildPacket} from './candidate/.github/ci/build-artifact.mjs';
          const jobs=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/producer-jobs.json')).jobs;
          const build=jobs.find(j=>j.name==='build');
          if(build?.conclusion!=='success')throw Error('Original producing job did not succeed');
          const result=inspectCiBuildPacket(process.env.RUNNER_TEMP+'/original-build',{
            candidate:'17b4321508bec1441f05b812e2c2a6b8ab94b1fb',controller:'22f5073e7f673058806e754a4d98ced3507c510a',
            runId:41405151781,controllerBranch:'main',producerStartedAt:build.startedAt,producerCompletedAt:build.completedAt});
          writeFileSync(process.env.RUNNER_TEMP+'/authenticated-input.json',JSON.stringify(result));
          JS
      - name: Compare frozen bytes and restore with the unchanged receiver
        run: |
          mkdir -m 700 "$RUNNER_TEMP/bundle-comparison"
          chmod 700 source
          python3 candidate/.github/ci/build-bundle-compare.py source candidate "$RUNNER_TEMP/original-build" "$RUNNER_TEMP/bundle-comparison"
          cp "$RUNNER_TEMP/authenticated-input.json" "$RUNNER_TEMP/bundle-comparison/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bundle-comparison-not-release
          path: '${{ runner.temp }}/bundle-comparison/*.json'
          if-no-files-found: warn
          retention-days: 30

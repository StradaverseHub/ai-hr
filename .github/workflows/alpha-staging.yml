    needs: [resolve, plan]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_CI_MIGRATION_BASE: ${{ needs.resolve.outputs.base }}
      DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      AIHR_CI_CAPACITY_PROFILE: bounded-canonical-build
      NODE_OPTIONS: --max-old-space-size=6144
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with: {node: '22.23.3', mobile: 'false', capacity_profile: bounded-canonical-build}
      - name: Require both frozen AI source manifests before building
        run: node ../automation/.github/ci/ai-manifest-admission.mjs . "$AIHR_CI_HEAD"
      - name: Bind compiler cache to CI build context
        id: next-cache-context
        continue-on-error: true
        timeout-minutes: 1
        run: |
          cache_runtime="$(node -p '[process.platform, process.arch, process.versions.node].join("-")')"
          test -f deploy/css-cache-guard.sh
          test ! -L deploy/css-cache-guard.sh
          cache_css="$(bash -c '. deploy/css-cache-guard.sh; aihr_css_inputs_hash')"
          test "${#cache_css}" -eq 64
          case "$cache_css" in *[!a-f0-9]*) exit 1 ;; esac
          printf 'prefix=aihr-next-compiler-v2-ubuntu24-%s-%s-%s\n' "$cache_runtime" "$cache_css" "${{ hashFiles('source/pnpm-lock.yaml', 'source/package.json', 'source/next.config.ts', 'source/tsconfig.json', 'source/tsconfig.build.json', 'source/.env.example', 'source/scripts/improve/system-testing-next-config.ts', 'source/deploy/css-cache-guard.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Restore optional Turbopack compiler cache
        id: next-cache
        if: ${{ steps.next-cache-context.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: source/.next/cache/turbopack
          key: ${{ steps.next-cache-context.outputs.prefix }}-${{ needs.resolve.outputs.sha }}
          restore-keys: ${{ steps.next-cache-context.outputs.prefix }}-
          enableCrossOsArchive: false
          fail-on-cache-miss: false
        env: {SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'}
      # Bounded next build heap: exactly 8192 MB, only the canonical build step, only on a GitHub-hosted
      # 16 GB Linux runner; the job-level 6144 stays for every other step. build-heap.mjs refuses any other
      # runner and any value above 8192; raising the ceiling needs owner review
      # (docs/reviews/build-capacity-8192-proposal.md). Rollback: revert restores 6144.
      - name: Admit bounded next build heap
        id: build-heap
        run: node ../automation/.github/ci/build-heap.mjs admit
        env: {AIHR_CI_BUILD_HEAP_MB: '8192'}
      - name: Canonical System Testing production build and byte bundle
        run: pnpm exec tsx ../automation/.github/ci/next-application-cache.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: ${{ steps.build-heap.outputs.node_options }}
          AIHR_CI_BUILD_HEAP_PROFILE: ${{ steps.build-heap.outputs.heap_profile }}
          AIHR_CI_BUILD_HEAP_MEMTOTAL_KIB: ${{ steps.build-heap.outputs.memtotal_kib }}
      - name: Publish mandatory canonical build packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-build-v1
          path: ${{ runner.temp }}/production-build/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Publish optional application compiler graph
        if: ${{ success() && github.event_name != 'pull_request' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-application-state-v1
          path: ${{ runner.temp }}/next-application-state-packet/
          if-no-files-found: warn
          retention-days: 1
      - name: Preserve failed canonical build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-application-build-failure
          path: |
            ${{ runner.temp }}/normal-next-application-cache/comparison.json
            ${{ runner.temp }}/normal-next-application-cache/canonical-build.log
            ${{ runner.temp }}/normal-next-application-cache/application-typegen.log
          if-no-files-found: warn
          retention-days: 3
      - name: Bound optional compiler cache upload
        id: next-cache-budget
        if: ${{ success() && steps.next-cache-context.outcome == 'success' && steps.next-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        run: |
          if [ -d .next/cache/turbopack ] && [ ! -L .next/cache/turbopack ]; then
            cache_kib="$(du -sk .next/cache/turbopack | cut -f1)"
            if [[ "$cache_kib" =~ ^[0-9]+$ ]] && [ "$cache_kib" -le 1048576 ]; then
              echo 'eligible=true' >> "$GITHUB_OUTPUT"
              echo "Compiler cache: ${cache_kib} KiB; within the 1 GiB per-entry upload bound."
            else
              echo 'Compiler cache upload skipped: exceeds the per-entry bound.'
            fi
          else
            echo 'Compiler cache upload skipped: no regular compiler cache directory.'
          fi
      - name: Save optional Turbopack compiler cache
        if: ${{ success() && steps.next-cache-budget.outputs.eligible == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: source/.next/cache/turbopack
          key: ${{ steps.next-cache-context.outputs.prefix }}-${{ needs.resolve.outputs.sha }}
          enableCrossOsArchive: false
  test:
    if: ${{ (!inputs.diagnostics_only && !inputs.build_only && needs.plan.outputs.has_tests == 'true') && false }}
    name: test (${{ matrix.unit }})
    needs: [resolve, plan]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_CI_MIGRATION_BASE: ${{ needs.resolve.outputs.base }}
    timeout-minutes: ${{ matrix.employeeLifecycle && 30 || 120 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.test_parallelism || '48') }}
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    steps:
      - name: Anchor first executable employee lifecycle job step
        if: ${{ matrix.employeeLifecycle }}
        working-directory: ${{ runner.temp }}
        env: {UNIT: '${{ matrix.unit }}'}
        run: |
          /usr/bin/python3 -I -B <<'PYTHON'
          import json,os,re,time
          from pathlib import Path
          unit=os.environ['UNIT']
          assert re.fullmatch(r'db-[0-9a-f]{16}',unit)
          assert os.environ['GITHUB_JOB']=='test' and os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert all(re.fullmatch(r'[a-f0-9]{40}',os.environ[key]) for key in ('AIHR_CI_HEAD','AIHR_CI_CONTROL_HEAD'))
          assert re.fullmatch(r'[1-9][0-9]*',os.environ['GITHUB_RUN_ID'])
          root=Path(os.environ['RUNNER_TEMP']).resolve();directory=root/'aihr-ci';directory.mkdir(mode=0o700)
          anchor={'version':1,'run':os.environ['GITHUB_RUN_ID'],'attempt':'1','job':'test','unit':unit,
                  'source':os.environ['AIHR_CI_HEAD'],'controller':os.environ['AIHR_CI_CONTROL_HEAD'],
                  'bootId':Path('/proc/sys/kernel/random/boot_id').read_text().strip(),
                  'startNs':str(time.monotonic_ns()),'wallTimeNs':str(time.time_ns())}
          path=directory/(unit+'-employee-job-anchor.json')
          fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          try:
              data=json.dumps(anchor,separators=(',',':')).encode();assert os.write(fd,data)==len(data)
          finally:
              os.close(fd)
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('AIHR_EMPLOYEE_JOB_ANCHOR='+str(path)+'\n')
          PYTHON
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with: {capacity_profile: "${{ github.run_attempt == 1 && 'bounded-suite-setup' || 'legacy' }}"}
      - name: Source-bound PDF dependencies for this complete unit
        env: {UNIT: '${{ matrix.unit }}'}
        run: node ../automation/.github/ci/pdf-tools.mjs --unit "$UNIT"
      - name: Preserve suite headroom after PDF tooling
        if: ${{ github.run_attempt == 1 }}

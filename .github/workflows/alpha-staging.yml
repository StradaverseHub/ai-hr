name: Sharp package identity diagnostic
run-name: Read-only Sharp package identity · frozen9bf
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: recovery-controls
        options: [recovery-controls, shim-repair, authority-controls, identity]
permissions:
  contents: read
  actions: read
concurrency:
  group: sharp-identity-9bf-diagnostic
  cancel-in-progress: false
env:
  AIHR_CI_CONTROL_HEAD: ${{ github.workflow_sha }}
  AIHR_CI_HEAD: 9bf924ff3389fd5f5a41c03d062a40c429216585
  DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  NODE_OPTIONS: --max-old-space-size=6144
  TZ: Asia/Kuala_Lumpur
  LANG: en_US.UTF-8
jobs:
  build:
    if: inputs.mode == 'identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9bf924ff3389fd5f5a41c03d062a40c429216585
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with: {node: '22.23.3', mobile: 'false', capacity_profile: bounded-canonical-build}
      - name: Capture actual package files without application build or tests
        run: python3 -I ../automation/.github/ci/diagnostics/sharp-identity.py "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/sharp-identity/clean"
      - name: Reproduce the production incremental installation flags in this disposable runner only
        env: {NODE_ENV: production}
        run: pnpm install --frozen-lockfile --prod=false
      - name: Capture the incremental package without application build or tests
        run: python3 -I ../automation/.github/ci/diagnostics/sharp-identity.py "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/sharp-identity/incremental"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sharp-package-identity-diagnostic
          path: ${{ runner.temp }}/sharp-identity/
          if-no-files-found: error
          retention-days: 3

  recovery-controls:
    if: inputs.mode == 'recovery-controls' || inputs.mode == 'shim-repair' || inputs.mode == 'authority-controls'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Candidate disambiguation refusal controls
        if: inputs.mode == 'recovery-controls'
        run: node --test .github/ci/other-controller-run.test.mjs
      - name: Private generated-shim filesystem controls
        if: inputs.mode == 'recovery-controls'
        env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python3 -I .github/ci/diagnostics/sharp-restore.test.py
      - name: Retest failed collision fixture and its late-race control only
        if: inputs.mode == 'shim-repair'
        env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python3 -I .github/ci/diagnostics/sharp-restore.test.py Restore.test_preexisting_temp_preserved Restore.test_late_temp_collision_preserved
      - name: Parse changed authority and transport proof controls only
        if: inputs.mode == 'authority-controls'
        env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: |
          python3 -I .github/ci/diagnostics/sharp-restore.test.py Restore.test_real_authority_program_parses_without_importing_application
          node --test .github/ci/diagnostics/sharp-restore-transport.test.mjs
          node --experimental-vm-modules --test .github/ci/diagnostics/sharp-authority.test.mjs
          node --test .github/ci/diagnostics/forward-guards.test.mjs

name: Source verification batching benchmark
run-name: Immutable source verification controls and benchmark
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: integration-only
        options: [integration-only, compatibility-only, compiler-only, all]
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AIHR_CI_CONTROL_HEAD: ${{ github.workflow_sha }}
      AIHR_CI_HEAD: ${{ github.workflow_sha }}
      AIHR_COMPILER_CACHE_MODE: whole
      AIHR_CI_CAPACITY_PROFILE: bounded-whole-compiler
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: source
          persist-credentials: false
      - uses: ./source/.github/actions/setup-alpha
        with: {node: '22.23.3', mobile: 'true', capacity_profile: bounded-whole-compiler}
      - name: Pure private Git reader controls
        if: inputs.mode == 'all'
        working-directory: source
        run: node --experimental-strip-types --test .github/ci/diagnostics/committed-source-blobs.test.mjs
      - name: Check new empty-catalogue compatibility control only
        if: inputs.mode == 'compatibility-only'
        working-directory: source
        run: node --experimental-strip-types --test --test-name-pattern='empty reviewed catalogue' .github/ci/diagnostics/committed-source-blobs.test.mjs
      - name: Measure exact immutable bytes and actual Git process counts
        if: inputs.mode == 'all'
        working-directory: source
        run: node --experimental-strip-types .github/ci/diagnostics/committed-source-benchmark.mjs . "$RUNNER_TEMP/source-batch-benchmark.json"
      - name: Start only job-owned disposable database required by existing classifier
        if: inputs.mode != 'compiler-only'
        working-directory: source
        env: {AIHR_CI_UNIT: db-1, AIHR_CI_PG_MEMORY_GIB: '2', AIHR_CI_PG_JIT: 'on'}
        run: bash .github/ci/postgres.sh reset
      - name: Existing provenance integration boundaries with classified DB scope
        if: inputs.mode != 'compiler-only'
        working-directory: source
        env:
          DATABASE_URL: postgres://ai_hr_app@127.0.0.1:5433/ai_hr_test
          MIGRATION_DATABASE_URL: postgres://postgres@127.0.0.1:5433/ai_hr_test
          TEST_DATABASE_URL: postgres://ai_hr_app@127.0.0.1:5433/ai_hr_test
          TEST_MIGRATION_DATABASE_URL: postgres://postgres@127.0.0.1:5433/ai_hr_test
          TEST_DB_NAMESPACE: cs_${{ github.run_id }}
          AIHR_SOURCE_COMPATIBILITY_ONLY: ${{ inputs.mode == 'compatibility-only' }}
        run: pnpm exec tsx .github/ci/diagnostics/run-source-integration.mjs
      - name: Remove only this job's database and volume
        if: always() && inputs.mode != 'compiler-only'
        working-directory: source
        env: {AIHR_CI_UNIT: db-1, AIHR_CI_PG_MEMORY_GIB: '2', AIHR_CI_PG_JIT: 'on'}
        run: bash .github/ci/postgres.sh stop
      - name: Whole TypeScript check
        working-directory: source
        run: |
          pnpm exec next typegen
          bash .github/ci/typecheck.sh --whole-cache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: immutable-source-batching-benchmark
          path: |
            ${{ runner.temp }}/source-batch-benchmark.json
            ${{ runner.temp }}/source-integration-reports/
            ${{ runner.temp }}/whole-compiler-state-packet/
            ${{ runner.temp }}/compiler-transport-swap-cleanup.json
          if-no-files-found: warn
          retention-days: 3

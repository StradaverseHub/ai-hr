      - env: {GH_TOKEN: '${{ github.token }}'}
        run: node ../automation/.github/ci/verify-shards.mjs "$RUNNER_TEMP/aihr-ci" "$RUNNER_TEMP/ci-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ runner.temp }}/aihr-ci
          pattern: unit-*
          merge-multiple: false
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: node ../automation/.github/ci/verify-shards.mjs "$RUNNER_TEMP/aihr-ci" "$RUNNER_TEMP/ci-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-evidence
          path: ${{ runner.temp }}/ci-receipt.json
          if-no-files-found: error
          retention-days: 30
  commission-summary:
    needs: [resolve, plan, test, native-test]
    if: ${{ (always() && inputs.commission_singleton_units && needs.resolve.result == 'success' && needs.plan.result == 'success') && false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_CI_MIGRATION_BASE: ${{ needs.resolve.outputs.base }}
      AIHR_CI_CLASSIFIER_RUNTIME: native
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: commission-plan
          path: ${{ runner.temp }}/commission-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: commission-unit-*
          path: ${{ runner.temp }}/commission-reports
          merge-multiple: false
      - name: Verify selected native reports without a release receipt
        env: {GH_TOKEN: '${{ github.token }}'}
        run: node ../automation/.github/ci/singleton-commissioning.mjs summary "$RUNNER_TEMP/commission-plan/commission-selection.json" "$RUNNER_TEMP/commission-reports" "$RUNNER_TEMP/singleton-commissioning.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commission-summary
          path: ${{ runner.temp }}/singleton-commissioning.json
          if-no-files-found: error
          retention-days: 14
  deployment-hold:
    needs: [resolve, verify]
    if: ${{ (always() && needs.resolve.result == 'success') && false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Deployment remains disabled
        env:
          STAGING_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          test "$STAGING_ENABLED" = false
          test "$PRODUCTION_ENABLED" = false
          echo 'CI only. Board 3 retains staging release ownership. Main deployment is disabled.' >> "$GITHUB_STEP_SUMMARY"

name: Source verification batching benchmark
run-name: Immutable source verification controls and benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AIHR_CI_CONTROL_HEAD: ${{ github.workflow_sha }}
      AIHR_CI_HEAD: ${{ github.workflow_sha }}
      DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: source
          persist-credentials: false
      - uses: ./source/.github/actions/setup-alpha
        with: {node: '22.23.3', mobile: 'false', capacity_profile: bounded-canonical-build}
      - name: Pure private Git reader controls
        working-directory: source
        run: node --experimental-strip-types --test .github/ci/diagnostics/committed-source-blobs.test.mjs
      - name: Measure exact immutable bytes and actual Git process counts
        working-directory: source
        run: node --experimental-strip-types .github/ci/diagnostics/committed-source-benchmark.mjs . "$RUNNER_TEMP/source-batch-benchmark.json"
      - name: Existing provenance integration boundaries
        working-directory: source
        run: pnpm exec vitest run test/system-testing-release-publication.test.ts test/system-testing-next-config.test.ts test/system-testing-build-identity.test.ts --maxWorkers=2
      - name: Whole TypeScript check
        working-directory: source
        run: pnpm exec tsc --noEmit --incremental false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: immutable-source-batching-benchmark
          path: ${{ runner.temp }}/source-batch-benchmark.json
          if-no-files-found: warn
          retention-days: 3

name: alpha-staging-ci
run-name: ${{ inputs.native_tool_only && 'Protected native TOOL only' || inputs.commission_singleton_units && 'Singleton commissioning only' || inputs.build_only && 'Canonical build only' || inputs.controller_only && 'CI controller checks' || inputs.diagnostics_only && 'Runner diagnostics' || 'Alpha CI' }} · ${{ inputs.candidate_ref || github.head_ref || 'alpha' }}
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Existing same-repository branch (CI only; staging deploy remains held)
        default: alpha
        required: true
        type: string
      expected_sha:
        description: Exact 40-character candidate SHA (refuse if the branch moved)
        required: true
        type: string
      test_parallelism:
        description: Standard runner concurrency; complete test coverage stays unchanged
        type: choice
        default: '48'
        options: ['4', '8', '16', '20', '32', '40', '48']
      commission_singleton_units:
        description: Development only; JSON array of 1–16 registered singleton unit IDs, never a complete gate
        required: false
        default: ''
        type: string
      build_only:
        description: Canonical byte build only; never emits a gate PASS
        required: false
        default: false
        type: boolean
      diagnostics_only:
        description: Measure disposable runner resources without the full CI gate
        required: false
        default: false
        type: boolean
      controller_only:
        description: Pure CI controller checks only; requires diagnostics_only and never supplies release evidence
        required: false
        default: false
        type: boolean
      native_tool_only:
        description: Protected same-source tool installation and disposal only
        required: false
        default: false
        type: boolean
  push:
    branches: [alpha]
  pull_request:
    branches: [alpha]
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  actions: read
concurrency:
  group: alpha-ci-${{ inputs.candidate_ref || github.head_ref || github.ref }}-${{ inputs.native_tool_only && 'tool-only' || inputs.commission_singleton_units && 'commissioning' || inputs.build_only && 'build-only' || inputs.diagnostics_only && 'diagnostics' || 'gate' }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  TZ: Asia/Kuala_Lumpur
  LANG: en_US.UTF-8
  AIHR_CI_CONTROL_HEAD: ${{ github.workflow_sha }}
  AIHR_CI_PG_PROFILE: '2'
  AIHR_CI_PG_CONFIGURED_CAP_BYTES: '2113929216'
  AIHR_CI_PG_PEAK_BUDGET_BYTES: '2147483648'
  AIHR_CI_PG_JIT: 'on'
jobs:
  resolve:
    if: ${{ github.repository == 'StradaverseHub/ai-hr' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      branch: ${{ steps.candidate.outputs.branch }}
      base: ${{ steps.candidate.outputs.base }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require the exclusive Next view-probe controller dispatch
        if: ${{ github.ref == 'refs/heads/codex/native-next-project-view-probe-20261109' }}
        shell: bash
        env:
          VIEW_REF: ${{ inputs.candidate_ref }}
          VIEW_EXPECTED: ${{ inputs.expected_sha }}
          VIEW_CONTROL: ${{ github.workflow_sha }}
          VIEW_PARALLELISM: ${{ inputs.test_parallelism }}
          VIEW_DIAGNOSTICS: ${{ inputs.diagnostics_only }}
          VIEW_CONTROLLER: ${{ inputs.controller_only }}
          VIEW_BUILD: ${{ inputs.build_only }}
          VIEW_TOOL: ${{ inputs.native_tool_only }}
          VIEW_COMMISSION: ${{ inputs.commission_singleton_units }}
          VIEW_STAGING_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
          VIEW_PRODUCTION_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$VIEW_REF" == "${GITHUB_REF#refs/heads/}" && "$VIEW_EXPECTED" == "$VIEW_CONTROL" && "$VIEW_EXPECTED" == "$GITHUB_SHA" ]]
          [[ "$VIEW_DIAGNOSTICS" == true && "$VIEW_CONTROLLER" == true && "$VIEW_BUILD" == false && "$VIEW_TOOL" == false ]]
          [[ -z "$VIEW_COMMISSION" && "$VIEW_PARALLELISM" == 4 ]]
          [[ "$VIEW_STAGING_ENABLED" == false && "$VIEW_PRODUCTION_ENABLED" == false ]]
      - name: Pin dependency-free controller runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Validate closed prehook TOOL intent
        if: ${{ inputs.native_tool_only }}
        shell: bash
        env:
          TOOL_CANDIDATE_REF: ${{ inputs.candidate_ref }}
          TOOL_EXPECTED_SHA: ${{ inputs.expected_sha }}
          TOOL_CONTROL_SHA: ${{ github.workflow_sha }}
          TOOL_PARALLELISM: ${{ inputs.test_parallelism }}
          TOOL_DIAGNOSTICS_ONLY: ${{ inputs.diagnostics_only }}
          TOOL_CONTROLLER_ONLY: ${{ inputs.controller_only }}
          TOOL_BUILD_ONLY: ${{ inputs.build_only }}
          TOOL_COMMISSION: ${{ inputs.commission_singleton_units }}
          TOOL_STAGING_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
          TOOL_PRODUCTION_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$GITHUB_REF" == refs/heads/codex/native-workload-tool-only-custody-repair-20261109 ]]
          [[ "$TOOL_CANDIDATE_REF" == "${GITHUB_REF#refs/heads/}" ]]
          [[ "$TOOL_EXPECTED_SHA" == "$TOOL_CONTROL_SHA" && "$TOOL_EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$TOOL_DIAGNOSTICS_ONLY" == true && "$TOOL_CONTROLLER_ONLY" == false && "$TOOL_BUILD_ONLY" == false ]]
          [[ -z "$TOOL_COMMISSION" && "$TOOL_PARALLELISM" == 4 ]]
          [[ "$TOOL_STAGING_ENABLED" == false && "$TOOL_PRODUCTION_ENABLED" == false ]]
      - name: Validate exclusive bounded commissioning intent
        run: node .github/ci/singleton-commissioning.mjs intent
      - name: Refuse an invalid controller-only selection
        if: ${{ inputs.controller_only }}
        env:
          DIAGNOSTICS_ONLY: ${{ inputs.diagnostics_only }}
          EVENT: ${{ github.event_name }}
          EXPECTED: ${{ inputs.expected_sha }}
          CONTROL: ${{ github.workflow_sha }}
        run: test "$DIAGNOSTICS_ONLY" = true && test "$EVENT" = workflow_dispatch && test "$EXPECTED" = "$CONTROL"
      - name: Refuse invalid build-only execution
        if: ${{ inputs.build_only }}
        env:
          EVENT: ${{ github.event_name }}
          DIAGNOSTICS_ONLY: ${{ inputs.diagnostics_only }}
          CONTROLLER_ONLY: ${{ inputs.controller_only }}
        run: test "$EVENT" = workflow_dispatch && test "$DIAGNOSTICS_ONLY" = false && test "$CONTROLLER_ONLY" = false
      - name: CI integrity regression checks
        run: node --experimental-strip-types --test .github/ci/build-source-binding.test.mjs .github/ci/ai-manifest-admission.test.mjs .github/ci/rsync-packet-capability.test.mjs .github/ci/pdf-tool-scope.test.mjs .github/ci/pdf-tools.test.mjs .github/ci/compiler-cache.test.mjs .github/ci/cache-artifact-discovery.test.mjs .github/ci/compiler-wrapper.test.mjs .github/ci/diagnostics/compiler-compatible.test.mjs .github/ci/diagnostics/compiler-state.test.mjs .github/ci/runner-capacity.test.mjs .github/ci/diagnostics/compiler-cleanup.test.mjs .github/ci/ci.test.mjs .github/ci/release-policy.test.mjs .github/ci/archive-downloads.test.mjs .github/ci/prefetch-ci.test.mjs .github/ci/migration-history.test.mjs .github/ci/manifest.test.mjs .github/ci/singleton-profiles.test.mjs .github/ci/singleton-commissioning.test.mjs .github/ci/native-next-build-packet.test.mjs .github/ci/candidate-environment.test.mjs .github/ci/native-next-build-inputs.test.mjs .github/ci/db-scheduling.test.mjs .github/ci/duration-order.test.mjs .github/ci/r395-write-split.test.mjs .github/ci/attendance-unclocked-split.test.mjs .github/ci/postgres-evidence.test.mjs .github/ci/report-run-cost.test.mjs .github/ci/resume-assessment.test.mjs .github/ci/resume-source.test.mjs .github/ci/resume-repair.test.mjs .github/ci/repair-impact.test.mjs .github/ci/build-production.test.mjs .github/ci/build-artifact.test.mjs .github/ci/build-transport.test.mjs .github/ci/ci-build-transport-policy.test.mjs .github/ci/next-application-cache.test.mjs .github/ci/next-build-cache-policy.test.mjs .github/ci/next-application-restore.test.mjs .github/ci/staging-transport.test.mjs .github/ci/staging-build-install.test.mjs .github/ci/staging-ci-promotion.test.mjs .github/ci/staging-migration-ledger.test.mjs .github/ci/staging-environment.test.mjs .github/ci/staging-preflight.test.mjs .github/ci/customer-runtime-transition.test.mjs .github/ci/customer-runtime-snapshot.test.mjs .github/ci/staging-cleanup-protocol.test.mjs .github/ci/normal-cleanup-session.test.mjs .github/ci/normal-cleanup-io.test.mjs .github/ci/focused-recovery.test.mjs .github/ci/repair-recovery.test.mjs .github/ci/repair-recovery-adapter.test.mjs .github/ci/browser-recovery.test.mjs .github/ci/build-heap.test.mjs .github/ci/orchestrator-browser.test.mjs
      - name: Build byte transport regression checks
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/staging -p "test_*.py"
          node --test scripts/staging/lease.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/staging/pilot.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/releases -p "test_*.py"
          PYTHONDONTWRITEBYTECODE=1 python3 .github/ci/build-bundle.test.py
          PYTHONDONTWRITEBYTECODE=1 python3 .github/ci/build-transport-extract.test.py
          PYTHONDONTWRITEBYTECODE=1 python3 .github/ci/build-helper-cleanliness.test.py
          PYTHONDONTWRITEBYTECODE=1 python3 .github/ci/build-activate.test.py
          PYTHONDONTWRITEBYTECODE=1 python3 .github/ci/focused-recovery-extract.test.py
          PYTHONDONTWRITEBYTECODE=1 python3 .github/ci/repair-recovery-extract.test.py
      - name: Verify fixed TOOL source models before acquisition
        if: ${{ inputs.native_tool_only }}
        run: |
          /usr/bin/python3 -I -B .github/ci/test_native_controller_bootstrap.py -v
          /usr/bin/python3 -I -B .github/ci/native-workload-browser-toolchain.test.py -v
          /usr/bin/python3 -I -B .github/ci/native-workload-browser-tool-installation.test.py -v
          /usr/bin/python3 -I -B .github/ci/native-workload-browser-tool-course.test.py -v
      - name: Resolve frozen candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_BASE_SHA: ${{ vars.STAGING_DEPLOYED_SHA }}
        run: node .github/ci/resolve.mjs
      - name: Reconstruct complete current source manifest without application dependencies
        if: ${{ inputs.controller_only }}
        env:
          AIHR_CI_HEAD: ${{ steps.candidate.outputs.sha }}
          AIHR_CI_MIGRATION_BASE: ${{ vars.STAGING_DEPLOYED_SHA }}
          AIHR_CI_CLASSIFIER_RUNTIME: native
        run: |
          node --experimental-strip-types .github/ci/plan.mjs > "$RUNNER_TEMP/controller-plan.json"
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          import {DB_BATCH_FILES} from './.github/ci/manifest.mjs';
          const plan=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/controller-plan.json'));
          const hints=JSON.parse(readFileSync('.github/ci/db-duration-hints.json'));
          const db=plan.units.filter(u=>u.kind==='db'),isolated=db.filter(u=>u.singleton),ordinary=db.filter(u=>!u.singleton),files=ordinary.flatMap(u=>u.files).sort(),old=[];
          for(let i=0;i<files.length;i+=DB_BATCH_FILES)old.push(files.slice(i,i+DB_BATCH_FILES));
          assert.deepEqual(ordinary.flatMap(u=>u.files).sort(),old.flat().sort());assert.equal(ordinary.length,old.length);assert(isolated.every(u=>u.files.length===1&&u.singleton.workers===1));
          const estimate=group=>group.reduce((ms,f)=>ms+(hints.durationsMs[f]??hints.unknownDurationMs),0);
          const report={kind:'SCHEDULING_MODEL_NOT_RUNTIME_OR_PASS',candidate:plan.sha,controller:plan.controller,policy:plan.policyVersion,runId:process.env.GITHUB_RUN_ID,dbFiles:files.length+isolated.length,dbUnits:db.length,singletonUnits:isolated.map(u=>u.id),maximumFiles:DB_BATCH_FILES,workers:plan.execution.workers,scheduling:plan.execution.scheduling,oldAlphabeticalMaximumSummedFileMs:Math.max(...old.map(estimate)),balancedMaximumSummedFileMs:Math.max(...ordinary.map(u=>estimate(u.files))),unknownFiles:files.filter(f=>!Object.hasOwn(hints.durationsMs,f)),completeClassifierInventoryUnchanged:true,releaseAuthorized:false,warning:'Overlapping historical file intervals are advisory weights, not job elapsed times or predicted speedups.'};
          writeFileSync(process.env.RUNNER_TEMP+'/scheduling-model.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));
          NODE
      - if: ${{ inputs.controller_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controller-plan-diagnostics
          path: |
            ${{ runner.temp }}/controller-plan.json
            ${{ runner.temp }}/scheduling-model.json
          if-no-files-found: error
          retention-days: 3
      - name: Verify the synthetic Next project-view capability
        id: next_view_probe
        if: ${{ inputs.controller_only && github.ref == 'refs/heads/codex/native-next-project-view-probe-20261109' }}
        timeout-minutes: 1
        shell: bash
        env:
          AIHR_CI_HEAD: ${{ steps.candidate.outputs.sha }}
          VIEW_STAGING_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
          VIEW_PRODUCTION_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          GLIBC_TUNABLES: ''
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: |
          [[ "$AIHR_CI_HEAD" == "$GITHUB_SHA" && "$AIHR_CI_HEAD" == "$AIHR_CI_CONTROL_HEAD" ]]
          [[ "$VIEW_STAGING_ENABLED" == false && "$VIEW_PRODUCTION_ENABLED" == false ]]
          /usr/bin/python3 -I -B .github/ci/test_native_controller_bootstrap.py -v ViewProbeControls
          umask 077
          set -o noclobber
          mkdir -m 700 "$RUNNER_TEMP/aihr-next-view-probe"
          status=0
          /usr/bin/python3 -I -B .github/ci/native-controller-bootstrap.py --next-view-probe > "$RUNNER_TEMP/aihr-next-view-probe/next-project-view-probe.json" || status=$?
          /usr/bin/python3 -I -B .github/ci/native-controller-bootstrap.py --check-next-view-probe "$status"
          echo 'receipt=true' >> "$GITHUB_OUTPUT"
          exit "$status"
      - if: ${{ always() && steps.next_view_probe.outputs.receipt == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-project-view-probe
          path: ${{ runner.temp }}/aihr-next-view-probe/next-project-view-probe.json
          if-no-files-found: error
          retention-days: 3
  typecheck:
    if: ${{ !inputs.diagnostics_only && !inputs.build_only && !inputs.commission_singleton_units }}
    needs: resolve
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_CI_MIGRATION_BASE: ${{ needs.resolve.outputs.base }}
      AIHR_COMPILER_CACHE_MODE: whole
      AIHR_CI_CAPACITY_PROFILE: ${{ github.run_attempt == 1 && 'bounded-whole-compiler' || 'legacy' }}
      DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with:
          node: '22.23.3'
          capacity_profile: ${{ github.run_attempt == 1 && 'bounded-whole-compiler' || 'legacy' }}
      - run: pnpm exec next typegen
      - name: Whole current compiler with authenticated graph or cold fallback
        if: ${{ github.run_attempt == 1 }}
        run: bash ../automation/.github/ci/typecheck.sh --whole-cache
      - name: Preserve legacy whole compiler on rerun attempts
        if: ${{ github.run_attempt != 1 }}
        run: bash ../automation/.github/ci/typecheck.sh
      - name: Bind actual owned-resource cleanup before graph publication
        if: ${{ github.run_attempt == 1 && github.event_name != 'pull_request' }}
        run: |
          test -f "$RUNNER_TEMP/compiler-transport-swap-cleanup.json"
          test ! -e "$RUNNER_TEMP/whole-compiler-state-packet/swap-cleanup.json"
          cp "$RUNNER_TEMP/compiler-transport-swap-cleanup.json" "$RUNNER_TEMP/whole-compiler-state-packet/swap-cleanup.json"
      - if: ${{ github.run_attempt == 1 && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: whole-compiler-state-v1
          path: ${{ runner.temp }}/whole-compiler-state-packet/
          if-no-files-found: error
          retention-days: 1
  migrations:
    if: ${{ !inputs.diagnostics_only && !inputs.build_only && !inputs.commission_singleton_units }}
    needs: resolve
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_CI_MIGRATION_BASE: ${{ needs.resolve.outputs.base }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - run: node ../automation/.github/ci/check-migration-order.mjs "$BASE"
        env: {BASE: '${{ needs.resolve.outputs.base }}'}
  runner-diagnostics:
    if: ${{ inputs.diagnostics_only && !inputs.controller_only && !inputs.native_tool_only }}
    needs: resolve
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_SUITE_CAPACITY_PILOT: 'true'
      DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Runner capacity before dependencies
        run: |
          df -Pk . "$RUNNER_TEMP" /var/lib/docker
          for p in /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup; do
            if [ -d "$p" ]; then sudo du -sx -B1 "$p"; fi
          done
      - uses: ./automation/.github/actions/setup-alpha
        with: {capacity_profile: "${{ github.run_attempt == 1 && 'bounded-suite-setup' || 'legacy' }}"}
      - name: Record measured capacity and unused SDK sizes
        run: node ../automation/.github/ci/runner-diagnostics.mjs
        env: {AIHR_CAPACITY_REPORT_PROFILE: "${{ github.run_attempt == 1 && 'bounded-suite-ready' || 'legacy' }}"}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-resources
          path: |
            ${{ runner.temp }}/runner-resources.json
            ${{ runner.temp }}/suite-capacity-preparation.log
          if-no-files-found: error
          retention-days: 3
  controller-tests:
    if: ${{ !inputs.diagnostics_only && !inputs.build_only && !inputs.commission_singleton_units }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with: {capacity_profile: "${{ github.run_attempt == 1 && 'bounded-suite-setup' || 'legacy' }}"}
      - name: Owned Linux install cleanup and immutable byte inventory controls
        run: |
          python3 ../automation/.github/ci/cleanup-install.test.py -v
          python3 ../automation/.github/ci/build-bundle.test.py -v
      - name: Exercise actual official detached-deploy helpers with shim transport
        run: node --import tsx --test ../automation/.github/ci/operator-flow.test.mjs ../automation/.github/ci/normal-cleanup-operator.test.mjs ../automation/.github/ci/build-source-binding.test.mjs ../automation/.github/ci/next-build-launcher.test.mjs ../automation/.github/ci/staging-source-transfer.test.mjs ../automation/.github/ci/staging-launcher.test.mjs
  plan:
    outputs:
      test_matrix: ${{ steps.matrix.outputs.test_matrix }}
      native_matrix: ${{ steps.matrix.outputs.native_matrix }}
      has_tests: ${{ steps.matrix.outputs.has_tests }}
      has_native: ${{ steps.matrix.outputs.has_native }}
    if: ${{ !inputs.diagnostics_only && !inputs.build_only }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_CI_MIGRATION_BASE: ${{ needs.resolve.outputs.base }}
      AIHR_CI_CLASSIFIER_RUNTIME: native
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Require both frozen AI source manifests before planning
        run: node ../automation/.github/ci/ai-manifest-admission.mjs . "$AIHR_CI_HEAD"
      - run: node ../automation/.github/ci/plan.mjs > "$RUNNER_TEMP/ci-plan.json"
      - name: Derive execution matrix from complete trusted manifest
        id: matrix
        run: node ../automation/.github/ci/singleton-commissioning.mjs matrix "$RUNNER_TEMP/ci-plan.json" "$RUNNER_TEMP/commission-selection.json"
      - name: Publish complete partition counts
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/ci-plan.json","utf8"));
            const count=k=>p.units.filter(u=>u.kind===k).reduce((n,u)=>n+u.files.length,0);
            const line=`Exact candidate ${p.sha}: ${p.suite.length} suite files = ${count("nodb")} no-DB + ${count("db")} DB; ${count("browser")} browser executions across 3 engines. Controller ${p.controller}.`;
            console.log(line); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,line+"\n");'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.commission_singleton_units && 'commission-plan' || 'gate-plan' }}
          path: |
            ${{ runner.temp }}/ci-plan.json
            ${{ runner.temp }}/commission-selection.json
          if-no-files-found: error
          retention-days: 30
  build:
    if: ${{ always() && !inputs.diagnostics_only && needs.resolve.result == 'success' && (!inputs.commission_singleton_units || needs.plan.outputs.has_native == 'true') && (inputs.build_only || needs.plan.result == 'success') }}
    needs: [resolve, plan]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_CI_MIGRATION_BASE: ${{ needs.resolve.outputs.base }}
      DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      AIHR_CI_CAPACITY_PROFILE: bounded-canonical-build
      NODE_OPTIONS: --max-old-space-size=6144
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with: {node: '22.23.3', mobile: 'false', capacity_profile: bounded-canonical-build}
      - name: Require both frozen AI source manifests before building
        run: node ../automation/.github/ci/ai-manifest-admission.mjs . "$AIHR_CI_HEAD"
      - name: Bind compiler cache to CI build context
        id: next-cache-context
        continue-on-error: true
        timeout-minutes: 1
        run: |
          cache_runtime="$(node -p '[process.platform, process.arch, process.versions.node].join("-")')"
          test -f deploy/css-cache-guard.sh
          test ! -L deploy/css-cache-guard.sh
          cache_css="$(bash -c '. deploy/css-cache-guard.sh; aihr_css_inputs_hash')"
          test "${#cache_css}" -eq 64
          case "$cache_css" in *[!a-f0-9]*) exit 1 ;; esac
          printf 'prefix=aihr-next-compiler-v2-ubuntu24-%s-%s-%s\n' "$cache_runtime" "$cache_css" "${{ hashFiles('source/pnpm-lock.yaml', 'source/package.json', 'source/next.config.ts', 'source/tsconfig.json', 'source/tsconfig.build.json', 'source/.env.example', 'source/scripts/improve/system-testing-next-config.ts', 'source/deploy/css-cache-guard.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Restore optional Turbopack compiler cache
        id: next-cache
        if: ${{ steps.next-cache-context.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: source/.next/cache/turbopack
          key: ${{ steps.next-cache-context.outputs.prefix }}-${{ needs.resolve.outputs.sha }}
          restore-keys: ${{ steps.next-cache-context.outputs.prefix }}-
          enableCrossOsArchive: false
          fail-on-cache-miss: false
        env: {SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'}
      # Bounded next build heap: exactly 8192 MB, only the canonical build step, only on a GitHub-hosted
      # 16 GB Linux runner; the job-level 6144 stays for every other step. build-heap.mjs refuses any other
      # runner and any value above 8192; raising the ceiling needs owner review
      # (docs/reviews/build-capacity-8192-proposal.md). Rollback: revert restores 6144.
      - name: Admit bounded next build heap
        id: build-heap
        run: node ../automation/.github/ci/build-heap.mjs admit
        env: {AIHR_CI_BUILD_HEAP_MB: '8192'}
      - name: Canonical System Testing production build and byte bundle
        run: pnpm exec tsx ../automation/.github/ci/next-application-cache.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: ${{ steps.build-heap.outputs.node_options }}
          AIHR_CI_BUILD_HEAP_PROFILE: ${{ steps.build-heap.outputs.heap_profile }}
          AIHR_CI_BUILD_HEAP_MEMTOTAL_KIB: ${{ steps.build-heap.outputs.memtotal_kib }}
      - name: Publish mandatory canonical build packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-build-v1
          path: ${{ runner.temp }}/production-build/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Publish optional application compiler graph
        if: ${{ success() && github.event_name != 'pull_request' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-application-state-v1
          path: ${{ runner.temp }}/next-application-state-packet/
          if-no-files-found: warn
          retention-days: 1
      - name: Preserve failed canonical build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-application-build-failure
          path: |
            ${{ runner.temp }}/normal-next-application-cache/comparison.json
            ${{ runner.temp }}/normal-next-application-cache/canonical-build.log
            ${{ runner.temp }}/normal-next-application-cache/application-typegen.log
          if-no-files-found: warn
          retention-days: 3
      - name: Bound optional compiler cache upload
        id: next-cache-budget
        if: ${{ success() && steps.next-cache-context.outcome == 'success' && steps.next-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        run: |
          if [ -d .next/cache/turbopack ] && [ ! -L .next/cache/turbopack ]; then
            cache_kib="$(du -sk .next/cache/turbopack | cut -f1)"
            if [[ "$cache_kib" =~ ^[0-9]+$ ]] && [ "$cache_kib" -le 1048576 ]; then
              echo 'eligible=true' >> "$GITHUB_OUTPUT"
              echo "Compiler cache: ${cache_kib} KiB; within the 1 GiB per-entry upload bound."
            else
              echo 'Compiler cache upload skipped: exceeds the per-entry bound.'
            fi
          else
            echo 'Compiler cache upload skipped: no regular compiler cache directory.'
          fi
      - name: Save optional Turbopack compiler cache
        if: ${{ success() && steps.next-cache-budget.outputs.eligible == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: source/.next/cache/turbopack
          key: ${{ steps.next-cache-context.outputs.prefix }}-${{ needs.resolve.outputs.sha }}
          enableCrossOsArchive: false
  test:
    if: ${{ !inputs.diagnostics_only && !inputs.build_only && needs.plan.outputs.has_tests == 'true' }}
    name: test (${{ matrix.unit }})
    needs: [resolve, plan]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_CI_MIGRATION_BASE: ${{ needs.resolve.outputs.base }}
    timeout-minutes: ${{ matrix.employeeLifecycle && 30 || 120 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.test_parallelism || '48') }}
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    steps:
      - name: Anchor first executable employee lifecycle job step
        if: ${{ matrix.employeeLifecycle }}
        working-directory: ${{ runner.temp }}
        env: {UNIT: '${{ matrix.unit }}'}
        run: |
          /usr/bin/python3 -I -B <<'PYTHON'
          import json,os,re,time
          from pathlib import Path
          unit=os.environ['UNIT']
          assert re.fullmatch(r'db-[0-9a-f]{16}',unit)
          assert os.environ['GITHUB_JOB']=='test' and os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert all(re.fullmatch(r'[a-f0-9]{40}',os.environ[key]) for key in ('AIHR_CI_HEAD','AIHR_CI_CONTROL_HEAD'))
          assert re.fullmatch(r'[1-9][0-9]*',os.environ['GITHUB_RUN_ID'])
          root=Path(os.environ['RUNNER_TEMP']).resolve();directory=root/'aihr-ci';directory.mkdir(mode=0o700)
          anchor={'version':1,'run':os.environ['GITHUB_RUN_ID'],'attempt':'1','job':'test','unit':unit,
                  'source':os.environ['AIHR_CI_HEAD'],'controller':os.environ['AIHR_CI_CONTROL_HEAD'],
                  'bootId':Path('/proc/sys/kernel/random/boot_id').read_text().strip(),
                  'startNs':str(time.monotonic_ns()),'wallTimeNs':str(time.time_ns())}
          path=directory/(unit+'-employee-job-anchor.json')
          fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          try:
              data=json.dumps(anchor,separators=(',',':')).encode();assert os.write(fd,data)==len(data)
          finally:
              os.close(fd)
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('AIHR_EMPLOYEE_JOB_ANCHOR='+str(path)+'\n')
          PYTHON
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with: {capacity_profile: "${{ github.run_attempt == 1 && 'bounded-suite-setup' || 'legacy' }}"}
      - name: Source-bound PDF dependencies for this complete unit
        env: {UNIT: '${{ matrix.unit }}'}
        run: node ../automation/.github/ci/pdf-tools.mjs --unit "$UNIT"
      - name: Preserve suite headroom after PDF tooling
        if: ${{ github.run_attempt == 1 }}
        run: bash ../automation/.github/ci/prepare-runner.sh
        env: {AIHR_CI_CAPACITY_PROFILE: bounded-suite-ready}
      - run: git rev-parse --verify -q refs/heads/main >/dev/null || git branch main origin/main
      - name: Run ordinary complete unit
        if: ${{ !matrix.employeeLifecycle }}
        run: node ../automation/.github/ci/run-unit.mjs "$UNIT" "$RUNNER_TEMP/aihr-ci"
        env: {UNIT: '${{ matrix.unit }}'}
      - name: Run closed employee complete unit through canonical Node
        if: ${{ matrix.employeeLifecycle }}
        env: {UNIT: '${{ matrix.unit }}', AIHR_CI_UNIT: '${{ matrix.unit }}'}
        run: |
          NODE="$(node -p 'require("node:fs").realpathSync(process.execPath)')"
          exec "$NODE" "$GITHUB_WORKSPACE/automation/.github/ci/run-unit.mjs" "$UNIT" "$RUNNER_TEMP/aihr-ci"
      - name: Always settle the exact owned employee PostgreSQL resource
        if: ${{ always() && matrix.employeeLifecycle }}
        env: {UNIT: '${{ matrix.unit }}', AIHR_CI_UNIT: '${{ matrix.unit }}'}
        run: |
          NODE="$(node -p 'require("node:fs").realpathSync(process.execPath)')"
          exec "$NODE" "$GITHUB_WORKSPACE/automation/.github/ci/employee-lifecycle-always-stop.mjs" "$UNIT" "$RUNNER_TEMP/aihr-ci"
      - name: Retain actual PDF setup diagnostics with the unit evidence
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pdf-tools-setup.json" ]; then
            mkdir -p "$RUNNER_TEMP/aihr-ci"
            cp "$RUNNER_TEMP/pdf-tools-setup.json" "$RUNNER_TEMP/aihr-ci/pdf-tools-setup.json"
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.commission_singleton_units && 'commission-unit' || 'unit' }}-${{ matrix.unit }}
          path: ${{ runner.temp }}/aihr-ci/
          if-no-files-found: error
          retention-days: 14
  native-test:
    if: >-
      ${{ always() && !cancelled() && needs.resolve.result == 'success' &&
          ((inputs.native_tool_only && needs.plan.result == 'skipped' && needs.build.result == 'skipped') ||
           (!inputs.native_tool_only && !inputs.diagnostics_only && !inputs.build_only && needs.plan.result == 'success' &&
            needs.plan.outputs.has_native == 'true' && needs.build.result == 'success')) }}
    needs: [resolve, plan, build]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_CI_MIGRATION_BASE: ${{ needs.resolve.outputs.base }}
    timeout-minutes: ${{ inputs.native_tool_only && 10 || 120 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.test_parallelism || '48') }}
      matrix: ${{ fromJSON(inputs.native_tool_only && '{"unit":["tool-only"]}' || needs.plan.outputs.native_matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Acquire, verify and dispose of the fixed private toolchain
        id: tool
        if: ${{ inputs.native_tool_only && matrix.unit == 'tool-only' }}
        shell: bash
        working-directory: automation
        env:
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          GLIBC_TUNABLES: ''
          BASH_ENV: /dev/null
          ENV: /dev/null
        run: |
          umask 077
          set -o noclobber
          mkdir -m 700 "$RUNNER_TEMP/aihr-native-tool-only"
          status=0
          /usr/bin/python3 -I -B .github/ci/native-controller-bootstrap.py --tool-only > "$RUNNER_TEMP/aihr-native-tool-only/native-workload-tool-only.json" || status=$?
          /usr/bin/python3 -I -B .github/ci/native-controller-bootstrap.py --check-tool-capture "$status"
          echo 'receipt=true' >> "$GITHUB_OUTPUT"
          exit "$status"
      - if: ${{ always() && inputs.native_tool_only && steps.tool.outputs.receipt == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-workload-tool-only
          path: ${{ runner.temp }}/aihr-native-tool-only/native-workload-tool-only.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: ${{ !inputs.native_tool_only }}
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        if: ${{ !inputs.native_tool_only }}
        with: {capacity_profile: "${{ github.run_attempt == 1 && 'bounded-suite-setup' || 'legacy' }}", native_controller: 'true'}
      - name: Prepare candidate reference through protected native owner
        if: ${{ !inputs.native_tool_only }}
        run: '"/var/lib/aihr-native-controller/$GITHUB_RUN_ID/node" "/var/lib/aihr-native-controller/$GITHUB_RUN_ID/automation/.github/ci/native-controller-owner.mjs" ensure-main'
        env:
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          GLIBC_TUNABLES: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
          NODE_EXTRA_CA_CERTS: ''
          BASH_ENV: /dev/null
          ENV: /dev/null
          SHELLOPTS: ''
          BASHOPTS: ''
      # run-unit captures the retained installed closure BEFORE createPlan's
      # candidate classifier, then prepares its source-bound PDF prerequisite.
      - name: Run complete unit through protected native owner
        if: ${{ !inputs.native_tool_only }}
        run: '"/var/lib/aihr-native-controller/$GITHUB_RUN_ID/node" "/var/lib/aihr-native-controller/$GITHUB_RUN_ID/automation/.github/ci/native-controller-owner.mjs" run-unit "$UNIT" "$RUNNER_TEMP/aihr-ci"'
        env:
          UNIT: '${{ matrix.unit }}'
          GH_TOKEN: '${{ github.token }}'
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          GLIBC_TUNABLES: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
          NODE_EXTRA_CA_CERTS: ''
          BASH_ENV: /dev/null
          ENV: /dev/null
          SHELLOPTS: ''
          BASHOPTS: ''
      - name: Retain actual PDF setup diagnostics with the unit evidence
        if: ${{ always() && !inputs.native_tool_only }}
        run: |
          if [ -f "$RUNNER_TEMP/pdf-tools-setup.json" ]; then
            mkdir -p "$RUNNER_TEMP/aihr-ci"
            cp "$RUNNER_TEMP/pdf-tools-setup.json" "$RUNNER_TEMP/aihr-ci/pdf-tools-setup.json"
          fi
      - if: ${{ always() && !inputs.native_tool_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.commission_singleton_units && 'commission-unit' || 'unit' }}-${{ matrix.unit }}
          path: ${{ runner.temp }}/aihr-ci/
          if-no-files-found: error
          retention-days: 14
  browser:

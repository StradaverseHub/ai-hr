name: Runtime repair evidence controls
run-name: Runtime repair verifier controls only · no deployment
on:
  workflow_dispatch:
    inputs:
      control_scope:
        type: choice
        default: runtime-controls
        options: [focused, browser-partial, runtime-controls, bonus-negative, bonus-controls, email-controls, email-compiler, email-grant-controls]
permissions: {contents: read, actions: read}
concurrency:
  group: runtime-evidence-controls-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  verifier-controls:
    if: inputs.control_scope != 'bonus-negative' && inputs.control_scope != 'email-compiler'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Pin package manager for actual TypeScript operator imports
        if: inputs.control_scope == 'email-grant-controls'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 10.33.2}
      - name: Install the frozen operator TypeScript loader
        if: inputs.control_scope == 'email-grant-controls'
        env: {NODE_OPTIONS: --max-old-space-size=2048}
        run: pnpm install --frozen-lockfile
      - name: Email install grant and native protocol refusal controls
        if: inputs.control_scope == 'email-grant-controls'
        run: node --import tsx --test .github/ci/email-install-grant.test.mjs .github/ci/email-compiler-evidence.test.mjs .github/ci/operator-email-repair.test.mjs .github/ci/github-snapshot-batch.test.mjs .github/ci/build-only-evidence.test.mjs .github/ci/operator-flow.test.mjs
      - name: Import email operator without executing native actions
        if: inputs.control_scope == 'email-grant-controls'
        run: node --import tsx --input-type=module -e "await import('./.github/ci/operator-email-repair.mjs')"
      - name: Email exact-source and retained-coverage refusal controls
        if: inputs.control_scope == 'email-controls' || inputs.control_scope == 'email-grant-controls'
        run: node --experimental-strip-types --test .github/ci/email-repair-source.test.mjs .github/ci/email-repair-coverage.test.mjs .github/ci/retained-units.test.mjs .github/ci/authenticated-focused.test.mjs .github/ci/reviewed-focused-controller.test.mjs
      - name: Exact Bonus build inventory and refusal boundaries
        if: inputs.control_scope == 'bonus-controls'
        run: node --experimental-strip-types --test .github/ci/build-only-evidence.test.mjs .github/ci/authenticated-bonus-browser.test.mjs .github/ci/bonus-owner-acceptance.test.mjs .github/ci/bonus-compiler-evidence.test.mjs .github/ci/bonus-install-grant.test.mjs .github/ci/github-snapshot-batch.test.mjs .github/ci/focused-snapshot-reader.test.mjs .github/ci/operator-bonus-repair.test.mjs
      - name: Import Bonus operator without executing native actions
        if: inputs.control_scope == 'bonus-controls'
        run: node --experimental-strip-types --input-type=module -e "await import('./.github/ci/operator-bonus-repair.mjs')"
      - name: Exact immutable reviewed controller source boundaries
        if: inputs.control_scope == 'focused'
        run: node .github/ci/reviewed-focused-controller.source.test.mjs
      - name: Focused provenance and native PDF refusal controls
        if: inputs.control_scope == 'focused'
        run: node --test .github/ci/authenticated-focused.test.mjs .github/ci/authenticated-focused-pdf.test.mjs .github/ci/focused-file-evidence.test.mjs .github/ci/pdf-tools.test.mjs
      - name: Original browser outcome and provenance refusal controls
        if: inputs.control_scope == 'browser-partial'
        run: node --test .github/ci/browser-partial-outcomes.test.mjs .github/ci/authenticated-browser-partial.test.mjs
      - name: Archive extraction refusal controls
        if: inputs.control_scope == 'focused'
        env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python3 -I .github/ci/extract-focused.test.py
      - name: Pin package manager for source-parser controls
        if: inputs.control_scope == 'runtime-controls'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 10.33.2}
      - name: Cache source-parser tooling dependencies
        if: inputs.control_scope == 'runtime-controls'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3', cache: pnpm, cache-dependency-path: pnpm-lock.yaml}
      - name: Install source-parser tooling for runtime controls only
        if: inputs.control_scope == 'runtime-controls'
        env: {NODE_OPTIONS: --max-old-space-size=2048}
        run: pnpm install --frozen-lockfile
      - name: Checkout the exact reviewed application candidate for immutable-source controls
        if: inputs.control_scope == 'runtime-controls'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: e07a86340d1ced979868bf4359d73597301d0f15
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Import the exact runtime adapter without executing operator actions
        if: inputs.control_scope == 'runtime-controls'
        run: node --import tsx --input-type=module -e "await import('./.github/ci/operator-runtime-repair.mjs')"
      - name: Runtime owner-exception coverage, compiler and native grant refusal controls
        if: inputs.control_scope == 'runtime-controls'
        run: node --import tsx --test .github/ci/runtime-owner-acceptance.test.mjs .github/ci/runtime-install-grant.test.mjs .github/ci/runtime-compiler-evidence.test.mjs .github/ci/authenticated-browser-repair.test.mjs .github/ci/build-only-evidence.test.mjs .github/ci/operator-flow.test.mjs
      - name: Reconstruct the actual final source graph and erased historical bridge
        if: inputs.control_scope == 'runtime-controls'
        run: |
          node --import tsx --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          import {runtimeRepairSource,RUNTIME_REPAIR} from './.github/ci/runtime-repair-source.mjs';
          const proof=await runtimeRepairSource({repository:process.env.GITHUB_WORKSPACE+'/source',candidate:RUNTIME_REPAIR.candidate});
          assert(proof.impacts.length===2&&proof.impacts.every(i=>i.plan.tier==='full'&&i.plan.risk==='unknown'&&i.plan.reasons.length===2));
          writeFileSync(process.env.RUNNER_TEMP+'/runtime-source-proof.json',JSON.stringify({controller:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,proof},null,2));
          console.log(JSON.stringify({source:proof.candidate,impacts:proof.impacts.map(i=>({base:i.base,tier:i.plan.tier,risk:i.plan.risk,selected:i.plan.run.length})),releaseAuthorized:false}));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && inputs.control_scope == 'runtime-controls'
        with:
          name: runtime-source-control-evidence
          path: ${{ runner.temp }}/runtime-source-proof.json
          if-no-files-found: warn
          retention-days: 7
  bonus-negative:
    if: inputs.control_scope == 'bonus-negative'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: d52563c666d39074217ed42191866add4a2793a0
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 10.33.2, package_json_file: source/package.json}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3', cache: pnpm, cache-dependency-path: source/pnpm-lock.yaml}
      - name: Install frozen candidate dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Actual impact graph and original-component negative control
        working-directory: source
        run: pnpm exec tsx ../automation/.github/ci/bonus-repair-negative.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bonus-negative-control
          path: ${{ runner.temp }}/bonus-negative/
          if-no-files-found: error
          retention-days: 7

  typecheck:
    if: inputs.control_scope == 'email-compiler'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults: {run: {working-directory: source}}
    env:
      AIHR_CI_HEAD: fffabc90922c3d43b2570dc29a33ce8b70b69aca
      AIHR_CI_CONTROL_HEAD: ${{ github.workflow_sha }}
      AIHR_CI_CAPACITY_PROFILE: legacy
      DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: fffabc90922c3d43b2570dc29a33ce8b70b69aca, path: source, persist-credentials: false}
      - uses: ./automation/.github/actions/setup-alpha
        with: {node: '22.23.3', capacity_profile: legacy}
      - name: Generate actual Next route types
        run: pnpm exec next typegen
      - name: Whole-project compiler on exact repaired candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/email-compiler"
          bash ../automation/.github/ci/typecheck.sh 2>&1 | tee "$RUNNER_TEMP/email-compiler.log"
      - name: Bind exact compiler outcome
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const source=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),controller=execFileSync('git',['-C','../automation','rev-parse','HEAD'],{encoding:'utf8'}).trim();
          assert.equal(source,process.env.AIHR_CI_HEAD);assert.equal(controller,process.env.GITHUB_SHA);assert.equal(process.versions.node,'22.23.3');assert.equal(execFileSync('git',['status','--porcelain'],{encoding:'utf8'}),'');
          const text=readFileSync(process.env.RUNNER_TEMP+'/email-compiler.log','utf8'),report={kind:'ACTUAL_EMAIL_WHOLE_COMPILER_RESULT_NOT_TEST_OR_RELEASE',source,controller,runId:process.env.GITHUB_RUN_ID,attempt:'1',runtime:{node:process.versions.node,platform:process.platform,arch:process.arch},exitCode:0,wholeProject:true,sourceClean:true,logSha256:createHash('sha256').update(text).digest('hex'),completedAt:new Date().toISOString(),releaseAuthorized:false};
          writeFileSync(process.env.RUNNER_TEMP+'/email-compiler/compiler-result.json',JSON.stringify(report)+'\n');writeFileSync(process.env.RUNNER_TEMP+'/email-compiler/compiler-log.json',JSON.stringify({text})+'\n');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: email-whole-compiler-evidence
          path: ${{ runner.temp }}/email-compiler/
          if-no-files-found: error
          retention-days: 7

name: mobile-react-types-evaluation
run-name: Pair shared React types for SDK58 · 262a21c0b
on:
  push:
    branches: [codex/mobile-sdk58-eval-20261103]
    paths: [.github/workflows/mobile-react-types-evaluation.yml]
permissions:
  contents: read
jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 262a21c0b46e547f6d3fbb07165db93259f2571a
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: '10.33.2'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Generate paired type identity without executing package scripts
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');const n=require('./mobile/package-lock.json').packages['node_modules/@types/react'].version;if(n!=='19.3.0')throw Error('Unexpected native type version');p.devDependencies['@types/react']=n;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          pnpm install --lockfile-only --ignore-scripts
          mkdir -p "$RUNNER_TEMP/paired-types"
          cp package.json pnpm-lock.yaml "$RUNNER_TEMP/paired-types/"
          git diff --stat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onehr-sdk58-paired-react-types
          path: ${{ runner.temp }}/paired-types/
          retention-days: 1
          if-no-files-found: error

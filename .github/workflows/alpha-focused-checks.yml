                  measurement.update(kind='DEVELOPMENT_BROWSER_MEASURED_COURSE_V2', version=2, course='preflight-2',
                      renderedUnion=union_binding if full_pass else None,
                      postgresWaitLogCoverage=log_coverage if full_log_coverage else None)
              publish_json(publish_fd, 'browser-preflight-measurement.json', measurement)
              if not full_pass:
                  roles = {'employee', 'manager', 'companyHR', 'groupHR'}
                  types = {'Error', 'AssertionError', 'TimeoutError', 'AbortError', 'TypeError', 'AggregateError', 'unclassified'}
                  codes = {'ERR_ASSERTION', 'ABORT_ERR', 'ECONNRESET', 'ETIMEDOUT', 'EPIPE', 'ERR_STREAM_PREMATURE_CLOSE',
                           'Z_DATA_ERROR', 'Z_BUF_ERROR', '57014', '55P03', '53300', '08006', '42501', '23514', '25P02', '57P01'}

name: alpha-focused-checks
run-name: Focused only · ${{ inputs.candidate_ref }}
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Existing same-repository candidate branch
        required: true
        type: string
      expected_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      selected_tests:
        description: JSON array of 1–64 tracked unit/DOM test paths; candidate classifier owns DB selection
        required: true
        type: string
      architecture_browser_development_preflight:
        description: Fixed first-attempt fictional two-worker functional browser course, without load or release authority
        default: false
        type: boolean
      measured_browser_course:
        description: Full role-route preflight or same-source 2, 4 and 8 worker comparison
        type: choice
        options: ['off', 'preflight-2', 'serial-2-4-8']
        default: 'off'
      measured_browser_preflight_run:
        description: Successful full browser preflight run ID on the same immutable source
        type: string
        default: ''
      employee_ascii_qualification:
        description: Closed development-only employee ASCII semantic cell; requires the exact proof and product selectors
        default: 'off'
        type: choice
        options: ['off', node22, node24]
      qualify_restricted_port_prerequisites:
        description: Opt-in exact581 populated restricted-port prerequisite rehearsal before migrations; requires real Personnel DB files and whole typecheck
        default: false
        type: boolean
      profile_database:
        description: Opt-in reset/seed/template timing when the candidate implements test/profile.ts
        default: false
        type: boolean
      duration_order:
        description: Opt-in observed-duration file scheduling; cases and resources remain unchanged
        required: false
        default: false
        type: boolean
      run_typecheck:
        description: Whole-repository compiler check in a separate standard runner
        default: false
        type: boolean
      run_native_typecheck:
        description: Native app compiler with its strict Expo project and locked SDK dependencies
        default: false
        type: boolean
      run_native_swift_models:
        description: Swift proof-recovery host models on a standard GitHub macOS runner; no app or vendor call
        default: false
        type: boolean
      run_native_bundle:
        description: Production Metro and Hermes bundles for iPhone and Android
        default: false
        type: boolean
      run_build:
        description: Linux Node 20 production build in a separate standard runner
        default: false
        type: boolean
      model_eval:
        description: Optional OpenRouter model id for the fictional-data Assistant ceiling probe (protected assistant-eval environment); empty skips
        required: false
        default: ''
        type: string
      eval_budget_usd:
        description: Hard spend cap in USD for model_eval (maximum 50)
        required: false
        default: '20'
        type: string
      eval_allowed_providers:
        description: Optional comma-separated OpenRouter upstream providers for model_eval
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: personnel-import-overlap-37e1
  cancel-in-progress: false
jobs:
  selected-tests:
    if: ${{ github.repository == 'StradaverseHub/ai-hr' && github.ref == 'refs/heads/codex/architecture-37e1-import-overlap-rehearsal-20261110' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: source
    env:
      STAGING_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
      PRODUCTION_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
    steps:
      - name: Admit exact hosted fictional course
        working-directory: ${{ runner.temp }}
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import json, os, re
          from pathlib import Path
          repo = 'StradaverseHub/ai-hr'
          branch = 'codex/architecture-37e1-import-overlap-rehearsal-20261110'
          required = {'GITHUB_ACTIONS':'true','CI':'true','RUNNER_ENVIRONMENT':'github-hosted','RUNNER_OS':'Linux','RUNNER_ARCH':'X64',
            'GITHUB_REPOSITORY':repo,'GITHUB_REPOSITORY_ID':'1333414856','GITHUB_EVENT_NAME':'workflow_dispatch','GITHUB_RUN_ATTEMPT':'1',
            'GITHUB_WORKFLOW':'alpha-focused-checks','GITHUB_JOB':'selected-tests','GITHUB_REF':'refs/heads/'+branch,
            'GITHUB_WORKFLOW_REF':repo+'/.github/workflows/alpha-focused-checks.yml@refs/heads/'+branch,
            'STAGING_ENABLED':'false','PRODUCTION_ENABLED':'false'}
          assert all(os.environ.get(key)==value for key,value in required.items())
          assert re.fullmatch(r'[a-f0-9]{40}',os.environ['GITHUB_SHA']) and os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          path = Path(os.environ['GITHUB_EVENT_PATH'])
          assert path.is_file() and 0<path.stat().st_size<=65536
          given = json.loads(path.read_bytes())['inputs']
          assert type(given) is dict
          for key in ('model_eval','eval_allowed_providers','measured_browser_preflight_run'):
              given.setdefault(key,'')
          assert given=={'candidate_ref':branch,'expected_sha':'37e1f773a4772cebb4dc11d1762499f7f0c2dd2a','selected_tests':'[]',
            'architecture_browser_development_preflight':'false','employee_ascii_qualification':'off',
            'qualify_restricted_port_prerequisites':'false','profile_database':'false','duration_order':'false',
            'run_typecheck':'false','run_native_typecheck':'false','run_native_swift_models':'false','run_native_bundle':'false',
            'run_build':'true','model_eval':'','eval_budget_usd':'20','eval_allowed_providers':'',
            'measured_browser_course':'off','measured_browser_preflight_run':''}
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: StradaverseHub/ai-hr
          path: automation
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: StradaverseHub/ai-hr
          path: source
          ref: 37e1f773a4772cebb4dc11d1762499f7f0c2dd2a
          persist-credentials: false
          fetch-depth: 1
      - uses: ./source/.github/actions/setup-alpha
        with:
          node: 24.22.1
          path: source
          mobile: 'false'
          capacity_profile: legacy
      - name: Rehearse exact 500-row import and concurrent user journeys
        env:
          AIHR_REHEARSAL_CONTROLLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          test -x /usr/bin/google-chrome
          git -C ../automation diff --quiet
          test "$(git -C ../automation rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          node ../automation/.github/ci/personnel-import-populated/run-rehearsal.mjs
      - name: Publish only closed aggregate import rehearsal evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fictional-populated-import-overlap
          path: ${{ runner.temp }}/aihr-import-rehearsal-public/rehearsal.json
          if-no-files-found: error
          retention-days: 14

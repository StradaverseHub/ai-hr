                      'navigation-protocol.ts', 'navigation-entry.ts', 'navigation-shell-browser.ts'})
                  stage_line = number(browser_stage.get('sourceLine'), 9999, 1)
                  stage_column = number(browser_stage.get('sourceColumn'), 4096, 1)
                  browser_signals = []
                  if type(driver.get('browserErrors')) is list:
                      for item in driver['browserErrors'][:6]:
                          row = record(item)
                          event = choice(row.get('kind'), {'pageerror', 'console'})
                          fingerprint = choice(row.get('fingerprint'), {'react-minified-418', 'react-minified-422',
                              'react-minified-423', 'react-minified-425', 'next-server-component-render', 'other'})
                          if event and fingerprint:
                              browser_signals.append({'kind': event, 'role': choice(row.get('role'), roles),
                                  **route(row.get('path')), 'fingerprint': fingerprint})
                  wait_state, wait_samples, _ = json_member(directory, 'database-waits.json',
                      lambda rows: count(rows) is not None, value_type=list)
                  blocking_signals = []
                  families = {'access-configuration', 'ai-control', 'audit-chain', 'employment',
                              'payroll-history', 'pay-component-catalog', 'unclassified'}
                  if wait_state == 'observed':
                      for item in wait_samples:
                          row = record(item)
                          if row.get('phase') != 'preflight':
                              continue
                          app = record(row.get('appConnections'))
                          waiting = number(app.get('waitingOnLock'), 1024)
                          advisory = number(app.get('sampledAdvisoryWaiters'), 1024)
                          if waiting is None or advisory is None or not max(waiting, advisory):
                              continue
                          signal = {'waitingAppBackends': waiting, 'sampledAdvisoryAppBackends': advisory}
                          waiters = row.get('advisoryWaiters')
                          if type(waiters) is list and len(waiters) <= 40:
                              names = set()
                              for item in waiters:
                                  name = record(item).get('namespace')
                                  if type(name) is str:
                                      names.add(choice(name.partition(':')[0], families) or 'unclassified')
                              signal['observedAdvisoryFamilies'] = sorted(names)
                          blocking_signals.append(signal)
                          if len(blocking_signals) == 6:
                              break
                  receipt = {
                      'kind': 'INCOMPLETE_DEVELOPMENT_BROWSER_FAILURE', 'version': 1, 'complete': False, 'releaseEligible': False,
                      'courseOutcome': choice(os.environ['COURSE_OUTCOME'], {'success', 'failure', 'cancelled', 'skipped'}),
                      'cleanupOutcome': cleanup_outcome,
                      'runnerReport': runner_state, 'driverReport': driver_state, 'runnerPhases': phases,
                      'primaryFailure': {'errorType': choice(primary.get('kind'), types), 'errorCode': choice(primary.get('code'), codes)} if primary else None,
                      'firstSecondaryFailure': {'stage': choice(secondary.get('stage'), {
                          'evidence', 'visit-diagnostic', 'claim-restoration', 'lock-sample-diagnostic', 'browser-failure-capture',
                          'failure-database-snapshot', 'browser-settlement', 'https-settlement', 'database-settlement',
                          'browser-disconnected', 'browser-connection-state', 'browser-close', 'context-close', 'context-inventory',
                          'late-socket', 'agent-queue', 'request-destroy', 'agent-destroy', 'socket-destroy'}),
                          'errorType': choice(secondary.get('kind'), types), 'errorCode': choice(secondary.get('code'), codes)} if secondary else None,
                      'firstFailedPilotRoute': {'role': choice(pilot.get('role'), roles), **route(pilot.get('route')),
                                                'reason': choice(pilot.get('reason'), types | codes)} if pilot else None,
                      'firstFailedBrowserVisit': {'phase': choice(visit.get('phase'), {'baseline', 'sign-in-preflight', 'loaded'}),
                                                  'role': choice(visit.get('role'), roles), **route(visit.get('path')),
                                                  'visitStage': choice(visit.get('visitStage'), visits),
                                                  'errorType': choice(visit.get('errorType'), types),
                                                  'errorCode': choice(visit.get('errorCode'), {'ERR_ASSERTION'}),
                                                  'sourceFile': source_file, 'sourceLine': line if source_file else None,
                                                  'sourceColumn': column if source_file else None} if visit else None,
                      'browserStageFailure': {'stage': stage_name, 'role': choice(browser_stage.get('role'), roles),
                          **route(browser_stage.get('path')), 'errorType': choice(browser_stage.get('errorType'), types),
                          'clickObstruction': choice(browser_stage.get('clickObstruction'), {'pointer-intercepted',
                              'outside-viewport', 'element-unstable', 'element-invisible', 'element-disabled', 'element-detached', 'click-timeout'}),
                          'sourceFile': stage_file, 'sourceLine': stage_line if stage_file else None,
                          'sourceColumn': stage_column if stage_file else None} if stage_name else None,
                      'browserErrorSignals': browser_signals,
                      'sampledBlockingSignals': {'evidence': wait_state, 'samples': blocking_signals},
                      'milestones': {'workerReadinessRows': count(readiness), 'readyWorkers': ready,
                                     'browserVersionObserved': True if type(driver.get('browserVersion')) is str and driver['browserVersion'] else None,
                                     'browserAcquisition': choice(record(shutdown.get('acquisition')).get('browser'), {'absent', 'acquired', 'failed'}),
                                     'homeReady': flag(driver.get('preflightHomeReady')),
                                     'browserClosed': flag(shutdown.get('browserClosed')),
                                     'nativeAuditPoolClosed': flag(shutdown.get('nativeAuditPoolClosed')),
                                     'driverPoolClosed': flag(shutdown.get('driverPoolClosed')),
                                     'compatibilityRedirectsVerified': flag(driver.get('aiCompatibilityRedirectsVerified'))},
                      'observedCounts': {name: count(driver.get(name)) for name in (
                          'coverage', 'boundaries', 'browser', 'preflightBrowserSignIns', 'browserVisitFailures', 'homeCardFailures',
                          'browserErrors', 'pageBusyResponses', 'aiBaselineFailures', 'browserMovementJourneys', 'browserSavedReportJourneys',
                          'browserPayrollReadiness', 'browserDraftWrites', 'auditVerification')},
                  }
                  receipt['observedCounts'].update(
                      baselineScenarios=number(record(driver.get('navigationCapture')).get('baselineScenarios'), 4096),
                      lockSamplesCompleted=completed, lockSamplesObserved=observed, lockSamplesBlocking=blocking,
                      driverSecondaryFailures=count(driver_failures.get('secondary')))
                  publish_json(publish_fd, 'browser-preflight-failure.json', receipt)

              named = os.stat(publish_name, dir_fd=temp_fd, follow_symlinks=False)
              current = os.fstat(publish_fd)
              if ((publish_info.st_dev, publish_info.st_ino) != (current.st_dev, current.st_ino)
                      or identity(current) != identity(named)
                      or identity(os.fstat(temp_fd)) != identity(temp.lstat())):
                  raise SystemExit('Development browser publication directory changed')
              paths = [str(temp / publish_name / name) for name in members]
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write('paths<<DEVELOPMENT_EVIDENCE\n' + '\n'.join(paths) + '\nDEVELOPMENT_EVIDENCE\n')

          if not full_pass:
              raise SystemExit('Development browser terminal evidence was incomplete or refused')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              scope = 'Full rendered role-route browser preflight' if full_course else 'Functional browser diagnostic'
              summary.write(scope + ' passed on two workers with fictional data. '
                            'No steady load, release authority or deployment.\n')
          PYTHON
      - name: Publish sanitized functional browser development evidence
        if: ${{ always() && (inputs.architecture_browser_development_preflight || inputs.measured_browser_course == 'preflight-2') && steps.development-browser-cleanup.outputs.paths != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-browser-development-preflight-evidence
          path: ${{ steps.development-browser-cleanup.outputs.paths }}
          if-no-files-found: error
          retention-days: 14
      - name: Run the fixed same-build 2, 4 and 8 worker comparison
        if: ${{ inputs.measured_browser_course == 'serial-2-4-8' }}
        id: worker-comparison
        env:
          AIHR_CI_UNIT: db-1
          AIHR_CI_PG_DURABLE: '1'
          AIHR_CI_PG_STATEMENTS: '1'
          AIHR_CI_PG_STATEMENTS_OWNER: system-http-profile
          AIHR_WORKER_COMPARISON_ADMISSION_SHA256: ${{ needs.resolve.outputs.worker_admission_sha256 }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          test "${#AIHR_FOCUSED_JOB_MONOTONIC_NS}" -le 18
          [[ "$AIHR_FOCUSED_JOB_MONOTONIC_NS" =~ ^[1-9][0-9]+$ ]]
          export AIHR_WORKER_COMPARISON_T0_MS="$(( AIHR_FOCUSED_JOB_MONOTONIC_NS / 1000000 ))"
          /usr/bin/python3 -I -B .github/ci/worker-comparison-family.py
      - name: Verify worker comparison evidence ownership
        if: ${{ always() && inputs.measured_browser_course == 'serial-2-4-8' && steps.worker-comparison.outputs.published == 'true' && steps.worker-comparison.outputs.summary_sha256 != '' }}
        id: worker-comparison-evidence
        env:
          COMPARISON_OUTCOME: ${{ steps.worker-comparison.outcome }}
          COMPARISON_SUMMARY_SHA256: ${{ steps.worker-comparison.outputs.summary_sha256 }}
        run: |
          /usr/bin/python3 -I -B - <<'PYTHON'
          import hashlib, json, os, re, stat
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          assert temp.is_absolute() and temp.resolve(strict=True) == temp and temp.stat().st_uid == os.getuid()
          digest = os.environ['COMPARISON_SUMMARY_SHA256']
          assert re.fullmatch(r'[a-f0-9]{64}', digest)
          directory = temp / 'system-worker-comparison-evidence'
          path = directory / 'summary.json'
          if not os.path.lexists(path):
              assert os.environ['COMPARISON_OUTCOME'] == 'failure'
              raise SystemExit('Owned worker comparison summary unavailable')
          parent = directory.lstat()
          assert stat.S_ISDIR(parent.st_mode) and stat.S_IMODE(parent.st_mode) == 0o700 and parent.st_uid == os.getuid()
          def identity(info):
              return (info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_gid, info.st_nlink,
                      info.st_size, info.st_mtime_ns, info.st_ctime_ns)
          with os.fdopen(os.open(path, os.O_RDONLY | os.O_NONBLOCK | os.O_NOFOLLOW), 'rb') as stream:
              before = os.fstat(stream.fileno())
              assert stat.S_ISREG(before.st_mode) and stat.S_IMODE(before.st_mode) == 0o600
              assert before.st_uid == os.getuid() and before.st_nlink == 1 and 0 < before.st_size <= 131072
              raw = stream.read(131073)
              assert len(raw) == before.st_size
              assert identity(before) == identity(os.fstat(stream.fileno())) == identity(path.lstat())
          assert hashlib.sha256(raw).hexdigest() == digest
          result = json.loads(raw)
          assert set(result) == {'kind','releaseEligible','identity','prerequisite','frontiers','buildSeal','seedSettlement',
              'cells','complete','steadyPairPassed','host','productionEquivalent','eightWorkerScope','comparability','processOwner'}
          assert result['identity'] == {'candidateSha': os.environ['AIHR_CI_HEAD'],
              'controllerSha': os.environ['GITHUB_WORKFLOW_SHA'], 'runId': int(os.environ['GITHUB_RUN_ID']), 'runAttempt': 1}
          assert result['kind'] == 'HOSTED_WORKER_COMPARISON_V1'
          assert result['releaseEligible'] is False and result['productionEquivalent'] is False
          owner = result['processOwner']
          assert set(owner) == {'settled','cellBarriers','runnerExitCode'} and owner['settled'] is True
          assert type(owner['cellBarriers']) is int and 0 <= owner['cellBarriers'] <= 3 and type(owner['runnerExitCode']) is int
          if os.environ['COMPARISON_OUTCOME'] == 'success':
              assert result['complete'] is True and owner['cellBarriers'] == 3 and owner['runnerExitCode'] == 0
          else:
              assert result['complete'] is False and owner['runnerExitCode'] != 0
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as out:
              out.write('owned_summary=true\n')
          PYTHON
      - name: Publish sanitized worker comparison evidence
        if: ${{ always() && inputs.measured_browser_course == 'serial-2-4-8' && steps.worker-comparison-evidence.outputs.owned_summary == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-same-build-worker-comparison-evidence
          path: ${{ runner.temp }}/system-worker-comparison-evidence/summary.json
          if-no-files-found: error
          retention-days: 14
  typecheck:
    if: ${{ github.ref != 'refs/heads/codex/compiler-protected-db-client-ab-6c05-20261109' && inputs.run_typecheck }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
      - run: pnpm exec next typegen
      - run: bash ../automation/.github/ci/typecheck.sh
  linux-build:
    if: ${{ github.ref != 'refs/heads/codex/compiler-protected-db-client-ab-6c05-20261109' && inputs.run_build }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with:
          node: '20'
      # Bounded next build heap: exactly 8192 MB, only this step, only on a GitHub-hosted 16 GB Linux
      # runner (build-heap.mjs refuses anything else and any value above 8192). Raising the ceiling needs
      # owner review: docs/reviews/build-capacity-8192-proposal.md. Rollback: revert restores 6144.
      - name: Admit bounded next build heap
        id: build-heap
        run: node ../automation/.github/ci/build-heap.mjs admit
        env:
          AIHR_CI_BUILD_HEAP_MB: '8192'
      - name: Production build with peak memory telemetry
        run: node ../automation/.github/ci/build-heap.mjs measure "$RUNNER_TEMP/next-build-memory" -- pnpm build
        env:
          AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
          NODE_OPTIONS: ${{ steps.build-heap.outputs.node_options }}
          AIHR_CI_BUILD_HEAP_PROFILE: ${{ steps.build-heap.outputs.heap_profile }}
          AIHR_CI_BUILD_HEAP_MEMTOTAL_KIB: ${{ steps.build-heap.outputs.memtotal_kib }}
      - name: Publish next build memory telemetry
        if: ${{ always() && steps.build-heap.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-build-memory
          path: ${{ runner.temp }}/next-build-memory/
          if-no-files-found: warn
          retention-days: 14


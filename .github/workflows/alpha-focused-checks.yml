name: alpha-focused-checks
run-name: Focused only · ${{ inputs.candidate_ref }}
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Existing same-repository candidate branch
        required: true
        type: string
      expected_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      selected_tests:
        description: JSON array of 1–64 tracked unit/DOM test paths; candidate classifier owns DB selection
        required: true
        type: string
      run_system_load:
        description: Isolated production HTTP/browser profiling; no release or deployment
        default: false
        type: boolean
      system_load_suite:
        description: Comparable Claims-heavy workload or wider authorized page mix
        default: claims-heavy
        type: choice
        options: [claims-heavy, whole-system]
      system_think_time:
        description: Time between actions for each of the 500 active users
        default: 1s
        type: choice
        options: [1s, 5s]
      system_attendance_days:
        description: Attendance history per employee; 2000 days creates one million retained rows
        default: '180'
        type: choice
        options: ['180', '2000']
      system_workers:
        description: Development app workers; total app pool and heap budgets stay fixed
        default: '1'
        type: choice
        options: ['1', '2']
      service_profile:
        description: Explicit service benchmark outside the normal unit-test inventory
        default: none
        type: choice
        options: [none, plan-cache, claims-sql, admin-gate, session-plan, scope-lock, orm-schema, review-queues, ess-fields, home-role, profile-queue]
      profile_database_sql:
        description: Track statements in the isolated development database
        default: false
        type: boolean
      profile_database:
        description: Opt-in reset/seed/template timing when the candidate implements test/profile.ts
        default: false
        type: boolean
      duration_order:
        description: Opt-in observed-duration file scheduling; cases and resources remain unchanged
        required: false
        default: false
        type: boolean
      run_typecheck:
        description: Whole-repository compiler check in a separate standard runner
        default: false
        type: boolean
      run_native_typecheck:
        description: Native app compiler with its strict Expo project and locked SDK dependencies
        default: false
        type: boolean
      run_native_swift_models:
        description: Swift proof-recovery host models on a standard GitHub macOS runner; no app or vendor call
        default: false
        type: boolean
      run_native_bundle:
        description: Production Metro and Hermes bundles for iPhone and Android
        default: false
        type: boolean
      run_build:
        description: Linux Node 20 production build in a separate standard runner
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: alpha-focused-${{ inputs.candidate_ref }}
  cancel-in-progress: false
env:
  TZ: Asia/Kuala_Lumpur
  LANG: en_US.UTF-8
  AIHR_CI_CONTROL_HEAD: ${{ github.workflow_sha }}
  AIHR_CI_PG_MEMORY_GIB: '2'
  AIHR_CI_PG_JIT: 'on'
  AIHR_CI_PG_STATEMENTS: ${{ inputs.profile_database_sql && '1' || '0' }}
  AIHR_CI_PG_STATEMENTS_OWNER: visibility-plan-benchmark
  AIHR_FOCUSED_PROFILE: ${{ inputs.profile_database }}
  AIHR_TEST_DURATION_ORDER: ${{ inputs.duration_order }}
  DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
jobs:
  resolve:
    if: ${{ github.repository == 'StradaverseHub/ai-hr' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      tests: ${{ steps.selection.outputs.tests }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Pin dependency-free controller runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Focused controller regression checks
        run: node --experimental-strip-types --test .github/ci/focused-checks.test.mjs .github/ci/postgres-evidence.test.mjs .github/ci/runner-capacity.test.mjs .github/ci/duration-order.test.mjs .github/ci/r395-write-split.test.mjs .github/ci/attendance-unclocked-split.test.mjs
      - name: Validate bounded manifest
        id: selection
        run: node .github/ci/focused-checks.mjs selection
        env:
          AIHR_FOCUSED_TESTS: ${{ inputs.selected_tests }}
      - name: Resolve frozen same-repository candidate
        id: candidate
        run: node .github/ci/resolve.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_BASE_SHA: ${{ vars.STAGING_DEPLOYED_SHA }}
  selected-tests:
    if: ${{ !inputs.run_system_load && (inputs.service_profile == 'none' || inputs.service_profile == '') }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_FOCUSED_TESTS: ${{ needs.resolve.outputs.tests }}
      AIHR_FOCUSED_SUITE_CAPACITY: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with: {capacity_profile: "${{ github.run_attempt == 1 && 'bounded-suite-setup' || 'legacy' }}"}
      - name: Provision multilingual fonts for AI review screenshots
        if: ${{ contains(inputs.selected_tests, 'test/ai-management-naming.dom.test.tsx') || contains(inputs.selected_tests, 'test/ai-probe-history-page.dom.test.tsx') || contains(inputs.selected_tests, 'test/feedback-kanban.dom.test.tsx') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk
      - name: Classify and execute only selected files
        run: node ../automation/.github/ci/focused-checks.mjs run "$RUNNER_TEMP/aihr-focused"
        env:
          AIHR_FOCUSED_EVIDENCE_DIR: ${{ runner.temp }}/aihr-focused
      - name: Summarize opt-in harness phase timings
        if: ${{ always() && inputs.profile_database }}
        run: node scripts/report-test-profile.mjs "$RUNNER_TEMP/aihr-focused/harness-profile" "$RUNNER_TEMP/aihr-focused/profile-summary.json"
      - name: Ensure owned database cleanup after interrupted checks
        if: always()
        run: bash ../automation/.github/ci/postgres.sh stop
        env:
          AIHR_CI_UNIT: db-1
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focused-development-evidence
          path: ${{ runner.temp }}/aihr-focused/
          if-no-files-found: error
          retention-days: 14
  typecheck:
    if: ${{ inputs.run_typecheck }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
      - run: pnpm exec next typegen
      - run: bash ../automation/.github/ci/typecheck.sh
  linux-build:
    if: ${{ inputs.run_build }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with:
          node: '20'
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  native-typecheck:
    if: ${{ inputs.run_native_typecheck }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
      - name: Compile the whole native app with its strict Expo configuration
        run: npm --prefix mobile run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096


  native-bundle:
    if: ${{ inputs.run_native_bundle }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
      - name: Export production iPhone and Android bundles with the locked Expo CLI
        working-directory: source/mobile
        run: npm exec --offline -- expo export --platform ios --platform android --max-workers 2 --output-dir "$RUNNER_TEMP/mobile-native-bundles"
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          EXPO_OFFLINE: '1'
          EXPO_NO_TELEMETRY: '1'

  native-swift-models:
    if: ${{ inputs.run_native_swift_models }}
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 15
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Compile and exercise native proof handoff models
        run: bash automation/.github/ci/native-proof-models.sh "$GITHUB_WORKSPACE/source"

  system-http-browser-load:
    if: ${{ inputs.run_system_load }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_CI_UNIT: db-1
      AIHR_CI_PG_DURABLE: '1'
      AIHR_CI_PG_STATEMENTS: '1'
      AIHR_CI_PG_STATEMENTS_OWNER: system-http-profile
      PERF_HTTP_SUITE: ${{ inputs.system_load_suite }}
      PERF_HTTP_THINK_MS: ${{ inputs.system_think_time == '5s' && '5000' || '1000' }}
      PERF_APP_WORKERS: ${{ inputs.system_workers || '1' }}
      PERF_ATTENDANCE_DAYS: ${{ inputs.system_attendance_days || '180' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.resolve.outputs.sha }}', path: source, fetch-depth: 0, persist-credentials: false}
      - uses: ./automation/.github/actions/setup-alpha
        with: {mobile: 'false', capacity_profile: legacy}
      - name: Select an actual installed browser or install Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - name: Production HTTP and browser performance on a fictional runner database
        run: node scripts/performance/system-runner.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: system-http-browser-development-evidence
          path: ${{ runner.temp }}/system-performance-evidence/
          if-no-files-found: error
          retention-days: 14

  service-performance-profile:
    if: ${{ inputs.service_profile == 'plan-cache' || inputs.service_profile == 'claims-sql' || inputs.service_profile == 'admin-gate' || inputs.service_profile == 'session-plan' || inputs.service_profile == 'scope-lock' || inputs.service_profile == 'orm-schema' || inputs.service_profile == 'review-queues' || inputs.service_profile == 'ess-fields' || inputs.service_profile == 'home-role' || inputs.service_profile == 'profile-queue' }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_CI_UNIT: db-1
      AIHR_CI_PG_STATEMENTS: '1'
      AIHR_CI_PG_STATEMENTS_OWNER: visibility-plan-benchmark
      PERF_SERVICE_PROFILE: ${{ inputs.service_profile }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.resolve.outputs.sha }}', path: source, fetch-depth: 0, persist-credentials: false}
      - uses: ./automation/.github/actions/setup-alpha
        with: {mobile: 'false', capacity_profile: legacy}
      - name: Run explicit service benchmark in a job-owned database
        run: node scripts/performance/service-runner.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: service-performance-development-evidence
          path: ${{ runner.temp }}/service-performance-evidence/
          if-no-files-found: error
          retention-days: 14

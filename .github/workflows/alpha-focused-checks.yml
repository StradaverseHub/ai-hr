              public = {}
              legacy_states = {'fixture.json': fixture_state}
              if fixture_state == 'observed':
                  public['fixture.json'] = project_fixture(fixture)
              for name, value_type, project in (
                      ('actor-tenancy.json', dict, project_actors),
                      ('fixture-phases.json', list, project_fixture_phases),
                      ('server-native-failures.json', dict, project_server_failures),
                      ('postgres-lock-failures.json', dict, project_postgres_failures)):
                  state, value, _ = json_member(directory, name, lambda _: True, value_type)
                  if directory_state == 'refused':
                      state = 'refused'
                  if state == 'observed':
                      projected = project(value)
                      if projected is None:
                          state = 'refused'
                      else:
                          public[name] = projected
                  legacy_states[name] = state
              if directory is not None and (identity(source_info) != identity(os.fstat(directory))
                      or identity(source_info) != identity(os.stat(source_name, dir_fd=temp_fd, follow_symlinks=False))):
                  raise SystemExit('Development browser evidence directory changed')

              receipt = terminal_measurement(runner) if runner_state == 'observed' else None

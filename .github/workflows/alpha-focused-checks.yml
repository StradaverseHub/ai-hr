                                                 if full_course else ('absent', {}, None))
              fixture_state, fixture, _ = json_member(directory, 'fixture.json', lambda row:
                  row.get('fictional') is True and number(row.get('claimsPerEmployee'), 200, 200) == 200
                  and number(row.get('returningUsers'), 500, 500) == 500
                  and number(record(row.get('counts')).get('claims'), 100000, 100000) == 100000)
              if directory_state == 'refused':

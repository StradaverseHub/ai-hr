name: alpha-focused-checks
run-name: Focused only · ${{ inputs.candidate_ref }}
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Existing same-repository candidate branch
        required: true
        type: string
      expected_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      selected_tests:
        description: JSON array of 1–64 tracked unit/DOM test paths; candidate classifier owns DB selection
        required: true
        type: string
      qualify_restricted_port_prerequisites:
        description: Opt-in exact581 populated restricted-port prerequisite rehearsal before migrations; requires real Personnel DB files and whole typecheck
        default: false
        type: boolean
      profile_database:
        description: Opt-in reset/seed/template timing when the candidate implements test/profile.ts
        default: false
        type: boolean
      duration_order:
        description: Opt-in observed-duration file scheduling; cases and resources remain unchanged
        required: false
        default: false
        type: boolean
      run_typecheck:
        description: Whole-repository compiler check in a separate standard runner
        default: false
        type: boolean
      run_native_typecheck:
        description: Native app compiler with its strict Expo project and locked SDK dependencies
        default: false
        type: boolean
      run_native_swift_models:
        description: Swift proof-recovery host models on a standard GitHub macOS runner; no app or vendor call
        default: false
        type: boolean
      run_native_bundle:
        description: Production Metro and Hermes bundles for iPhone and Android
        default: false
        type: boolean
      run_build:
        description: Linux Node 20 production build in a separate standard runner
        default: false
        type: boolean
      browser_route_baseline:
        description: Time first and repeat browser opens against an isolated fictional installation
        default: false
        type: boolean
      browser_fixture_only:
        description: For browser_route_baseline, verify the disposable fixture without building or opening pages
        default: false
        type: boolean
      browser_group_shape:
        description: Add fictional workforces across 70 companies and verify the actual company switcher
        default: false
        type: boolean
      browser_static_shard:
        description: Static census shard (0–7), all, split:N to recover shard N, retry-timeouts, fixture-records, payroll-corrections, personnel-movement, attendance-records, payroll-formula-evaluation, or import-history
        default: ''
        type: string
      reuse_combined_census_build:
        description: Compare populated record pages using pinned production builds
        default: false
        type: boolean
      model_eval:
        description: Optional OpenRouter model id for the fictional-data Assistant ceiling probe (protected assistant-eval environment); empty skips
        required: false
        default: ''
        type: string
      eval_budget_usd:
        description: Hard spend cap in USD for model_eval (maximum 50)
        required: false
        default: '20'
        type: string
      eval_allowed_providers:
        description: Optional comma-separated OpenRouter upstream providers for model_eval
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: alpha-focused-${{ inputs.candidate_ref }}${{ inputs.reuse_combined_census_build && format('-census-{0}', inputs.browser_static_shard) || '' }}
  cancel-in-progress: false
env:
  TZ: Asia/Kuala_Lumpur
  LANG: en_US.UTF-8
  AIHR_CI_CONTROL_HEAD: ${{ github.workflow_sha }}
  AIHR_CI_PG_PROFILE: '2'
  AIHR_CI_PG_CONFIGURED_CAP_BYTES: '2113929216'
  AIHR_CI_PG_PEAK_BUDGET_BYTES: '2147483648'
  AIHR_CI_PG_JIT: 'on'
  AIHR_FOCUSED_PROFILE: ${{ inputs.profile_database }}
  AIHR_TEST_DURATION_ORDER: ${{ inputs.duration_order }}
  DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
jobs:
  resolve:
    if: ${{ github.repository == 'StradaverseHub/ai-hr' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      tests: ${{ steps.selection.outputs.tests }}
      static_shards: ${{ steps.selection.outputs.static_shards }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Pin dependency-free controller runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Focused controller regression checks
        run: node --experimental-strip-types --test .github/ci/focused-checks.test.mjs .github/ci/system-label-fonts.test.mjs .github/ci/ubuntu-browser-mirror.test.mjs .github/ci/postgres-evidence.test.mjs .github/ci/runner-capacity.test.mjs .github/ci/duration-order.test.mjs .github/ci/r395-write-split.test.mjs .github/ci/attendance-unclocked-split.test.mjs .github/ci/restricted-port-qualification.test.mjs .github/ci/build-heap.test.mjs .github/ci/next-application-cache.test.mjs .github/ci/next-build-cache-policy.test.mjs .github/ci/orchestrator-browser.test.mjs .github/ci/browser-static-census.test.mjs
      - name: Validate bounded manifest
        id: selection
        run: |
          if [[ -n "$BROWSER_STATIC_SHARD" ]] && { [[ ! "$BROWSER_STATIC_SHARD" =~ ^([0-7]|all|split:[0-7]|retry-timeouts|fixture-records|payroll-corrections|personnel-movement|attendance-records|attendance-deferred-picker|payroll-formula-evaluation|import-history)$ ]] || [[ "$BROWSER_BASELINE" != true || "$BROWSER_FIXTURE_ONLY" == true ]]; }; then
            exit 2
          fi
          if [[ "$BROWSER_STATIC_SHARD" =~ ^(retry-timeouts|fixture-records|payroll-corrections|personnel-movement|attendance-records|payroll-formula-evaluation|import-history)$ && "$BROWSER_GROUP_SHAPE" != true ]]; then
            echo 'The selected browser shard requires the group-scale fixture.'
            exit 2
          fi
          if [[ "$BROWSER_STATIC_SHARD" == attendance-deferred-picker ]]; then
            [[ "$EXPECTED_SHA" == 0ba883e0aa294bb0f15dcfe2433deedb52d11996 &&
              "$BROWSER_GROUP_SHAPE" == true && "$REUSE_CENSUS_BUILD" == true ]] || exit 2
          fi
          if [[ "$BROWSER_STATIC_SHARD" == payroll-corrections && "$REUSE_CENSUS_BUILD" != true &&
                "$EXPECTED_SHA" != d3d650a2ed0cee44f04c66702f58035e965a5a8f ]]; then
            exit 2
          fi
          if [[ "$REUSE_CENSUS_BUILD" == true ]]; then
            [[ "$BROWSER_STATIC_SHARD" =~ ^(fixture-records|payroll-corrections|personnel-movement|attendance-records|attendance-deferred-picker|payroll-formula-evaluation|import-history)$ && "$RUN_BUILD" != true ]]
            jq -e --arg source "$EXPECTED_SHA" 'has($source)' scripts/performance/fixture-record-builds.json > /dev/null
          fi
          if [[ "$BROWSER_STATIC_SHARD" == all ]]; then
            printf 'static_shards=["0","1","2","3","4","5","6","7"]\n' >> "$GITHUB_OUTPUT"
          elif [[ "$BROWSER_STATIC_SHARD" == split:* ]]; then
            shard=${BROWSER_STATIC_SHARD#split:}
            printf 'static_shards=["%s.0","%s.1","%s.2","%s.3"]\n' "$shard" "$shard" "$shard" "$shard" >> "$GITHUB_OUTPUT"
          else
            printf 'static_shards=["%s"]\n' "$BROWSER_STATIC_SHARD" >> "$GITHUB_OUTPUT"
          fi
          node .github/ci/focused-checks.mjs selection
        env:
          AIHR_FOCUSED_TESTS: ${{ inputs.selected_tests }}
          BROWSER_STATIC_SHARD: ${{ inputs.browser_static_shard }}
          REUSE_CENSUS_BUILD: ${{ inputs.reuse_combined_census_build }}
          RUN_BUILD: ${{ inputs.run_build }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          BROWSER_BASELINE: ${{ inputs.browser_route_baseline }}
          BROWSER_FIXTURE_ONLY: ${{ inputs.browser_fixture_only }}
          BROWSER_GROUP_SHAPE: ${{ inputs.browser_group_shape }}
      - name: Resolve frozen same-repository candidate
        id: candidate
        run: node .github/ci/resolve.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_BASE_SHA: ${{ vars.STAGING_DEPLOYED_SHA }}
  selected-tests:
    needs: [resolve, linux-build]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        static_shard: ${{ fromJSON(needs.resolve.outputs.static_shards || '[""]') }}
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (!inputs.browser_route_baseline || inputs.browser_fixture_only || inputs.reuse_combined_census_build || inputs.browser_static_shard == 'payroll-corrections' || needs.linux-build.result == 'success') }}
    runs-on: ubuntu-24.04
    # The fictional-data model ceiling probe needs the focused DB guard, which admits only this job, so the
    # protected environment and its secret attach here only when model_eval names a model.
    environment: ${{ !inputs.browser_route_baseline && inputs.model_eval != '' && 'assistant-eval' || '' }}
    timeout-minutes: ${{ inputs.browser_route_baseline && 50 || inputs.model_eval != '' && 45 || 20 }}
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_FOCUSED_TESTS: ${{ needs.resolve.outputs.tests }}
      AIHR_FOCUSED_SUITE_CAPACITY: 'true'
      AIHR_QUALIFY_RESTRICTED_PORT: ${{ inputs.qualify_restricted_port_prerequisites }}
      AIHR_RESTRICTED_PORT_TYPECHECK: ${{ inputs.run_typecheck }}
      AIHR_EVAL_OPENROUTER_KEY: ${{ !inputs.browser_route_baseline && inputs.model_eval != '' && secrets.OPENROUTER_API_KEY || '' }}
      AIHR_EVAL_MODEL: ${{ inputs.model_eval }}
      AIHR_EVAL_BUDGET_USD: ${{ inputs.eval_budget_usd }}
      AIHR_EVAL_ALLOWED_PROVIDERS: ${{ inputs.eval_allowed_providers }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with:
          node: ${{ inputs.browser_route_baseline && '20' || '22.23.3' }}
          capacity_profile: ${{ !inputs.browser_route_baseline && github.run_attempt == 1 && 'bounded-suite-setup' || 'legacy' }}
          mobile: ${{ !inputs.browser_route_baseline }}
      - name: Provision multilingual fonts for AI review screenshots
        if: ${{ contains(inputs.selected_tests, 'test/ai-management-naming.dom.test.tsx') || contains(inputs.selected_tests, 'test/ai-probe-history-page.dom.test.tsx') || contains(inputs.selected_tests, 'test/feedback-kanban.dom.test.tsx') || contains(inputs.selected_tests, 'test/security-center-sidebar.dom.test.tsx') || contains(inputs.selected_tests, 'test/system-label-exchange-browser.test.ts') }}
        run: node ../automation/.github/ci/fixed-noto-bootstrap.mjs "$RUNNER_TEMP/aihr-focused/noto-font-setup.json"
      - name: Classify and execute only selected files
        if: ${{ !inputs.browser_route_baseline }}
        run: node ../automation/.github/ci/focused-checks.mjs run "$RUNNER_TEMP/aihr-focused"
        env:
          AIHR_FOCUSED_EVIDENCE_DIR: ${{ runner.temp }}/aihr-focused
      - name: Summarize opt-in harness phase timings
        if: ${{ always() && !inputs.browser_route_baseline && inputs.profile_database }}
        run: node scripts/report-test-profile.mjs "$RUNNER_TEMP/aihr-focused/harness-profile" "$RUNNER_TEMP/aihr-focused/profile-summary.json"
      - name: Ensure owned database cleanup after interrupted checks
        if: always()
        run: bash ../automation/.github/ci/postgres.sh stop
        env:
          AIHR_CI_UNIT: db-1
      - if: ${{ always() && !inputs.browser_route_baseline }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focused-development-evidence
          path: ${{ runner.temp }}/aihr-focused/
          if-no-files-found: error
          retention-days: 14
      - run: pnpm exec playwright install --with-deps chromium
        if: ${{ inputs.browser_route_baseline && !inputs.browser_fixture_only }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: ${{ inputs.browser_route_baseline && !inputs.browser_fixture_only && !inputs.reuse_combined_census_build && inputs.browser_static_shard != 'payroll-corrections' }}
        with:
          name: fictional-browser-build
          path: ${{ runner.temp }}/fictional-browser-build
      - name: Retrieve the pinned Payroll correction build
        if: ${{ inputs.browser_static_shard == 'payroll-corrections' && !inputs.reuse_combined_census_build }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$AIHR_CI_HEAD" = d3d650a2ed0cee44f04c66702f58035e965a5a8f
          test "$(git rev-parse HEAD)" = "$AIHR_CI_HEAD"
          gh api repos/StradaverseHub/ai-hr/actions/jobs/136333906580 --jq '
            .conclusion == "success" and .run_attempt == 1 and .name == "linux-build" and
            .run_id == 44749573012 and .head_sha == "91a3a68f4998907ff4f084aea555404384419349"' | grep -qx true
          archive="$(mktemp "$RUNNER_TEMP/payroll-correction-build.XXXXXX")"
          trap 'rm -f "$archive"' EXIT
          gh api repos/StradaverseHub/ai-hr/actions/artifacts/14634664620/zip > "$archive"
          printf '%s  %s\n' 'f6b38a540af9513ffb012f99d2c30697a7c62573f5b315598a599a77daa697a1' "$archive" | sha256sum -c -
          test "$(unzip -Z1 "$archive" | LC_ALL=C sort)" = "$(printf '%s\n' build-bundle-files.json build-bundle.tar.gz source-sha)"
          install -d -m 700 "$RUNNER_TEMP/fictional-browser-build"
          unzip -q "$archive" -d "$RUNNER_TEMP/fictional-browser-build"
      - name: Retrieve the exact record comparison build
        if: ${{ inputs.reuse_combined_census_build }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$AIHR_CI_HEAD"
          pin="$(jq -er --arg source "$AIHR_CI_HEAD" '
            .[$source] | [.runId,.jobId,.artifactId,.controllerSha,.sha256] | @tsv
          ' ../automation/scripts/performance/fixture-record-builds.json)"
          IFS=$'\t' read -r run job artifact controller digest <<< "$pin"
          [[ "$run" =~ ^[0-9]+$ && "$job" =~ ^[0-9]+$ && "$artifact" =~ ^[0-9]+$ ]]
          [[ "$controller" =~ ^[a-f0-9]{40}$ && "$digest" =~ ^[a-f0-9]{64}$ ]]
          gh api "repos/StradaverseHub/ai-hr/actions/jobs/$job" | jq -e \
            --argjson run "$run" --arg sha "$controller" '
            .conclusion == "success" and .run_attempt == 1 and .name == "linux-build" and
            .run_id == $run and .head_sha == $sha' > /dev/null
          archive="$(mktemp "$RUNNER_TEMP/fixture-record-browser-build.XXXXXX")"
          trap 'rm -f "$archive"' EXIT
          gh api "repos/StradaverseHub/ai-hr/actions/artifacts/$artifact/zip" > "$archive"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum -c -
          test "$(unzip -Z1 "$archive" | LC_ALL=C sort)" = "$(printf '%s\n' build-bundle-files.json build-bundle.tar.gz source-sha)"
          install -d -m 700 "$RUNNER_TEMP/fictional-browser-build"
          unzip -q "$archive" -d "$RUNNER_TEMP/fictional-browser-build"
      - name: Verify the build for the exact browser source
        if: ${{ inputs.browser_route_baseline && !inputs.browser_fixture_only }}
        run: |
          packet="$RUNNER_TEMP/fictional-browser-build"
          test "$(cat "$packet/source-sha")" = "$AIHR_CI_HEAD"
          chmod 700 "$PWD"
          python3 ../automation/.github/ci/build-bundle.py unpack \
            "$packet/build-bundle.tar.gz" "$packet/build-bundle-files.json" .next "$PWD"
      - name: Measure the fictional production build in Chromium
        if: ${{ inputs.browser_route_baseline }}
        run: node --import tsx ../automation/scripts/performance/hosted-browser-route-baseline.mjs
        env:
          AIHR_BROWSER_FIXTURE_ONLY: ${{ inputs.browser_fixture_only }}
          AIHR_BROWSER_GROUP_SHAPE: ${{ inputs.browser_group_shape }}
          AIHR_BROWSER_STATIC_SHARD: ${{ matrix.static_shard }}
          AIHR_BROWSER_COMBINED_CENSUS_BUILD: ${{ inputs.reuse_combined_census_build }}
          AUTH_PROVIDER: internal
          AUTH_PUBLIC_ORIGIN: https://localhost:3443
      - name: Retain route timings without fixture sessions or raw logs
        if: ${{ always() && inputs.browser_route_baseline }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ (inputs.browser_static_shard == 'all' || startsWith(inputs.browser_static_shard, 'split:')) && format('browser-route-baseline-shard-{0}', matrix.static_shard) || 'browser-route-baseline' }}
          path: ${{ runner.temp }}/browser-route-baseline.json
          if-no-files-found: warn
          retention-days: 14
  static-census:
    if: ${{ inputs.browser_static_shard == 'all' && !cancelled() && needs.resolve.result == 'success' }}
    needs: [resolve, selected-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: browser-route-baseline-shard-*
          path: ${{ runner.temp }}/browser-static-shards
      - name: Reconcile the exact browser inventory and outcomes
        run: node scripts/performance/browser-static-census.mjs
        env:
          AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-static-census
          path: ${{ runner.temp }}/browser-static-census.json
          if-no-files-found: error
          retention-days: 14
  typecheck:
    if: ${{ inputs.run_typecheck }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
      - run: pnpm exec next typegen
      - run: bash ../automation/.github/ci/typecheck.sh
  linux-build:
    if: ${{ !inputs.reuse_combined_census_build && inputs.browser_static_shard != 'payroll-corrections' && (inputs.run_build || (inputs.browser_route_baseline && !inputs.browser_fixture_only)) }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.browser_route_baseline && 40 || 30 }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with:
          node: '20'
          mobile: ${{ !inputs.browser_route_baseline }}
      # Bounded next build heap: exactly 8192 MB, only this step, only on a GitHub-hosted 16 GB Linux
      # runner (build-heap.mjs refuses anything else and any value above 8192). Raising the ceiling needs
      # owner review: docs/reviews/build-capacity-8192-proposal.md. Rollback: revert restores 6144.
      - name: Admit bounded next build heap
        id: build-heap
        run: node ../automation/.github/ci/build-heap.mjs admit
        env:
          AIHR_CI_BUILD_HEAP_MB: '8192'
      - name: Production build with peak memory telemetry
        run: node ../automation/.github/ci/build-heap.mjs measure "$RUNNER_TEMP/next-build-memory" -- pnpm build
        env:
          AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
          NODE_OPTIONS: ${{ steps.build-heap.outputs.node_options }}
          AIHR_CI_BUILD_HEAP_PROFILE: ${{ steps.build-heap.outputs.heap_profile }}
          AIHR_CI_BUILD_HEAP_MEMTOTAL_KIB: ${{ steps.build-heap.outputs.memtotal_kib }}
      - name: Package the fictional browser build
        if: ${{ inputs.browser_route_baseline && !inputs.browser_fixture_only }}
        env:
          AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$AIHR_CI_HEAD"
          install -d -m 700 "$RUNNER_TEMP/browser-build-owned"
          packet="$RUNNER_TEMP/browser-build-owned/packet"
          python3 ../automation/.github/ci/build-bundle.py pack "$PWD" "$packet"
          printf '%s\n' "$AIHR_CI_HEAD" > "$packet/source-sha"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ inputs.browser_route_baseline && !inputs.browser_fixture_only }}
        with:
          name: fictional-browser-build
          path: ${{ runner.temp }}/browser-build-owned/packet/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Publish next build memory telemetry
        if: ${{ always() && steps.build-heap.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-build-memory
          path: ${{ runner.temp }}/next-build-memory/
          if-no-files-found: warn
          retention-days: 14
  native-typecheck:
    if: ${{ inputs.run_native_typecheck }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
      - name: Compile the whole native app with its strict Expo configuration
        run: npm --prefix mobile run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096


  native-bundle:
    if: ${{ inputs.run_native_bundle }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
      - name: Export production iPhone and Android bundles with the locked Expo CLI
        working-directory: source/mobile
        run: npm exec --offline -- expo export --platform ios --platform android --max-workers 2 --output-dir "$RUNNER_TEMP/mobile-native-bundles"
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          EXPO_OFFLINE: '1'
          EXPO_NO_TELEMETRY: '1'

  native-swift-models:
    if: ${{ inputs.run_native_swift_models }}
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 15
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Compile and exercise native proof handoff models
        run: bash automation/.github/ci/native-proof-models.sh "$GITHUB_WORKSPACE/source"

name: alpha-focused-checks
run-name: Focused only · ${{ inputs.candidate_ref }}
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Existing same-repository candidate branch
        required: true
        type: string
      expected_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      selected_tests:
        description: JSON array of 1–64 tracked unit/DOM test paths; candidate classifier owns DB selection
        required: true
        type: string
      qualify_restricted_port_prerequisites:
        description: Opt-in exact581 populated restricted-port prerequisite rehearsal before migrations; requires real Personnel DB files and whole typecheck
        default: false
        type: boolean
      profile_database:
        description: Opt-in reset/seed/template timing when the candidate implements test/profile.ts
        default: false
        type: boolean
      duration_order:
        description: Opt-in observed-duration file scheduling; cases and resources remain unchanged
        required: false
        default: false
        type: boolean
      run_typecheck:
        description: Whole-repository compiler check in a separate standard runner
        default: false
        type: boolean
      run_native_typecheck:
        description: Native app compiler with its strict Expo project and locked SDK dependencies
        default: false
        type: boolean
      run_native_swift_models:
        description: Swift proof-recovery host models on a standard GitHub macOS runner; no app or vendor call
        default: false
        type: boolean
      run_native_bundle:
        description: Production Metro and Hermes bundles for iPhone and Android
        default: false
        type: boolean
      run_build:
        description: Linux Node 20 production build in a separate standard runner
        default: false
        type: boolean
      browser_route_baseline:
        description: Time first and repeat browser opens against an isolated fictional installation
        default: false
        type: boolean
      browser_fixture_only:
        description: For browser_route_baseline, verify the disposable fixture without building or opening pages
        default: false
        type: boolean
      browser_mixed_load:
        description: Use the 500-user mixed-workflow fixture and run it unless browser_fixture_only is selected
        default: false
        type: boolean
      browser_established_attendance:
        description: Provision the default Attendance rule before mixed traffic for the existing-tenant comparison
        default: false
        type: boolean
      browser_lock_log_calibration_only:
        description: Verify the collector against a known wait in the disposable database and stop before load
        default: false
        type: boolean
      browser_lock_log_short_window:
        description: Attribute shorter PostgreSQL waits in the disposable load fixture
        default: false
        type: boolean
      browser_replacement_catalogue:
        description: Controlled fictional comparison of replacement leave type presence (absent or present)
        default: ''
        type: string
      reuse_first_use_build:
        description: Reuse the exact verified application build for the lock-attribution diagnostic
        default: false
        type: boolean
      mixed_shell_permission_variant:
        description: Compare a specific navigation or clocking variant on the pinned fixture
        type: choice
        default: none
        options: [none, contract-control, contract-optimized, contract-optimized-clocking-queue, contract-optimized-rewards-navigation]
      mixed_database_topology:
        description: Compare direct web connections and bounded pool sizes on the pinned fictional workload
        type: choice
        default: direct
        options: [direct, transaction-pool, transaction-pool-12]
      mixed_group_scale:
        description: Add the existing 70-company group fixture without changing the 500 traffic actors
        default: false
        type: boolean
      model_eval:
        description: Optional OpenRouter model id for the fictional-data Assistant ceiling probe (protected assistant-eval environment); empty skips
        required: false
        default: ''
        type: string
      eval_budget_usd:
        description: Hard spend cap in USD for model_eval (maximum 50)
        required: false
        default: '20'
        type: string
      eval_allowed_providers:
        description: Optional comma-separated OpenRouter upstream providers for model_eval
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: alpha-focused-shell-permissions-${{ inputs.candidate_ref }}-${{ inputs.mixed_shell_permission_variant }}-${{ inputs.mixed_database_topology }}-${{ inputs.mixed_group_scale }}
  cancel-in-progress: false
env:
  TZ: Asia/Kuala_Lumpur
  LANG: en_US.UTF-8
  AIHR_CI_CONTROL_HEAD: ${{ github.workflow_sha }}
  AIHR_CI_PG_PROFILE: '2'
  AIHR_CI_PG_CONFIGURED_CAP_BYTES: '2113929216'
  AIHR_CI_PG_PEAK_BUDGET_BYTES: '2147483648'
  AIHR_CI_PG_JIT: 'on'
  AIHR_FOCUSED_PROFILE: ${{ inputs.profile_database }}
  AIHR_TEST_DURATION_ORDER: ${{ inputs.duration_order }}
  DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
jobs:
  resolve:
    if: ${{ github.repository == 'StradaverseHub/ai-hr' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      tests: ${{ steps.selection.outputs.tests }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Pin dependency-free controller runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Focused controller regression checks
        run: node --experimental-strip-types --test .github/ci/focused-checks.test.mjs .github/ci/system-label-fonts.test.mjs .github/ci/ubuntu-browser-mirror.test.mjs .github/ci/postgres-evidence.test.mjs .github/ci/runner-capacity.test.mjs .github/ci/duration-order.test.mjs .github/ci/r395-write-split.test.mjs .github/ci/attendance-unclocked-split.test.mjs .github/ci/restricted-port-qualification.test.mjs .github/ci/build-heap.test.mjs .github/ci/next-application-cache.test.mjs .github/ci/next-build-cache-policy.test.mjs .github/ci/orchestrator-browser.test.mjs .github/ci/mixed-root-statement-work.test.mjs
      - name: Check mixed-load diagnostic field projection
        run: node --test .github/ci/access-lock-server-log.test.mjs .github/ci/mixed-preflight-lock-evidence.test.mjs .github/ci/mixed-driver-primary-origin.test.mjs .github/ci/mixed-root-statement-work.test.mjs .github/ci/mixed-loaded-advisory.test.mjs .github/ci/loaded-access-blockers.test.mjs .github/ci/mixed-response-phases.test.mjs
      - name: Validate bounded manifest
        id: selection
        run: |
          if [[ "$MIXED_DATABASE_TOPOLOGY" == transaction-pool-12 ]]; then
            [[ "$EXPECTED_SHA" == a1d4cbb7bef482f7a6c8b75ab7fbec7611976857 &&
              "$SHELL_PERMISSION_VARIANT" == contract-optimized && "$REUSE_BUILD" == true ]] || exit 2
            MIXED_DATABASE_TOPOLOGY=transaction-pool
          fi
          clocking_tenant_queue=false
          if [[ "$SHELL_PERMISSION_VARIANT" == contract-optimized-clocking-queue ]]; then
            clocking_tenant_queue=true
            SHELL_PERMISSION_VARIANT=contract-optimized
          fi
          if [[ "$SHELL_PERMISSION_VARIANT" == contract-optimized-rewards-navigation ]]; then
            [[ "$EXPECTED_SHA" == a1d4cbb7bef482f7a6c8b75ab7fbec7611976857 && "$REUSE_BUILD" == true &&
              "$MIXED_DATABASE_TOPOLOGY" == transaction-pool && "$REPLACEMENT_CATALOGUE" == present &&
              "$ESTABLISHED_ATTENDANCE" == true && "$MIXED_GROUP_SCALE" == true && "$BROWSER_MIXED_LOAD" == true ]] || exit 2
            SHELL_PERMISSION_VARIANT=contract-optimized
          fi
          if [[ "$BROWSER_MIXED_LOAD" == true && "$BROWSER_ROUTE_BASELINE" != true ]]; then
            exit 2
          fi
          if [[ "$ESTABLISHED_ATTENDANCE" == true && "$BROWSER_MIXED_LOAD" != true ]]; then
            exit 2
          fi
          if [[ "$LOCK_LOG_CALIBRATION_ONLY" == true && "$REUSE_BUILD" != true ]]; then
            exit 2
          fi
          if [[ "$LOCK_LOG_SHORT_WINDOW" == true && ( "$REUSE_BUILD" != true || "$LOCK_LOG_CALIBRATION_ONLY" == true ) ]]; then
            exit 2
          fi
          if [[ -n "$REPLACEMENT_CATALOGUE" ]] && {
            [[ ! "$REPLACEMENT_CATALOGUE" =~ ^(absent|present)$ || "$ESTABLISHED_ATTENDANCE" != true || "$BROWSER_FIXTURE_ONLY" == true ]];
          }; then exit 2; fi
          if [[ "$REUSE_BUILD" == true ]] && {
            [[ "$BROWSER_MIXED_LOAD" != true || "$ESTABLISHED_ATTENDANCE" != true || "$BROWSER_FIXTURE_ONLY" == true || "$RUN_BUILD" == true ]] ||
            [[ "$REPLACEMENT_CATALOGUE" != present || "$LOCK_LOG_CALIBRATION_ONLY" == true || "$LOCK_LOG_SHORT_WINDOW" == true ]];
          }; then exit 2; fi
          combined_group_build=false
          if [[ ( "$EXPECTED_SHA" == 5175d387846c18fcc83ef96091cb1b4e1b538241 ||
                  "$EXPECTED_SHA" == 71e0dceb1a393817f3040518e82dc845a27700b0 ||
                  "$EXPECTED_SHA" == 5542ba9a2d2cbe6fa7c3918f342f3936cb3e61e4 ||
                  "$EXPECTED_SHA" == 0ba883e0aa294bb0f15dcfe2433deedb52d11996 ||
                  "$EXPECTED_SHA" == 57fac422707b3a6174a290722ea0bb53da89f7c0 ||
                  "$EXPECTED_SHA" == 52d2d170710fcfb14219abe2f9d0abc84e536748 ||
                  "$EXPECTED_SHA" == 5e34835d73183b2754c9b3e4ccdbfc31111917a8 ||
                  "$EXPECTED_SHA" == a1d4cbb7bef482f7a6c8b75ab7fbec7611976857 ||
                  "$EXPECTED_SHA" == 34acbbea020f09217a44711f615b750b0a139302 ||
                  "$EXPECTED_SHA" == 84bad4f960c5f81475cdc4f71462bb452852fa9a ||
                  "$EXPECTED_SHA" == d855add8ba13ab3329b2b9aee35f4aed338193d0 ||
                  "$EXPECTED_SHA" == d552f70c13b8a46cf19fdd973ecbe2f80c7ccf79 ||
                  "$EXPECTED_SHA" == 24e0b499be5f009c409e539c1e78add85d7f3b03 ||
                  "$EXPECTED_SHA" == a9fd4c3c1b927cc5ed5adc8d4033dd3f124b3778 ||
                  "$EXPECTED_SHA" == b582a3d30f2f8d22d56e46da881f405ce7095834 ||
                  "$EXPECTED_SHA" == 4340a82c73b11541daa8811aaf7b534debb81ce3 ||
                  "$EXPECTED_SHA" == 681ddc918ef99f9f632c3067d8f0624aaa5f8b21 ||
                  "$EXPECTED_SHA" == 71a619623a1571341279ff9b9cac25d09d991bbc ||
                  "$EXPECTED_SHA" == ef953a158bf1fde5073ca43557268add5ff0883e ) && "$MIXED_GROUP_SCALE" == true &&
                "$BROWSER_MIXED_LOAD" == true && "$ESTABLISHED_ATTENDANCE" == true &&
                "$REPLACEMENT_CATALOGUE" == present && "$MIXED_DATABASE_TOPOLOGY" == transaction-pool &&
                "$SHELL_PERMISSION_VARIANT" == contract-optimized ]]; then
            combined_group_build=true
          fi
          if [[ "$clocking_tenant_queue" == true ]]; then
            [[ "$combined_group_build" == true && "$BROWSER_ROUTE_BASELINE" == true &&
                "$BROWSER_FIXTURE_ONLY" != true ]] || exit 2
            case "$EXPECTED_SHA" in
              a1d4cbb7bef482f7a6c8b75ab7fbec7611976857)
                [[ "$RUN_BUILD" == true && "$REUSE_BUILD" != true ]] || exit 2 ;;
              b582a3d30f2f8d22d56e46da881f405ce7095834)
                [[ "$RUN_BUILD" != true && "$REUSE_BUILD" == true ]] || exit 2 ;;
              *) exit 2 ;;
            esac
          fi
          if [[ "$REUSE_BUILD" == true ]]; then
            case "$MIXED_GROUP_SCALE:$EXPECTED_SHA" in
              false:b00e2b2738312d87d5bea6f0ac7c877517d0b75d|false:a5ac5bcda1f67cdaf5b61ed37b70f52c54c66d55|true:cddd7cebf757d0392ed06bead78300732fd54256) ;;
              true:5175d387846c18fcc83ef96091cb1b4e1b538241|true:71e0dceb1a393817f3040518e82dc845a27700b0|true:0ba883e0aa294bb0f15dcfe2433deedb52d11996|true:57fac422707b3a6174a290722ea0bb53da89f7c0|true:52d2d170710fcfb14219abe2f9d0abc84e536748|true:5e34835d73183b2754c9b3e4ccdbfc31111917a8|true:a1d4cbb7bef482f7a6c8b75ab7fbec7611976857)
                [[ "$combined_group_build" == true ]] || exit 2 ;;
              true:84bad4f960c5f81475cdc4f71462bb452852fa9a|true:d855add8ba13ab3329b2b9aee35f4aed338193d0|true:a9fd4c3c1b927cc5ed5adc8d4033dd3f124b3778|true:b582a3d30f2f8d22d56e46da881f405ce7095834|true:681ddc918ef99f9f632c3067d8f0624aaa5f8b21)
                [[ "$combined_group_build" == true ]] || exit 2 ;;
              *) exit 2 ;;
            esac
          fi
          case "$SHELL_PERMISSION_VARIANT" in
            none) ;;
            contract-control|contract-optimized)
              [[ ( "$REUSE_BUILD" == true || "$combined_group_build" == true ) && "$BROWSER_MIXED_LOAD" == true && "$MIXED_GROUP_SCALE" == true && "$MIXED_DATABASE_TOPOLOGY" == transaction-pool ]] || exit 2
              [[ "$EXPECTED_SHA" == cddd7cebf757d0392ed06bead78300732fd54256 || "$combined_group_build" == true ]] || exit 2
              ;;
            *) exit 2 ;;
          esac
          case "$MIXED_DATABASE_TOPOLOGY" in
            direct) ;;
            transaction-pool) [[ "$REUSE_BUILD" == true || "$combined_group_build" == true ]] || exit 2 ;;
            *) exit 2 ;;
          esac
          if [[ "$MIXED_GROUP_SCALE" == true && "$REUSE_BUILD" != true && "$combined_group_build" != true ]]; then
            exit 2
          fi
          node .github/ci/focused-checks.mjs selection
        env:
          AIHR_FOCUSED_TESTS: ${{ inputs.selected_tests }}
          BROWSER_MIXED_LOAD: ${{ inputs.browser_mixed_load }}
          BROWSER_ROUTE_BASELINE: ${{ inputs.browser_route_baseline }}
          BROWSER_FIXTURE_ONLY: ${{ inputs.browser_fixture_only }}
          ESTABLISHED_ATTENDANCE: ${{ inputs.browser_established_attendance }}
          LOCK_LOG_CALIBRATION_ONLY: ${{ inputs.browser_lock_log_calibration_only }}
          LOCK_LOG_SHORT_WINDOW: ${{ inputs.browser_lock_log_short_window }}
          REPLACEMENT_CATALOGUE: ${{ inputs.browser_replacement_catalogue }}
          REUSE_BUILD: ${{ inputs.reuse_first_use_build }}
          SHELL_PERMISSION_VARIANT: ${{ inputs.mixed_shell_permission_variant }}
          MIXED_DATABASE_TOPOLOGY: ${{ inputs.mixed_database_topology }}
          MIXED_GROUP_SCALE: ${{ inputs.mixed_group_scale }}
          RUN_BUILD: ${{ inputs.run_build }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
      - name: Resolve frozen same-repository candidate
        id: candidate
        run: node .github/ci/resolve.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_BASE_SHA: ${{ vars.STAGING_DEPLOYED_SHA }}
  selected-tests:
    needs: [resolve, linux-build]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (!inputs.browser_route_baseline || inputs.browser_fixture_only || inputs.reuse_first_use_build || needs.linux-build.result == 'success') }}
    runs-on: ubuntu-24.04
    # The fictional-data model ceiling probe needs the focused DB guard, which admits only this job, so the
    # protected environment and its secret attach here only when model_eval names a model.
    environment: ${{ !inputs.browser_route_baseline && inputs.model_eval != '' && 'assistant-eval' || '' }}
    timeout-minutes: ${{ inputs.browser_route_baseline && 50 || inputs.model_eval != '' && 45 || 20 }}
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_FOCUSED_TESTS: ${{ needs.resolve.outputs.tests }}
      AIHR_FOCUSED_SUITE_CAPACITY: 'true'
      AIHR_QUALIFY_RESTRICTED_PORT: ${{ inputs.qualify_restricted_port_prerequisites }}
      AIHR_RESTRICTED_PORT_TYPECHECK: ${{ inputs.run_typecheck }}
      AIHR_EVAL_OPENROUTER_KEY: ${{ !inputs.browser_route_baseline && inputs.model_eval != '' && secrets.OPENROUTER_API_KEY || '' }}
      AIHR_EVAL_MODEL: ${{ inputs.model_eval }}
      AIHR_EVAL_BUDGET_USD: ${{ inputs.eval_budget_usd }}
      AIHR_EVAL_ALLOWED_PROVIDERS: ${{ inputs.eval_allowed_providers }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Provision the mixed workload driver runtime
        if: ${{ inputs.browser_mixed_load }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Record the owned mixed driver executable
        if: ${{ inputs.browser_mixed_load }}
        id: mixed-driver-node
        run: printf 'exec-path=%s\n' "$(command -v node)" >> "$GITHUB_OUTPUT"
      - uses: ./automation/.github/actions/setup-alpha
        with:
          node: ${{ inputs.browser_route_baseline && '20' || '22.23.3' }}
          capacity_profile: ${{ !inputs.browser_route_baseline && github.run_attempt == 1 && 'bounded-suite-setup' || 'legacy' }}
          mobile: ${{ !inputs.browser_route_baseline }}
      - name: Provision multilingual fonts for AI review screenshots
        if: ${{ contains(inputs.selected_tests, 'test/ai-management-naming.dom.test.tsx') || contains(inputs.selected_tests, 'test/ai-probe-history-page.dom.test.tsx') || contains(inputs.selected_tests, 'test/feedback-kanban.dom.test.tsx') || contains(inputs.selected_tests, 'test/security-center-sidebar.dom.test.tsx') || contains(inputs.selected_tests, 'test/system-label-exchange-browser.test.ts') }}
        run: node ../automation/.github/ci/fixed-noto-bootstrap.mjs "$RUNNER_TEMP/aihr-focused/noto-font-setup.json"
      - name: Classify and execute only selected files
        if: ${{ !inputs.browser_route_baseline }}
        run: node ../automation/.github/ci/focused-checks.mjs run "$RUNNER_TEMP/aihr-focused"
        env:
          AIHR_FOCUSED_EVIDENCE_DIR: ${{ runner.temp }}/aihr-focused
      - name: Summarize opt-in harness phase timings
        if: ${{ always() && !inputs.browser_route_baseline && inputs.profile_database }}
        run: node scripts/report-test-profile.mjs "$RUNNER_TEMP/aihr-focused/harness-profile" "$RUNNER_TEMP/aihr-focused/profile-summary.json"
      - name: Ensure owned database cleanup after interrupted checks
        if: always()
        run: bash ../automation/.github/ci/postgres.sh stop
        env:
          AIHR_CI_UNIT: db-1
      - if: ${{ always() && !inputs.browser_route_baseline }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focused-development-evidence
          path: ${{ runner.temp }}/aihr-focused/
          if-no-files-found: error
          retention-days: 14
      - run: pnpm exec playwright install --with-deps chromium
        if: ${{ inputs.browser_route_baseline && !inputs.browser_fixture_only }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: ${{ inputs.browser_route_baseline && !inputs.browser_fixture_only && !inputs.reuse_first_use_build }}
        with:
          name: fictional-browser-build
          path: ${{ runner.temp }}/fictional-browser-build
      - name: Retrieve the pinned candidate build
        if: ${{ inputs.reuse_first_use_build }}
        env:
          GH_TOKEN: ${{ github.token }}
          MIXED_GROUP_SCALE: ${{ inputs.mixed_group_scale }}
        run: |
          build_source=b00e2b2738312d87d5bea6f0ac7c877517d0b75d
          test "$(git rev-parse HEAD)" = "$AIHR_CI_HEAD"
          archive="$(mktemp "$RUNNER_TEMP/shell-readiness-build.XXXXXX")"
          trap 'rm -f "$archive"' EXIT
          if [[ "$AIHR_CI_HEAD" == a9fd4c3c1b927cc5ed5adc8d4033dd3f124b3778 ]]; then
            test "$MIXED_GROUP_SCALE" = true
            gh api repos/StradaverseHub/ai-hr/actions/jobs/137221081335 --jq '
              .conclusion == "success" and .run_attempt == 1 and .name == "linux-build" and
              .run_id == 45026626109 and .head_sha == "d8ce042be7e1de0472ea7702027039796e4d4e83"' | grep -qx true
            gh api repos/StradaverseHub/ai-hr/actions/artifacts/14756157969/zip > "$archive"
            digest=388af87699794d4edff5b1853d8c7e0aafce047bf98304d2767fd4c6e20c4532
          elif [[ "$AIHR_CI_HEAD" == b582a3d30f2f8d22d56e46da881f405ce7095834 ]]; then
            test "$MIXED_GROUP_SCALE" = true
            gh api repos/StradaverseHub/ai-hr/actions/jobs/137228606779 --jq '
              .conclusion == "success" and .run_attempt == 1 and .name == "linux-build" and
              .run_id == 45029090809 and .head_sha == "c0e112dc0b7504cc89e8cf27b46fe72e6df94c1f"' | grep -qx true
            gh api repos/StradaverseHub/ai-hr/actions/artifacts/14757710637/zip > "$archive"
            digest=ed9ba0c2f6cc151f31a1a2f99cd17e8bb86b0eea627f69d38bcf78d4555bbc5e
          elif [[ "$AIHR_CI_HEAD" == 681ddc918ef99f9f632c3067d8f0624aaa5f8b21 ]]; then
            test "$MIXED_GROUP_SCALE" = true
            test "$(git rev-parse HEAD~2)" = 4340a82c73b11541daa8811aaf7b534debb81ce3
            test "$(git diff --name-status HEAD~2 HEAD)" = "$(printf '%s\t%s\n' M scripts/performance/lock-sample-attribution.mjs M scripts/performance/system-load-owner.mjs)"
            gh api repos/StradaverseHub/ai-hr/actions/jobs/137264177153 --jq '
              .conclusion == "success" and .run_attempt == 1 and .name == "linux-build" and
              .run_id == 45040634196 and .head_sha == "5303511144da0513cc3158edd7df93ae7d2ce4d5"' | grep -qx true
            gh api repos/StradaverseHub/ai-hr/actions/artifacts/14761723496/zip > "$archive"
            digest=bfec8369e5a98395d25011a632f481fcde1c3f3e6d23286d62c538ba05d98067
          elif [[ "$AIHR_CI_HEAD" == d855add8ba13ab3329b2b9aee35f4aed338193d0 ]]; then
            test "$MIXED_GROUP_SCALE" = true
            test "$(git rev-parse HEAD^)" = ef953a158bf1fde5073ca43557268add5ff0883e
            test "$(git diff --name-status HEAD^ HEAD)" = "$(printf 'M\tscripts/performance/system-load-owner.mjs')"
            gh api repos/StradaverseHub/ai-hr/actions/jobs/137081473585 --jq '
              .conclusion == "success" and .run_attempt == 1 and .name == "linux-build" and
              .run_id == 44981038272 and .head_sha == "2157fadbeaf79c40bf1daa8797307c5d2dfc4f6f"' | grep -qx true
            gh api repos/StradaverseHub/ai-hr/actions/artifacts/14737468790/zip > "$archive"
            digest=b02422d5d63c215dabb6215ec03b7b7a366f4b13aadb161fc5b763654c3619a0
          elif [[ "$AIHR_CI_HEAD" == 84bad4f960c5f81475cdc4f71462bb452852fa9a ]]; then
            test "$MIXED_GROUP_SCALE" = true
            test "$(git rev-parse HEAD^)" = 34acbbea020f09217a44711f615b750b0a139302
            test "$(git diff --name-status HEAD^ HEAD)" = "$(printf 'M\tscripts/performance/system-load-owner.mjs')"
            gh api repos/StradaverseHub/ai-hr/actions/jobs/137077476813 --jq '

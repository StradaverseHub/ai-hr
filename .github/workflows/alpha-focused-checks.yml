name: alpha-focused-checks
run-name: Focused only · ${{ inputs.candidate_ref }}
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Existing same-repository candidate branch
        required: true
        type: string
      expected_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      selected_tests:
        description: JSON array of 1–64 tracked unit/DOM test paths; candidate classifier owns DB selection
        required: true
        type: string
      architecture_browser_development_preflight:
        description: Fixed first-attempt fictional two-worker functional browser course, without load or release authority
        default: false
        type: boolean
      measured_browser_course:
        description: Full role-route preflight or same-source 2, 4 and 8 worker comparison
        type: choice
        options: ['off', 'preflight-2', 'serial-2-4-8']
        default: 'off'
      measured_browser_preflight_run:
        description: Successful full browser preflight run ID on the same immutable source
        type: string
        default: ''
      employee_ascii_qualification:
        description: Closed development-only employee ASCII semantic cell; requires the exact proof and product selectors
        default: 'off'
        type: choice
        options: ['off', node22, node24]
      qualify_restricted_port_prerequisites:
        description: Opt-in exact581 populated restricted-port prerequisite rehearsal before migrations; requires real Personnel DB files and whole typecheck
        default: false
        type: boolean
      profile_database:
        description: Opt-in reset/seed/template timing when the candidate implements test/profile.ts
        default: false
        type: boolean
      duration_order:
        description: Opt-in observed-duration file scheduling; cases and resources remain unchanged
        required: false
        default: false
        type: boolean
      run_typecheck:
        description: Whole-repository compiler check in a separate standard runner
        default: false
        type: boolean
      run_native_typecheck:
        description: Native app compiler with its strict Expo project and locked SDK dependencies
        default: false
        type: boolean
      run_native_swift_models:
        description: Swift proof-recovery host models on a standard GitHub macOS runner; no app or vendor call
        default: false
        type: boolean
      run_native_bundle:
        description: Production Metro and Hermes bundles for iPhone and Android
        default: false
        type: boolean
      run_build:
        description: Linux Node 20 production build in a separate standard runner
        default: false
        type: boolean
      model_eval:
        description: Optional OpenRouter model id for the fictional-data Assistant ceiling probe (protected assistant-eval environment); empty skips
        required: false
        default: ''
        type: string
      eval_budget_usd:
        description: Hard spend cap in USD for model_eval (maximum 50)
        required: false
        default: '20'
        type: string
      eval_allowed_providers:
        description: Optional comma-separated OpenRouter upstream providers for model_eval
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: alpha-focused-${{ inputs.candidate_ref }}
  cancel-in-progress: false
env:
  TZ: Asia/Kuala_Lumpur
  LANG: en_US.UTF-8
  AIHR_CI_CONTROL_HEAD: ${{ github.workflow_sha }}
  AIHR_CI_PG_PROFILE: '2'
  AIHR_CI_PG_CONFIGURED_CAP_BYTES: '2113929216'
  AIHR_CI_PG_PEAK_BUDGET_BYTES: '2147483648'
  AIHR_CI_PG_JIT: 'on'
  AIHR_FOCUSED_PROFILE: ${{ inputs.profile_database }}
  AIHR_TEST_DURATION_ORDER: ${{ inputs.duration_order }}
  AIHR_EMPLOYEE_ASCII_QUALIFICATION: ${{ inputs.employee_ascii_qualification || 'off' }}
  DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
jobs:
  resolve:
    if: ${{ github.repository == 'StradaverseHub/ai-hr' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      tests: ${{ steps.selection.outputs.tests }}
      worker_admission: ${{ steps.worker-prerequisite.outputs.admission }}
      worker_admission_sha256: ${{ steps.worker-prerequisite.outputs.sha256 }}
      protected_db_client: ${{ steps.protected-db-client-dispatch.outputs.admitted }}
    steps:
      - name: Admit the exact protected DB client diagnostic before checkout
        id: protected-db-client-dispatch
        if: ${{ github.ref == 'refs/heads/codex/compiler-protected-db-client-ab-6c05-20261109' }}
        env:
          STAGING_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          /usr/bin/python3 -I -B - <<'PYTHON'
          import json, os, re, stat
          from pathlib import Path

          repo_name = 'StradaverseHub/ai-hr'
          branch = 'codex/compiler-protected-db-client-ab-6c05-20261109'
          ref = 'refs/heads/' + branch
          sha = os.environ.get('GITHUB_WORKFLOW_SHA', '')
          run = os.environ.get('GITHUB_RUN_ID', '')
          expected_environment = {
              'GITHUB_ACTIONS': 'true', 'CI': 'true', 'RUNNER_ENVIRONMENT': 'github-hosted',
              'RUNNER_OS': 'Linux', 'RUNNER_ARCH': 'X64', 'GITHUB_REPOSITORY': repo_name,
              'GITHUB_REPOSITORY_ID': '1333414856', 'GITHUB_EVENT_NAME': 'workflow_dispatch',
              'GITHUB_WORKFLOW': 'alpha-focused-checks', 'GITHUB_JOB': 'resolve', 'GITHUB_RUN_ATTEMPT': '1',
              'GITHUB_REF': ref, 'GITHUB_WORKFLOW_REF': repo_name + '/.github/workflows/alpha-focused-checks.yml@' + ref,
              'GITHUB_SHA': sha, 'AIHR_CI_CONTROL_HEAD': sha, 'STAGING_ENABLED': 'false', 'PRODUCTION_ENABLED': 'false',
          }
          if (not re.fullmatch(r'[a-f0-9]{40}', sha) or not re.fullmatch(r'[1-9][0-9]{0,15}', run)
                  or int(run) > 2**53 - 1 or any(os.environ.get(k) != v for k, v in expected_environment.items())):
              raise SystemExit('Protected DB client host, source or deployment admission refused')
          temp = Path(os.environ['RUNNER_TEMP'])
          path = temp / '_github_workflow' / 'event.json'
          if path != Path(os.environ['GITHUB_EVENT_PATH']) or path.resolve(strict=True) != path:
              raise SystemExit('Protected DB client event path refused')
          def identity(info):
              return (info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_nlink, info.st_size,
                      info.st_mtime_ns, info.st_ctime_ns)
          with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK), 'rb') as stream:
              before = os.fstat(stream.fileno())
              if (not stat.S_ISREG(before.st_mode) or before.st_uid != os.getuid() or before.st_nlink != 1
                      or before.st_mode & 0o022 or not 0 < before.st_size <= 65536):
                  raise SystemExit('Protected DB client event custody refused')
              raw = stream.read(65537)
              if len(raw) != before.st_size or identity(before) != identity(os.fstat(stream.fileno())) or identity(before) != identity(path.lstat()):
                  raise SystemExit('Protected DB client event changed')
          def unique(pairs):
              result = dict(pairs)
              if len(result) != len(pairs):
                  raise SystemExit('Protected DB client event duplicated a field')
              return result
          event = json.loads(raw, object_pairs_hook=unique)
          repo = event.get('repository', {})
          inputs = event.get('inputs')
          if type(inputs) is not dict:
              raise SystemExit('Protected DB client dispatch inputs refused')
          for name in ('model_eval', 'eval_allowed_providers', 'measured_browser_preflight_run'):
              inputs.setdefault(name, '')
          expected_inputs = {
              'candidate_ref': branch, 'expected_sha': sha, 'selected_tests': '["test/compiler-native-reference-fixture.test.ts"]',
              'architecture_browser_development_preflight': 'false', 'measured_browser_course': 'off',
              'measured_browser_preflight_run': '', 'employee_ascii_qualification': 'off',
              'qualify_restricted_port_prerequisites': 'false', 'profile_database': 'false', 'duration_order': 'false',
              'run_typecheck': 'false', 'run_native_typecheck': 'false', 'run_native_swift_models': 'false',
              'run_native_bundle': 'false', 'run_build': 'false', 'model_eval': '', 'eval_budget_usd': '20', 'eval_allowed_providers': '',
          }
          if (event.get('ref') not in (branch, ref) or repo.get('id') != 1333414856
                  or repo.get('full_name') != repo_name or repo.get('private') is not False
                  or repo.get('fork') is not False or repo.get('default_branch') != 'main' or inputs != expected_inputs):
              raise SystemExit('Protected DB client dispatch inputs refused')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as output:
              output.write('admitted=true\n')
          PYTHON
      - name: Admit only the fixed development browser dispatch
        if: ${{ inputs.architecture_browser_development_preflight }}
        env:
          STAGING_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          /usr/bin/python3 -I -B - <<'PYTHON'
          import json, os, re

          repository = 'StradaverseHub/ai-hr'
          branch = 'codex/architecture-five-item-browser-convergence-20261109'
          ref = 'refs/heads/' + branch
          workflow = repository + '/.github/workflows/alpha-focused-checks.yml@' + ref
          sha = os.environ.get('GITHUB_WORKFLOW_SHA', '')
          expected_environment = {
              'GITHUB_ACTIONS': 'true', 'CI': 'true', 'RUNNER_ENVIRONMENT': 'github-hosted',
              'RUNNER_OS': 'Linux', 'RUNNER_ARCH': 'X64', 'GITHUB_REPOSITORY': repository,
              'GITHUB_REPOSITORY_ID': '1333414856', 'GITHUB_EVENT_NAME': 'workflow_dispatch',
              'GITHUB_WORKFLOW': 'alpha-focused-checks', 'GITHUB_JOB': 'resolve', 'GITHUB_RUN_ATTEMPT': '1',
              'GITHUB_REF': ref, 'GITHUB_WORKFLOW_REF': workflow, 'GITHUB_SHA': sha,
              'AIHR_CI_CONTROL_HEAD': sha, 'STAGING_ENABLED': 'false', 'PRODUCTION_ENABLED': 'false',
          }
          if (not re.fullmatch(r'[a-f0-9]{40}', sha)
                  or any(os.environ.get(key) != value for key, value in expected_environment.items())):
              raise SystemExit('Development browser event, runner, source or deployment policy refused')
          with open(os.environ['GITHUB_EVENT_PATH'], 'rb') as stream:
              raw = stream.read(65537)
          if not 0 < len(raw) <= 65536:
              raise SystemExit('Development browser event exceeds bound')
          event = json.loads(raw)
          repo = event.get('repository', {})
          expected_inputs = {
              'candidate_ref': branch, 'expected_sha': sha, 'selected_tests': '[]',
              'architecture_browser_development_preflight': 'true', 'employee_ascii_qualification': 'off',
              'measured_browser_course': 'off', 'measured_browser_preflight_run': '',
              'qualify_restricted_port_prerequisites': 'false', 'profile_database': 'false', 'duration_order': 'false',
              'run_typecheck': 'false', 'run_native_typecheck': 'false', 'run_native_swift_models': 'false',
              'run_native_bundle': 'false', 'run_build': 'false', 'model_eval': '', 'eval_budget_usd': '20',
              'eval_allowed_providers': '',
          }
          inputs = event.get('inputs')
          if type(inputs) is not dict:
              raise SystemExit('Development browser dispatch inputs refused')
          # GitHub can omit explicitly supplied empty optional strings from the event.
          inputs.setdefault('model_eval', '')
          inputs.setdefault('eval_allowed_providers', '')
          inputs.setdefault('measured_browser_preflight_run', '')
          if (event.get('ref') not in (branch, ref) or repo.get('full_name') != repository
                  or repo.get('id') != 1333414856 or repo.get('private') is not False
                  or repo.get('fork') is not False or repo.get('default_branch') != 'main'
                  or inputs != expected_inputs):
              raise SystemExit('Development browser dispatch inputs refused')
          PYTHON
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: ${{ inputs.measured_browser_course == 'serial-2-4-8' && '0' || '1' }}
      - name: Pin dependency-free controller runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Admit the fixed full-rendered development browser course
        if: ${{ inputs.measured_browser_course == 'preflight-2' }}
        env:
          STAGING_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          node --test .github/ci/measured-browser-worker-contract.test.mjs
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync, statSync} from 'node:fs';
          import {inspectMeasuredWorkerDispatch} from './.github/ci/measured-browser-worker-contract.mjs';
          const path = process.env.GITHUB_EVENT_PATH;
          const info = statSync(path);
          assert(info.isFile() && info.size > 0 && info.size <= 65536);
          const result = inspectMeasuredWorkerDispatch(process.env, JSON.parse(readFileSync(path, 'utf8')));
          assert.equal(result.profile.course, 'preflight-2');
          JS
      - name: Authenticate same-source full browser preflight for the worker comparison
        if: ${{ inputs.measured_browser_course == 'serial-2-4-8' }}
        id: worker-prerequisite
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: node .github/ci/measured-browser-worker-prerequisite.mjs
      - name: Focused controller regression checks
        if: ${{ (!inputs.architecture_browser_development_preflight && inputs.measured_browser_course == 'off') }}
        run: node --experimental-strip-types --test .github/ci/focused-checks.test.mjs .github/ci/postgres-evidence.test.mjs .github/ci/runner-capacity.test.mjs .github/ci/duration-order.test.mjs .github/ci/r395-write-split.test.mjs .github/ci/attendance-unclocked-split.test.mjs .github/ci/restricted-port-qualification.test.mjs .github/ci/build-heap.test.mjs .github/ci/next-application-cache.test.mjs .github/ci/next-build-cache-policy.test.mjs .github/ci/orchestrator-browser.test.mjs
      - name: Verify dormant worker custody models on the isolated branch
        if: ${{ github.ref == 'refs/heads/codex/architecture-five-item-worker-custody-models-20261109' }}
        env:
          EXACT_CANDIDATE: ${{ inputs.expected_sha }}
          EXACT_CANDIDATE_REF: ${{ inputs.candidate_ref }}
          PROVIDER_MODEL: ${{ inputs.model_eval }}
          MEASURED_COURSE: ${{ inputs.measured_browser_course }}
          STAGING_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$EXACT_CANDIDATE_REF" = codex/architecture-five-item-worker-custody-models-20261109
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$GITHUB_SHA" = "$EXACT_CANDIDATE"
          test "$(git rev-parse HEAD)" = "$EXACT_CANDIDATE"
          test -z "$PROVIDER_MODEL"
          test "$MEASURED_COURSE" = off
          test "$STAGING_ENABLED" = false
          test "$PRODUCTION_ENABLED" = false
          node --experimental-strip-types --test \
            .github/ci/measured-browser-worker-contract.test.mjs \
            .github/ci/measured-browser-preflight-archive.test.mjs \
            .github/ci/measured-browser-preflight-semantics.test.mjs \
            .github/ci/measured-browser-worker-prerequisite.test.mjs \
            scripts/performance/worker-comparison-build.test.mjs \
            scripts/performance/worker-comparison-custody.test.mjs
          /usr/bin/python3 -I -B .github/ci/worker-comparison-family.test.py
      - name: Validate bounded manifest
        if: ${{ (!inputs.architecture_browser_development_preflight && inputs.measured_browser_course == 'off') }}
        id: selection
        run: node .github/ci/focused-checks.mjs selection
        env:
          AIHR_FOCUSED_TESTS: ${{ inputs.selected_tests }}
      - name: Resolve frozen same-repository candidate
        id: candidate
        run: node .github/ci/resolve.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_BASE_SHA: ${{ vars.STAGING_DEPLOYED_SHA }}
  selected-tests:
    needs: resolve
    if: ${{ github.ref != 'refs/heads/codex/compiler-protected-db-client-ab-6c05-20261109' || needs.resolve.outputs.protected_db_client == 'true' }}
    runs-on: ubuntu-24.04
    # The fictional-data model ceiling probe needs the focused DB guard, which admits only this job, so the
    # protected environment and its secret attach here only when model_eval names a model.
    environment: ${{ github.ref != 'refs/heads/codex/compiler-protected-db-client-ab-6c05-20261109' && (!inputs.architecture_browser_development_preflight && inputs.measured_browser_course == 'off') && inputs.model_eval != '' && 'assistant-eval' || '' }}
    timeout-minutes: ${{ inputs.measured_browser_course == 'serial-2-4-8' && 120 || (inputs.architecture_browser_development_preflight || inputs.measured_browser_course == 'preflight-2') && 40 || inputs.model_eval != '' && 45 || 20 }}
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_MEASURED_BROWSER_COURSE: ${{ inputs.measured_browser_course }}
      AIHR_FOCUSED_TESTS: ${{ needs.resolve.outputs.tests }}
      AIHR_FOCUSED_SUITE_CAPACITY: 'true'
      AIHR_QUALIFY_RESTRICTED_PORT: ${{ inputs.qualify_restricted_port_prerequisites }}
      AIHR_RESTRICTED_PORT_TYPECHECK: ${{ inputs.run_typecheck }}
      AIHR_EVAL_OPENROUTER_KEY: ${{ github.ref != 'refs/heads/codex/compiler-protected-db-client-ab-6c05-20261109' && (!inputs.architecture_browser_development_preflight && inputs.measured_browser_course == 'off') && inputs.model_eval != '' && secrets.OPENROUTER_API_KEY || '' }}
      AIHR_EVAL_MODEL: ${{ inputs.model_eval }}
      AIHR_EVAL_BUDGET_USD: ${{ inputs.eval_budget_usd }}
      AIHR_EVAL_ALLOWED_PROVIDERS: ${{ inputs.eval_allowed_providers }}
    steps:
      - name: Anchor first executable focused job step (not runner allocation time)
        working-directory: ${{ runner.temp }}
        run: |
          python3 -I -B - <<'PYTHON'
          import json, os, time
          from pathlib import Path
          start = str(time.monotonic_ns())
          anchor = {'version': 1, 'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'job': os.environ['GITHUB_JOB'], 'bootId': Path('/proc/sys/kernel/random/boot_id').read_text().strip(), 'startNs': start, 'wallTimeNs': str(time.time_ns())}
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('AIHR_FOCUSED_JOB_MONOTONIC_NS=' + start + '\n')
              output.write('AIHR_FOCUSED_JOB_ANCHOR=' + json.dumps(anchor, separators=(',', ':')) + '\n')
          PYTHON
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: ${{ github.ref == 'refs/heads/codex/compiler-protected-db-client-ab-6c05-20261109' }}
        with:
          ref: 6c05efc24242b8a5f50933e7cbb6709a276b286d
          path: compiler-product
          persist-credentials: false
      - name: Verify the exact self-source before dependency installation
        if: ${{ (inputs.architecture_browser_development_preflight || inputs.measured_browser_course != 'off') }}
        id: development-browser-source
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_sha }}
          STAGING_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          test "$GITHUB_JOB" = selected-tests
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$AIHR_CI_HEAD" = "$EXPECTED_SOURCE"
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_SOURCE"
          test "$STAGING_ENABLED" = false
          test "$PRODUCTION_ENABLED" = false
          for checkout in "$GITHUB_WORKSPACE/automation" "$GITHUB_WORKSPACE/source"; do
            test "$(git -C "$checkout" rev-parse HEAD)" = "$EXPECTED_SOURCE"
            test -z "$(git -C "$checkout" status --porcelain)"
            test "$(git -C "$checkout" remote get-url origin)" = https://github.com/StradaverseHub/ai-hr
          done
          git merge-base --is-ancestor 9e9db2e5453663a627217513299b0e8307141a74 "$EXPECTED_SOURCE"
          git merge-base --is-ancestor b698f5d35b0cca12e2c1268f3bea08d0aa1d070e "$EXPECTED_SOURCE"
          for member in .github/workflows/alpha-focused-checks.yml .github/actions/setup-alpha/action.yml \
            .github/ci/postgres.sh package.json pnpm-lock.yaml scripts/performance/system-runner.mjs \
            scripts/performance/system-load.mjs scripts/performance/system-fixture.mjs; do
            digest="$(git show "$EXPECTED_SOURCE:$member" | sha256sum | cut -d' ' -f1)"
            printf '%s  %s\n%s  %s\n' "$digest" "$member" "$digest" "../automation/$member" | sha256sum --check --status
          done
          if test "$AIHR_MEASURED_BROWSER_COURSE" = serial-2-4-8; then
            for member in .github/ci/owned-process.py .github/ci/worker-comparison-family.py \
              scripts/performance/worker-comparison.mjs scripts/performance/worker-comparison-build.mjs \
              scripts/performance/worker-comparison-custody.mjs scripts/performance/system-load-owner.mjs; do
              digest="$(git show "$EXPECTED_SOURCE:$member" | sha256sum | cut -d' ' -f1)"
              printf '%s  %s\n%s  %s\n' "$digest" "$member" "$digest" "../automation/$member" | sha256sum --check --status
            done
          fi
          # The existing navigation owner admits this exact canonical spelling.
          git remote set-url origin https://github.com/StradaverseHub/ai-hr.git
      - name: Materialize the authenticated worker preflight receipt
        if: ${{ inputs.measured_browser_course == 'serial-2-4-8' }}
        env:
          PREFLIGHT_RUN: ${{ inputs.measured_browser_preflight_run }}
          PREFLIGHT_ADMISSION: ${{ needs.resolve.outputs.worker_admission }}
          PREFLIGHT_ADMISSION_SHA256: ${{ needs.resolve.outputs.worker_admission_sha256 }}
        run: |
          /usr/bin/python3 -I -B - <<'PYTHON'
          import base64, hashlib, json, os, re
          from pathlib import Path

          envelope = os.environ['PREFLIGHT_ADMISSION']
          assert 0 < len(envelope) <= 2048
          raw = base64.b64decode(envelope, validate=True)
          assert base64.b64encode(raw).decode('ascii') == envelope and raw.endswith(b'\n')
          digest = os.environ['PREFLIGHT_ADMISSION_SHA256']
          assert re.fullmatch(r'[a-f0-9]{64}', digest) and hashlib.sha256(raw).hexdigest() == digest
          receipt = json.loads(raw)
          assert receipt['kind'] == 'AUTHENTICATED_FULL_DEVELOPMENT_PREFLIGHT_SCOPE_ONLY'
          assert receipt['releaseEligible'] is False
          assert receipt['source'] == os.environ['AIHR_CI_HEAD'] == os.environ['GITHUB_WORKFLOW_SHA']
          assert str(receipt['runId']) == os.environ['PREFLIGHT_RUN']
          temp = Path(os.environ['RUNNER_TEMP'])
          assert temp.is_absolute() and temp.resolve(strict=True) == temp and temp.stat().st_uid == os.getuid()
          for name in ('system-worker-comparison-evidence', 'system-worker-comparison-private'):
              assert not os.path.lexists(temp / name)
          path = temp / 'aihr-worker-comparison-admission.json'

                          and clean_phase(row.get('phases'), 'http-and-browser', True))):
                  return None
              return receipt

          # Fixed fixture and diagnostics projections. Never pass through raw optional payloads.
          role_keys = 'employee manager companyHR groupHR'
          timing_keys = 'hire identityAndSessionProvisioning historyAndCompensationSeed payrollGenerate50 payrollClose50'
          module_codes = set(('employees org leave ess approvals knowledge_base payroll attendance claims performance '
                              'rewards lifecycle notifications assistant system_explorer system_testing').split())
          fixture_phase_names = set(('lifecycle-hub letter-draft-prerequisites claims-history attendance-history historical-payroll-generate '
                                     'historical-payroll-close rewards-draft-prerequisites rewards-draft-import '
                                     'payroll-readiness-after-organisation-publication attendance-workflow-tail '
                                     'reporting-line-tail post-seed-counts audit-counts native-traffic-actors assistant-saved-history').split())
          fixture_error_codes = set(('ERR_ASSERTION ERR_INVALID_ARG_TYPE ERR_INVALID_PACKAGE_CONFIG ERR_MODULE_NOT_FOUND '
                                     'MODULE_NOT_FOUND ERR_PACKAGE_PATH_NOT_EXPORTED ERR_REQUIRE_ESM ERR_UNKNOWN_FILE_EXTENSION '
                                     'ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX 22023 23502 23503 23505 23514 25006 25P02 40001 40P01 '
                                     '42501 42703 42883 42P01 55P03 57014 P0001').split())
          fixture_error_kinds = {'assertion-error', 'syntax-error', 'type-error', 'error', 'other'}
          lock_modes = set(('AccessShareLock RowShareLock RowExclusiveLock ShareUpdateExclusiveLock ShareLock '
                            'ShareRowExclusiveLock ExclusiveLock AccessExclusiveLock').split())

          def projected_counts(value, keys, maximum=100000000):
              row = record(value)
              return {key: number(row.get(key), maximum) for key in keys.split()}

          def duration(value, maximum):
              return value if type(value) in (int, float) and 0 <= value <= maximum else None

          def matches(value, pattern):
              return value if type(value) is str and re.fullmatch(pattern, value) else None

          def bounded_list(value, maximum, project):
              if type(value) is not list or len(value) > maximum:
                  return None
              rows = [project(row) for row in value]
              return rows if all(row is not None for row in rows) else None

          def project_fixture(row):
              summary = projected_counts(row, 'tenants companies users claimsPerEmployee attendanceDays')
              summary.update(
                  fictional=True, monthlyBasicSalary=number(row.get('monthlyBasicSalary'), 5000, 5000),
                  returningUsers=number(row.get('returningUsers'), 500, 500),
                  fixtureVolumeKind=choice(row.get('fixtureVolumeKind'), {'workflow-preflight-only'}),
                  historicalMonth=matches(row.get('historicalMonth'), r'[0-9]{4}-(0[1-9]|1[0-2])'),
                  publicationMonth=matches(row.get('publicationMonth'), r'[0-9]{4}-(0[1-9]|1[0-2])'),
                  attendanceBounds=projected_counts(row.get('attendanceBounds'), 'current_rows before_hire'),
                  roles=projected_counts(row.get('roles'), role_keys),
                  counts=projected_counts(row.get('counts'), 'claims attendance payslips'),
                  auditHashChainRequested=flag(row.get('auditHashChainRequested')),
                  auditHashChain=flag(row.get('auditHashChain')),
                  auditCounts=bounded_list(row.get('auditCounts'), 2,
                      lambda entry: projected_counts(entry, 'tenant events chained initialization_prefix') if type(entry) is dict else None),
                  assistantHistoryFixture={
                      **projected_counts(row.get('assistantHistoryFixture'), 'actors tenants threadsPerActor exchangesPerActor'),
                      'rowsVerified': flag(record(row.get('assistantHistoryFixture')).get('rowsVerified'))},
                  coreModules=bounded_list(row.get('coreModules'), len(module_codes), lambda code: choice(code, module_codes)),
                  explicitActiveModules=bounded_list(row.get('explicitActiveModules'), 2,
                      lambda entry: {'tenant': number(entry.get('tenant'), 1),
                                     'modules': bounded_list(entry.get('modules'), len(module_codes), lambda code: choice(code, module_codes))}
                      if type(entry) is dict else None),
              )
              timings = record(row.get('operationTimings'))
              summary['operationTimings'] = {
                  key: {'samples': number(record(timings[key]).get('samples'), 4096),
                        **{field: duration(record(timings[key]).get(field), 3600000)
                           for field in ('totalMs', 'p50Ms', 'p95Ms', 'maxMs')}}
                  for key in timing_keys.split() if key in timings}
              return summary

          def project_actors(row):
              projected = projected_counts(row, 'trafficActors tenants companies actorsPerTenant actorsPerCompany nativeSelectedRows nativeGrants')
              roles = projected_counts(row.get('roles'), role_keys)
              if (row.get('fictional') is not True or row.get('globalPopulationAsserted') is not False
                      or any(value is None for value in (*projected.values(), *roles.values()))):
                  return None
              return {**projected, 'fictional': True, 'globalPopulationAsserted': False, 'roles': roles}

          def project_fixture_phase(value):
              row = record(value)
              phase = choice(row.get('phase'), fixture_phase_names)
              state = choice(row.get('status'), {'running', 'passed', 'failed'})
              tenant = row.get('tenant')
              if not phase or not state or 'tenant' not in row or (tenant is not None and number(tenant, 1) is None):
                  return None
              result = {'tenant': tenant, 'phase': phase, 'status': state, 'elapsedMs': duration(row.get('elapsedMs'), 910000)}
              if state == 'failed':
                  failure = record(row.get('failure'))
                  result['failure'] = {'kind': choice(failure.get('kind'), fixture_error_kinds),
                                       'code': choice(failure.get('code'), fixture_error_codes)}
              return result

          def project_fixture_phases(rows):
              return bounded_list(rows, 64, project_fixture_phase)

          def project_server_failure(value):
              row = record(value)
              worker = number(row.get('worker'), 1)
              sqlstates = bounded_list(row.get('sqlStates'), 64, lambda code: matches(code, r'[0-9A-Z]{5}'))
              if worker is None or sqlstates is None:
                  return None
              result = {'worker': worker, 'sqlStates': sqlstates}
              if row.get('source') == 'public-error':
                  return {**result, 'source': 'public-error'}
              operation = choice(row.get('operation'), {'activate', 'delete'})
              return {**result, 'operation': operation, **{key: flag(row.get(key)) for key in
                  ('lockTimeoutMessage', 'statementTimeoutMessage', 'deadlockMessage', 'permissionDeniedMessage')}} if operation else None

          def project_server_failures(row):
              failures = bounded_list(row.get('failures'), 100, project_server_failure)
              return {'scope': 'Closed worker diagnostics without raw logs or references', 'failures': failures} if failures is not None else None

          lock_families = {'access-configuration', 'ai-control', 'audit-chain', 'employment', 'payroll-history',
                           'pay-component-catalog', 'advisory-unclassified', 'transaction', 'tuple', 'relation'}
          lock_routines = {'workforce-policy-write', 'profile-policy-read', 'profile-policy-write', 'ai-centre-running',
                           'ai-centre-control', 'ai-centre-mandate-order', 'personnel-draft-delete',
                           'assistant-generic-review', 'assistant-generic-review-index', 'assistant-legacy-review-index',
                           'assistant-own-leave-expiry'}
          lock_calls = lock_routines | {'direct-advisory-exclusive', 'direct-advisory-shared'}

          def project_lock_edge(value):
              row = record(value)
              waiter, blocker = (number(row.get(key), 16, 1) for key in ('waiter', 'blocker'))
              resource = number(row.get('resource'), 8, 1)
              mode, family = choice(row.get('mode'), lock_modes), choice(row.get('family'), lock_families)
              if None in (waiter, blocker, resource, mode, family):
                  return None
              return {'waiter': waiter, 'blocker': blocker, 'resource': resource, 'mode': mode, 'family': family,
                      **{key: choice(row.get(key), lock_calls) for key in ('waiterCall', 'blockerCall')}}

          def project_lock_diagnostic(value):
              row = record(value)
              phase = choice(row.get('phase'), {'qualified-runtime', 'before-runtime-start', 'after-runtime-start', 'unknown'})
              edges = bounded_list(row.get('edges'), 8, project_lock_edge)
              routines = bounded_list(row.get('victimRoutines'), 6, lambda name: choice(name, lock_routines))
              complete = flag(row.get('allParsedEdgesRetained'))
              if None in (phase, edges, routines, complete):
                  return None
              return {'phase': phase, 'waitFamily': choice(row.get('waitFamily'), lock_families),
                      'edges': edges, 'allParsedEdgesRetained': complete, 'victimRoutines': routines}

          def project_postgres_failure(value):
              row = record(value)
              kind = choice(row.get('kind'), {'observed heavyweight lock wait', 'deadlock detected', 'canceling statement due to lock timeout'})
              waits, routines = row.get('waits'), row.get('routines')
              if not kind or type(waits) is not list or len(waits) > 64 or type(routines) is not list or len(routines) > 32:
                  return None
              result = {'kind': kind, 'waitDetails': len(waits), 'routineFrames': len(routines),
                        'diagnostic': project_lock_diagnostic(row.get('diagnostic'))}
              if kind == 'observed heavyweight lock wait':
                  outcome = choice(row.get('outcome'), {'still waiting for', 'acquired', 'avoided deadlock for',
                      'detected deadlock while waiting for', 'failed to acquire'})
                  mode = choice(row.get('mode'), lock_modes)
                  elapsed = duration(row.get('waitMs'), 1000000000000)
                  if outcome is None or mode is None or elapsed is None:
                      return None
                  result.update(outcome=outcome, mode=mode, waitMs=elapsed)
              return result

          def project_postgres_failures(row):
              failures = bounded_list(row.get('failures'), 64, project_postgres_failure)
              runtime = matches(row.get('runtimeFrom'), r'[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z')
              window = choice(row.get('logWindow'), {'qualified-runtime', 'unqualified'})
              return {'scope': 'Owned PostgreSQL log observations without native identifiers',
                      'runtimeFrom': runtime, 'logWindow': window, 'failures': failures} if failures is not None else None


          def publish(directory, name, raw):
              fd = os.open(name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600, dir_fd=directory)
              with os.fdopen(fd, 'wb') as output:
                  output.write(raw)
                  output.flush()
                  if identity(os.fstat(fd)) != identity(os.stat(name, dir_fd=directory, follow_symlinks=False)):
                      raise OSError('Published development evidence changed')
              members.append(name)

          def publish_json(directory, name, value, maximum=8192):
              raw = (json.dumps(value, separators=(',', ':'), allow_nan=False) + '\n').encode()
              if len(raw) > maximum:
                  raise OSError('Development receipt exceeds its closed projection bound')
              publish(directory, name, raw)

          members = []

          # The source check and fresh-directory preflight restrict this to the first
          # attempt's owned job. No Docker or process mutation is permitted here.
          with ExitStack() as held:
              temp_fd = os.open(temp, directory_flags)

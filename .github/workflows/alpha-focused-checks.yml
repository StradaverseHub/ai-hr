              runner_state, runner, _ = json_member(directory, 'runner.json', lambda row:
                  row.get('kind') == 'ISOLATED_HTTP_BROWSER_DEVELOPMENT_ONLY'
                  and row.get('sha') == row.get('controller') == sha and row.get('run') == run
                  and row.get('releaseEligible') is False and row.get('productionEquivalent') is False
                  and number(row.get('exitCode'), 255) is not None)
              driver_state, driver, _ = json_member(directory, 'http-browser.json', lambda row:
                  row.get('kind') == 'HTTP_WORKFLOW_PREFLIGHT_ONLY' and row.get('suite') == 'workflow-preflight'
                  and number(row.get('users'), 0) == 0 and row.get('releaseEligible') is False)
              capture_state, capture, capture_bytes = json_member(directory, 'navigation-browser-capture.json', capture_source)
              union_member = 'development-rendered-route-union.json'

                      child['identity'][key] == baseline[key] for key in ('harnessSha256', 'scenarioSha256')):
                  if len(capture_bytes) == pinned_capture['bytes'] and hashlib.sha256(capture_bytes).hexdigest() == pinned_capture['sha256']:
                      capture_binding = {**pinned_capture, **{key: baseline[key] for key in ('harnessSha256', 'scenarioSha256')}}
              union_binding = None

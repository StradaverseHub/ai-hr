name: worker-prepared-development
run-name: Prepared worker development controls only · ${{ github.sha }}
on:
  push:
    branches: ['codex/board-worker-prepared-*']
permissions:
  contents: read
jobs:
  prepared-development-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alpha
        with:
          node: '22.23.3'
          path: .
          mobile: 'false'
      - name: Focused development controls, not worker release authority
        run: |
          node -e "require('node:assert/strict').equal(process.versions.node, '22.23.3')"
          # Recovery of 44265704531: retain its 10 hash + 6 native-error + 5
          # activation-failure + 35 runtime passes. Only this existing runtime
          # case needed the missing frozen tsx dependencies; remaining owners
          # below were not reached after bash stopped on that setup failure.
          python3 -I -B test/fixtures/bank-import-worker-ci-runtime-tests.py ConditionalRuntimeTests.test_actual_tsx_ignores_malicious_disk_transforms_and_preserves_frozen_resolution
          python3 -I -B test/fixtures/bank-import-worker-upgrade-tests.py
          python3 -I -B test/fixtures/bank-import-worker-operation-guard-tests.py
          python3 -I -B test/fixtures/bank-import-worker-prepared-tests.py

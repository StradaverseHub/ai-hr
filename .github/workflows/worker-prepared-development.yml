name: worker-prepared-development
run-name: Prepared worker development controls only · ${{ github.sha }}
on:
  push:
    branches: ['codex/board-worker-prepared-*']
permissions:
  contents: read
jobs:
  prepared-development-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - name: Focused development controls, not worker release authority
        run: |
          node -e "require('node:assert/strict').equal(process.versions.node, '22.23.3')"
          python3 -I -B test/fixtures/bank-import-worker-runtime-hash-tests.py
          python3 -I -B test/fixtures/bank-import-worker-native-errors-tests.py
          python3 -I -B test/fixtures/bank-import-worker-ci-runtime-tests.py ConditionalRuntimeTests.test_native_output_and_silent_runtime_have_hard_streaming_and_time_bounds
          python3 -I -B test/fixtures/bank-import-worker-prepared-tests.py

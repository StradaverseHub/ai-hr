name: ai-review-archived-worker-consumer
run-name: Actual accepted worker archive against new AI schema563
on:
  workflow_dispatch:
    inputs:
      web_source: {description: Exact frozen AI web source, required: true, type: string}
      worker_source: {description: Exact accepted installed worker source, required: true, type: string}
      producer_controller: {description: Exact accepted producer controller, required: true, type: string}
      producer_run: {description: Successful original producer run ID, required: true, type: string}
      artifact_id: {description: Accepted closed-four artifact API ID, required: true, type: string}
      artifact_sha256: {description: Accepted artifact API SHA256, required: true, type: string}
permissions:
  contents: read
  actions: read
concurrency:
  group: ai-review-worker-consumer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  worker-consumer:
    if: ${{ github.repository == 'StradaverseHub/ai-hr' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: Asia/Kuala_Lumpur
      WEB_SOURCE: ${{ inputs.web_source }}
      WORKER_SOURCE: ${{ inputs.worker_source }}
      PRODUCER_CONTROLLER: ${{ inputs.producer_controller }}
      PRODUCER_RUN: ${{ inputs.producer_run }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
      PACKAGE_DIR: ${{ runner.temp }}/accepted-worker/package
      DATABASE_URL: postgres://ai_hr_app@127.0.0.1:5433/ai_hr_test
      MIGRATION_DATABASE_URL: postgres://ai_hr_owner@127.0.0.1:5433/ai_hr_test
      TEST_DATABASE_URL: postgres://ai_hr_app@127.0.0.1:5433/ai_hr_test
      TEST_MIGRATION_DATABASE_URL: postgres://ai_hr_owner@127.0.0.1:5433/ai_hr_test
      AIHR_CI_UNIT: db-1
      AIHR_CI_PG_MEMORY_GIB: '2'
      AIHR_CI_PG_JIT: 'on'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.sha }}', path: controller, persist-credentials: false}
      - name: Authenticate original accepted producer packet
        run: python3 -I -B controller/scripts/ci-ai-worker-consumer-download.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ inputs.producer_controller }}', path: producer, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ inputs.worker_source }}', path: worker-source, fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ inputs.web_source }}', path: source, fetch-depth: 0, persist-credentials: false}
      - uses: ./controller/.github/actions/setup-alpha
        with: {node: '22.23.3', path: source, mobile: 'false'}
      - name: Prepare disposable PostgreSQL with separate physical owner
        shell: bash
        run: |
          set -euo pipefail
          bash controller/.github/ci/postgres.sh reset
          docker exec "aihr-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${AIHR_CI_UNIT}" psql -U postgres -p 5433 -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE ai_hr_owner LOGIN SUPERUSER;' -c 'ALTER DATABASE ai_hr_test OWNER TO ai_hr_owner;'
      - name: Prove ordinary562 ledger then apply exact0687 and verify563
        run: node controller/scripts/ci-ai-worker-consumer-migrate.mjs "$GITHUB_WORKSPACE/worker-source" "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/accepted-worker/consumer-migration-proof.json"
      - name: Seed catalogs from frozen new web source
        working-directory: source
        run: node --import tsx scripts/seed-catalogs.ts
      - name: Execute actual accepted archive under separate nonroot identity
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,CI,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,WORKER_SOURCE,WEB_SOURCE,PRODUCER_CONTROLLER python3 -I -B controller/scripts/ci-ai-worker-consumer-runtime.py --controller "$GITHUB_WORKSPACE/controller" --producer "$GITHUB_WORKSPACE/producer" --source "$GITHUB_WORKSPACE/source" --package-dir "$PACKAGE_DIR" --node "$(command -v node)"
      - name: Upload separate consumer proof without relabelling producer proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-review-worker-consumer-proof
          path: |
            ${{ runner.temp }}/accepted-worker/producer-input.json
            ${{ runner.temp }}/accepted-worker/consumer-migration-proof.json
            ${{ runner.temp }}/accepted-worker/consumer-runtime-proof.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop owned disposable PostgreSQL
        if: ${{ always() }}
        run: bash controller/.github/ci/postgres.sh stop

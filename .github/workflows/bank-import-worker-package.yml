name: bank-import-worker-package
run-name: Worker bytes only · ${{ github.sha }}
on:
  push:
    branches: ['codex/combined-expanded-*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bank-import-worker-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  worker-package:
    if: ${{ github.repository == 'StradaverseHub/ai-hr' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Kuala_Lumpur
      DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-alpha
        with:
          node: '22.23.3'
          path: .
          mobile: 'false'
      - name: Verify handoff controls on the pinned worker runtime
        timeout-minutes: 8
        run: |
          set -o pipefail
          {
            node -e "require('node:assert/strict').equal(process.versions.node, '22.23.3')"
            python3 -I -B -c "import sys; assert sys.version_info >= (3,11) and sys.flags.safe_path and sys.flags.no_user_site; print('Worker controls Python:', sys.version.split()[0])"
            worker_check_uid="$(id -u)"
            worker_check_gid="$(id -g)"
            test "$worker_check_uid" -gt 0
            worker_checks_rc=0
            python3 -I -B test/fixtures/bank-import-worker-upgrade-tests.py || worker_checks_rc=1
            sudo -n python3 -I -B test/fixtures/bank-import-worker-systemd-drain-tests.py --node "$(command -v node)" --source "$GITHUB_SHA" --output "$RUNNER_TEMP/worker-native-systemd-drain.json" || worker_checks_rc=1
            python3 -I -B test/fixtures/bank-import-worker-ci-runtime-tests.py || worker_checks_rc=1
            python3 -I -B test/fixtures/bank-import-worker-prepared-tests.py || worker_checks_rc=1
            python3 -I -B test/fixtures/bank-import-worker-operation-guard-tests.py || worker_checks_rc=1
            sudo -n python3 -I -B test/fixtures/bank-import-worker-operation-guard-tests.py --privilege-boundary "$worker_check_uid" "$worker_check_gid" || worker_checks_rc=1
            python3 -I -B test/fixtures/bank-import-worker-fences-tests.py || worker_checks_rc=1
            sudo -n python3 -I -B test/fixtures/bank-import-worker-fences-tests.py --uid-race "$worker_check_uid" || worker_checks_rc=1
            exit "$worker_checks_rc"
          } 2>&1 | tee "$RUNNER_TEMP/worker-runtime-controls.log"
      - name: Preserve pinned runtime control results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-runtime-controls-v1
          path: |
            ${{ runner.temp }}/worker-runtime-controls.log
            ${{ runner.temp }}/worker-native-systemd-drain.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify bounded worker package controls
        run: node --test scripts/bank-import-worker-package.test.mjs
      - name: Produce immutable worker bytes from this exact source
        run: node scripts/bank-import-worker-package.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/worker-package" "$GITHUB_SHA"
      - name: Qualify actual full-package preparation and complete prepared handoff graphs
        timeout-minutes: 10
        run: |
          set -o pipefail
          {
            prepared_checks_rc=0
            python3 -I -B test/fixtures/bank-import-worker-prepared-tests.py --package "$RUNNER_TEMP/worker-package/worker-package.zip" || prepared_checks_rc=1
            sudo -n python3 -I -B test/fixtures/bank-import-worker-prepared-tests.py --root-tree --package "$RUNNER_TEMP/worker-package/worker-package.zip" || prepared_checks_rc=1
            exit "$prepared_checks_rc"
          } 2>&1 | tee "$RUNNER_TEMP/worker-prepared-capacity.log"
      - name: Preserve actual prepared worker capacity qualification
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-prepared-capacity-v1
          path: ${{ runner.temp }}/worker-prepared-capacity.log
          if-no-files-found: warn
          retention-days: 14
      - name: Verify actual extracted worker startup without database credentials
        run: node scripts/bank-import-worker-startup-check.mjs "$RUNNER_TEMP/worker-package/worker-package.zip" "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-package-v1
          path: |
            ${{ runner.temp }}/worker-package/worker-package.zip
            ${{ runner.temp }}/worker-package/worker-manifest.json
            ${{ runner.temp }}/worker-package/worker-provenance.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

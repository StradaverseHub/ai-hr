name: bank-import-worker-package
run-name: Worker bytes only · ${{ github.sha }}
on:
  push:
    branches: ['codex/combined-expanded-*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bank-import-worker-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  worker-package:
    if: ${{ github.repository == 'StradaverseHub/ai-hr' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Kuala_Lumpur
      DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
      TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-alpha
        with:
          node: '22.23.3'
          path: .
          mobile: 'false'
      - name: Verify bounded worker package controls
        run: node --test scripts/bank-import-worker-package.test.mjs
      - name: Produce immutable worker bytes from this exact source
        run: node scripts/bank-import-worker-package.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/worker-package" "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-package-v1
          path: |
            ${{ runner.temp }}/worker-package/worker-package.zip
            ${{ runner.temp }}/worker-package/worker-manifest.json
            ${{ runner.temp }}/worker-package/worker-provenance.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

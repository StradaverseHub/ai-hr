name: mobile-android-client-probe
run-name: Bounded Android sign-in diagnostic · 0ec19e970
on:
  push:
    branches: [codex/mobile-signin-client-probe-20261102]
    paths:
      - .github/workflows/mobile-android-client-probe.yml
      - .github/ci/native-android-client-probe.sh
      - .github/ci/repackage-client-probe.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mobile-android-client-probe
  cancel-in-progress: false
jobs:
  review-apk:
    if: github.repository == 'StradaverseHub/ai-hr'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_SOURCE: 0ec19e9706cb16a7d6139d71be45e2fa570512b9
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_RUNTIME_CONNECTIONS: '1'
      EXPO_PUBLIC_AUTH_PROVIDER: internal
      EXPO_PUBLIC_SIGNIN_CLIENT_PROBE: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 0ec19e9706cb16a7d6139d71be45e2fa570512b9
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: source/mobile/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 41423483160
          github-token: ${{ github.token }}
          name: onehr-android-client-probe-b918bac3a
          path: base-artifact
      - name: Rebuild review JavaScript only; preserve verified native APK contents
        run: bash controller/.github/ci/native-android-client-probe.sh
      - name: Retain review APK and provenance briefly
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onehr-android-client-probe-0ec19e970
          path: ${{ runner.temp }}/onehr-android-client-probe/
          if-no-files-found: warn
          retention-days: 1

name: mobile-field-notes-android
run-name: Field Notes Android review · ${{ github.sha }}
on:
  push:
    branches: [codex/mobile-field-notes-20261107]
    paths:
      - mobile/package.json
      - mobile/package-lock.json
      - mobile/app.json
      - mobile/app.config.js
      - mobile/build-config/**
      - mobile/modules/**
      - mobile/assets/**
  workflow_dispatch:
    inputs:
      staging_fcm:
        description: Include OneHR staging Android Firebase registration
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: field-notes-android-${{ github.sha }}
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'StradaverseHub/ai-hr' && (!inputs.staging_fcm || github.ref_name == 'codex/onehr-android-firebase-staging-20261109')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_RUNTIME_CONNECTIONS: '1'
      EXPO_PUBLIC_AUTH_PROVIDER: internal
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Validate staging Android Firebase registration
        if: inputs.staging_fcm
        shell: bash
        env:
          STAGING_FIREBASE_REGISTRATION: ${{ secrets.ONEHR_ANDROID_STAGING_REGISTRATION_20261109 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$STAGING_FIREBASE_REGISTRATION"
          registration="$RUNNER_TEMP/onehr-staging-google-services.json"
          printf '%s' "$STAGING_FIREBASE_REGISTRATION" > "$registration"
          GOOGLE_SERVICES_JSON="$registration" node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { configureFirebase } = require('./mobile/build-config/firebase.cjs');
          const config = require('./mobile/app.json').expo;
          const file = process.env.GOOGLE_SERVICES_JSON;
          const registration = JSON.parse(fs.readFileSync(file, 'utf8'));
          assert.equal(registration.project_info?.project_id, 'onehr-staging');
          assert.equal(config.android.package, 'ai.stradaverse.aihr.test');
          assert.equal(configureFirebase(config).android.googleServicesFile, file);
          JS
          printf 'GOOGLE_SERVICES_JSON=%s\n' "$registration" >> "$GITHUB_ENV"
      - name: Compile review APK without distribution credentials
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          npm ci --prefix mobile --no-audit --no-fund
          npm --prefix mobile run eas-build-post-install
          (
            cd mobile
            npm exec --offline -- expo prebuild --platform android --no-install
            cd android
            wrapper=gradle/wrapper/gradle-wrapper.properties
            grep -Fxq 'distributionUrl=https\://services.gradle.org/distributions/gradle-9.4.1-bin.zip' "$wrapper"
            distribution="$RUNNER_TEMP/gradle-9.4.1-bin.zip"
            curl --fail --location --silent --show-error --max-time 180 --retry 3 \
              'https://downloads.gradle.org/distributions/gradle-9.4.1-bin.zip' --output "$distribution"
            checksum=2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb
            printf '%s  %s\n' "$checksum" "$distribution" | sha256sum --check
            sed -i -e '/^distributionUrl=/d' -e '/^distributionSha256Sum=/d' "$wrapper"
            printf '\ndistributionUrl=file\:%s\ndistributionSha256Sum=%s\n' "$distribution" "$checksum" >> "$wrapper"
            ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m' -x lint -x test > "$RUNNER_TEMP/onehr-android-build.log" 2>&1 || {
              tail -140 "$RUNNER_TEMP/onehr-android-build.log"
              exit 1
            }
          )
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            values=mobile/android/app/build/generated/res/google-services/release/values/values.xml
            grep -Eq '<string name="project_id"[^>]*>onehr-staging</string>' "$values"
            grep -q '<string name="google_app_id"' "$values"
          fi
          mkdir -p "$RUNNER_TEMP/onehr-field-notes-android"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/onehr-field-notes-android/OneHR-Field-Notes-review.apk"
          git rev-parse HEAD > "$RUNNER_TEMP/onehr-field-notes-android/source.txt"
          sha256sum "$RUNNER_TEMP/onehr-field-notes-android/OneHR-Field-Notes-review.apk" > "$RUNNER_TEMP/onehr-field-notes-android/SHA256SUMS.txt"
      - name: Retain review APK briefly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onehr-field-notes-android-${{ github.sha }}
          path: ${{ runner.temp }}/onehr-field-notes-android/
          retention-days: 1
          if-no-files-found: error

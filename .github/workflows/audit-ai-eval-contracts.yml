name: Audit AI evaluation contract tests
run-name: Eval contract tests only · ${{ github.sha }}
on:
  push:
    branches: [codex/audit-eval-hardening-20261103]
    paths: ['.github/ci/focused-checks*', '.github/ci/eval/**', '.github/workflows/audit-ai-eval-contracts.yml', 'test/eval-plans/**']
permissions: {contents: read}
concurrency:
  group: audit-ai-eval-contracts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Actual focused-result admission regressions
        run: node --experimental-strip-types --test .github/ci/focused-checks.test.mjs .github/ci/eval/contract.test.mjs .github/ci/eval/attempt-budget.test.mjs .github/ci/eval/provider-metadata.test.mjs
      - name: Exact frozen source plans (no app or provider execution)
        run: node .github/ci/eval/check-plans.mjs

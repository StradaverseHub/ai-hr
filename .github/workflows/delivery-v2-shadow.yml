name: Delivery v2 shadow prototype
run-name: Delivery v2 advisory controls
on:
  push:
    branches: ['codex/delivery-system-revamp-*']
    paths:
      - 'scripts/delivery/**'
      - '.github/workflows/delivery-v2-shadow.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed prototype commit (no release authority)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: delivery-v2-shadow-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  advisory-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - name: Bind the prototype to its requested commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Exercise refusal and obligation properties
        run: node --test scripts/delivery/assurance-plan.test.mjs
      - name: Produce a synthetic advisory example
        run: node scripts/delivery/assurance-plan.mjs < scripts/delivery/example-contract.json > "$RUNNER_TEMP/delivery-v2-advisory.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delivery-v2-synthetic-advisory
          path: ${{ runner.temp }}/delivery-v2-advisory.json
          retention-days: 7

name: mobile-bundle-security
run-name: Mobile bundle reachability · c194c593c
on:
  push:
    branches: [codex/mobile-bundle-security-20261103]
    paths: [.github/workflows/mobile-bundle-security.yml, .github/ci/mobile-bundle-security.py]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: c194c593c1aa51fc34d247403e56b73a2b14f34f
          path: source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Install frozen mobile dependencies
        run: |
          test "$(git -C source rev-parse HEAD)" = c194c593c1aa51fc34d247403e56b73a2b14f34f
          npm ci --prefix source/mobile --no-audit --no-fund
          npm --prefix source/mobile run eas-build-post-install
      - name: Export production bundles and source maps on the hosted runner
        working-directory: source/mobile
        run: |
          npm exec --offline -- expo export --help
          npm exec --offline -- expo export --platform ios --platform android --source-maps --max-workers 2 --output-dir "$RUNNER_TEMP/mobile-bundle-security"
      - name: Inspect module reachability without retaining source maps
        run: |
          git -C source diff --exit-code
          python3 controller/.github/ci/mobile-bundle-security.py "$RUNNER_TEMP/mobile-bundle-security" source/mobile/package-lock.json "$RUNNER_TEMP/mobile-security-report.json"
      - name: Retain normalized diagnostic report only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onehr-bundle-security-c194c593c
          path: ${{ runner.temp }}/mobile-security-report.json
          if-no-files-found: error
          retention-days: 1

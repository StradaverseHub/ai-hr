name: Re-plan synthetic Linux rehearsal
on:
  push:
    branches: [codex/replan-synthetic-linux-rehearsal]
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - name: Verify isolated runtime and recovery components
        run: bash .github/ci/synthetic-recovery/run.sh

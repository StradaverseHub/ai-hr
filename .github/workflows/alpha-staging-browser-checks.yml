name: browser-provisioning-diagnostics
run-name: Tooling transport only · ${{ inputs.candidate_ref }}
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Existing frozen source branch; this workflow cannot authorize release
        required: true
        type: string
      expected_sha:
        description: Exact source commit
        required: true
        type: string
      probe_scope:
        description: Execute only the new tooling boundary being investigated
        required: false
        default: browser-install
        type: choice
        options: [browser-install, operator-transport, browser-image, browser-image-firefox, browser-image-suite]
permissions: {contents: read, actions: read}
concurrency:
  group: browser-provisioning-diagnostic-${{ inputs.candidate_ref }}-${{ inputs.probe_scope || 'browser-install' }}
  cancel-in-progress: false
env:
  TZ: Asia/Kuala_Lumpur
  AIHR_CI_CONTROL_HEAD: ${{ github.workflow_sha }}
  DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      base: ${{ steps.candidate.outputs.base }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', persist-credentials: false}
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_BASE_SHA: ${{ vars.STAGING_DEPLOYED_SHA }}
        run: node .github/ci/resolve.mjs
  tooling:
    if: ${{ inputs.probe_scope == 'browser-install' }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      ENGINE: ${{ matrix.engine }}
      VARIANT: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
        variant: [runner, primary-https]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.resolve.outputs.sha }}', path: source, persist-credentials: false}
      - uses: ./automation/.github/actions/setup-alpha
        with: {capacity_profile: legacy}
      - name: Retain original source bindings and transport-only configuration
        run: |
          mkdir -p "$RUNNER_TEMP/browser-tooling"
          git rev-parse HEAD > "$RUNNER_TEMP/browser-tooling/source-sha.txt"
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/browser-tooling/lockfile-sha256.txt"
          node ../automation/.github/ci/ubuntu-browser-mirror.mjs "$VARIANT" "$RUNNER_TEMP/browser-tooling/archive-transport.json"
      - name: Original complete Playwright installation with measured wall time
        shell: bash
        run: |
          set +e
          started=$(date +%s%3N)
          pnpm exec playwright install --with-deps "$ENGINE" 2>&1 | tee "$RUNNER_TEMP/browser-tooling/install.log"
          status=${PIPESTATUS[0]}
          finished=$(date +%s%3N)
          printf '{"kind":"TOOLING_INSTALL_NOT_TEST_OR_RELEASE_PASS","engine":"%s","variant":"%s","startedMs":%s,"finishedMs":%s,"elapsedMs":%s,"exitCode":%s,"releaseAuthorized":false}\n' "$ENGINE" "$VARIANT" "$started" "$finished" "$((finished-started))" "$status" > "$RUNNER_TEMP/browser-tooling/install.json"
          exit "$status"
      - name: Native browser launch and multilingual raster probe
        run: node ../automation/.github/ci/browser-tooling-probe.mjs "$ENGINE" "$RUNNER_TEMP/browser-tooling"
      - name: Installed package inventory
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/browser-tooling"
          dpkg-query -W -f='${Package}\t${Version}\t${Architecture}\n' > "$RUNNER_TEMP/browser-tooling/installed-packages.tsv"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tooling-${{ matrix.engine }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/browser-tooling/
          if-no-files-found: error
          retention-days: 7
  operator-transport:
    if: ${{ inputs.probe_scope == 'operator-transport' }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.resolve.outputs.sha }}', path: source, persist-credentials: false}
      - uses: ./automation/.github/actions/setup-alpha
        with: {capacity_profile: legacy, mobile: 'false'}
      - name: Actual private packet mode and canonical transport boundaries only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/operator-tooling"
          git rev-parse HEAD > "$RUNNER_TEMP/operator-tooling/source-sha.txt"
          git -C ../automation rev-parse HEAD > "$RUNNER_TEMP/operator-tooling/controller-sha.txt"
          node --import tsx --test --test-reporter=spec ../automation/.github/ci/rsync-packet-capability.test.mjs ../automation/.github/ci/operator-flow.test.mjs ../automation/.github/ci/staging-launcher.test.mjs ../automation/.github/ci/staging-source-transfer.test.mjs ../automation/.github/ci/staging-transport.test.mjs 2>&1 | tee "$RUNNER_TEMP/operator-tooling/private-transport.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostic-operator-packet-preflight
          path: ${{ runner.temp }}/operator-tooling/
          if-no-files-found: error
          retention-days: 7
  browser-image:
    if: ${{ inputs.probe_scope == 'browser-image' || inputs.probe_scope == 'browser-image-firefox' || inputs.probe_scope == 'browser-image-suite' }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_CI_MIGRATION_BASE: ${{ needs.resolve.outputs.base }}
      ENGINE: ${{ matrix.engine }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(inputs.probe_scope == 'browser-image-firefox' && '["firefox"]' || '["chromium","firefox","webkit"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.resolve.outputs.sha }}', path: source, fetch-depth: 0, persist-credentials: false}
      - uses: ./automation/.github/actions/setup-browser-image
      - name: Bind source and exact preinstalled Playwright runtime
        run: |
          mkdir -p "$RUNNER_TEMP/browser-image"
          git rev-parse HEAD > "$RUNNER_TEMP/browser-image/source-sha.txt"
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/browser-image/lockfile-sha256.txt"
          node -e 'const assert=require("node:assert/strict"),fs=require("node:fs");const version=require("playwright/package.json").version;assert.equal(version,"1.62.1");fs.writeFileSync(process.env.RUNNER_TEMP+"/browser-image/image-binding.json",JSON.stringify({kind:"PINNED_OFFICIAL_IMAGE_TOOLING_NOT_TEST_OR_RELEASE_PASS",image:"mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e",playwrightVersion:version,nodeVersion:process.versions.node,candidate:process.env.AIHR_CI_HEAD,controller:process.env.AIHR_CI_CONTROL_HEAD,releaseAuthorized:false},null,2))'
      - name: Native browser launch and multilingual raster with preinstalled dependencies
        if: ${{ inputs.probe_scope != 'browser-image-suite' }}
        run: node ../automation/.github/ci/browser-tooling-probe.mjs "$ENGINE" "$RUNNER_TEMP/browser-image"
        env: {HOME: /root}
      - name: Complete original browser unit in pinned image
        if: ${{ inputs.probe_scope == 'browser-image-suite' }}
        run: node ../automation/.github/ci/run-unit.mjs "browser-$ENGINE" "$RUNNER_TEMP/aihr-ci"
        env: {HOME: /root}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && inputs.probe_scope == 'browser-image-suite' }}
        with:
          name: diagnostic-complete-image-browser-${{ matrix.engine }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/aihr-ci/
            source/.vitest-attachments/**/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain container package and filesystem facts
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/browser-image"
          dpkg-query -W -f='${Package}\t${Version}\t${Architecture}\n' > "$RUNNER_TEMP/browser-image/installed-packages.tsv"
          df -Pk . "$RUNNER_TEMP" > "$RUNNER_TEMP/browser-image/filesystem-capacity.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostic-browser-image-${{ matrix.engine }}
          path: ${{ runner.temp }}/browser-image/
          if-no-files-found: error
          retention-days: 7

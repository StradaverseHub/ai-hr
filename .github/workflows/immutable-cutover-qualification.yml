name: Immutable cutover qualification
on:
  push:
    branches: [codex/immutable-release-cutover-20261120, codex/staging-cutover-queue-20261121]
    paths: ['deploy/cutover/**', 'scripts/staging/**', '.github/ci/staging-cutover-build.mjs', '.github/workflows/immutable-cutover-qualification.yml']
  pull_request:
    paths: ['deploy/cutover/**', 'scripts/staging/**', '.github/ci/staging-cutover-build.mjs', '.github/workflows/immutable-cutover-qualification.yml']
permissions:
  contents: read
jobs:
  cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Qualify live HTTP activation and recovery on disposable services
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s deploy/cutover -v
          python3 -m unittest discover -s scripts/staging -v
          bash -n deploy/cutover/commission-ingress.sh
          bash -n deploy/cutover/prepare-runtime.sh
          bash -n deploy/cutover/prepare-canonical.sh
          bash -n deploy/cutover/canonical-deploy.sh
          bash -n deploy/cutover/release.sh
          node --check .github/ci/staging-cutover-build.mjs

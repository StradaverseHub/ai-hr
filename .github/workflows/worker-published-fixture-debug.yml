name: worker-published-fixture-debug
run-name: Published fixture diagnostics only · ${{ github.sha }}
on:
  push:
    branches: ['codex/worker-published-fixture-debug-*']
permissions:
  contents: read
jobs:
  fixture-diagnostics-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - name: Fixture diagnostics, not native qualification or release authority
        run: |
          node -e "require('node:assert/strict').equal(process.versions.node,'22.23.3')"
          failed=0
          python3 -I -B test/fixtures/bank-import-worker-published-unstarted-tests.py || failed=1
          python3 -I -B test/fixtures/bank-import-worker-recovery-profile-tests.py || failed=1
          exit "$failed"

name: Audit AI evaluation controls
run-name: Non-billable eval preflight · ${{ github.sha }}
on:
  push:
    branches: [codex/audit-eval-hardening-20261103]
    paths: ['.github/ci/eval/provider-metadata.mjs', '.github/workflows/audit-ai-eval-controls.yml']
permissions: {contents: read}
concurrency:
  group: audit-ai-eval-preflight
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    environment: assistant-eval
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Inspect budget and exact-model metadata without inference
        env: {AIHR_EVAL_OPENROUTER_KEY: '${{ secrets.OPENROUTER_API_KEY }}'}
        run: node .github/ci/eval/provider-metadata.mjs "$RUNNER_TEMP/provider-metadata.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: non-billable-provider-metadata
          path: ${{ runner.temp }}/provider-metadata.json
          if-no-files-found: error
          retention-days: 3

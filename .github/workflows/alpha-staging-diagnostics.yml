name: alpha-staging-diagnostics
run-name: Diagnostic only · ${{ inputs.candidate_ref }}
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Frozen candidate branch; diagnostic results cannot authorize release
        required: true
        type: string
      expected_sha:
        description: Exact candidate commit
        required: true
        type: string
      filesystem_activation_probe:
        description: Private Linux activation, byte inventory and installer refusal fixtures; no app build, DB, SSH or staging
        required: false
        default: false
        type: boolean
      installer_fixture_phase:
        description: Private installer controls; follow-up phases retain their pinned original outcomes
        required: false
        default: full
        type: choice
        options: [full, source-proof-followup, environment, source-transfer-followup, ledger-connection-followup, pdf-tools-setup, private-access-integration, normal-cleanup]
      plan_probe:
        description: Dependency-free native classifier parity against the authenticated full plan
        required: false
        default: false
        type: boolean
      build_transport_probe:
        description: Canonical Linux build transferred to a fresh VM with native Sharp and Chinese PDF render proof; no deployment
        required: false
        default: false
        type: boolean
      transport_origin_run:
        description: "Retest receiver only: original diagnostic run containing a successful canonical producer"
        required: false
        default: ""
        type: string
      transport_origin_sha:
        description: Exact original producer source/controller; retained build is never relabelled
        required: false
        default: ""
        type: string
      transport_origin_artifact:
        description: Exact original producer artifact ID
        required: false
        default: ""
        type: string
      transport_origin_digest:
        description: Plain hex SHA256 from the original upload action; authenticated API has sha256 prefix
        required: false
        default: ""
        type: string
      compiler_transport_probe:
        description: Whole strict compiler state on two fresh VMs with real changed-dependency and new-root refusals
        required: false
        default: false
        type: boolean
      next_build_cache_phase:
        description: Canonical production build and application compiler graph; disabled unless explicitly measured
        required: false
        default: disabled
        type: choice
        options: [disabled, cold, warm, recover]
      next_build_cache_origin:
        description: 'Warm only: exact original JSON runId, sha, artifactId, digest; never relabel original state'
        required: false
        default: ''
        type: string
      managed_compiler_probe:
        description: Exercise the actual normal whole-compiler cache integration without application tests or deployment
        required: false
        default: false
        type: boolean
      managed_compiler_force_invalid:
        description: Deliberately corrupt only the authenticated private graph copy and require actual cold fallback
        required: false
        default: false
        type: boolean
      compiler_compatible_probe:
        description: Reuse authenticated ancestor compiler state on the changed candidate with actual first-restore error refusal and bounded capacity
        required: false
        default: false
        type: boolean
      compiler_origin_run:
        description: Consumer-only repair original run ID
        required: false
        default: ""
        type: string
      compiler_origin_sha:
        description: Retained compiler producer source and controller
        required: false
        default: ""
        type: string
      compiler_origin_artifact:
        description: Retained compiler-state artifact ID
        required: false
        default: ""
        type: string
      compiler_origin_digest:
        description: Plain64hex digest of the retained compiler-state ZIP
        required: false
        default: ""
        type: string
      compiler_probe:
        description: Whole-project cold/warm incremental compiler and actual error-refusal controls; diagnostic only
        required: false
        default: false
        type: boolean
      statutory_probe:
        description: Original statutory DOM file and labelled 5000ms stage/style measurement copy
        required: false
        default: false
        type: boolean
      nodb_probe:
        description: Measure the three original Node/DOM failure files
        required: false
        default: true
        type: boolean
      instrument_copies:
        description: Run old-source labelled measurement copies; disable for repaired tests
        required: false
        default: true
        type: boolean
      layout_probe:
        description: Measure browser replicas and actual compiled fonts
        required: false
        default: true
        type: boolean
permissions: {contents: read, actions: read}
concurrency:
  group: alpha-diagnostic-${{ inputs.candidate_ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  TZ: Asia/Kuala_Lumpur
  AIHR_CI_CONTROL_HEAD: ${{ github.workflow_sha }}
  DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  TEST_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
  TEST_MIGRATION_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/no_database
jobs:
  resolve:
    if: ${{ !inputs.filesystem_activation_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      base: ${{ steps.candidate.outputs.base }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', persist-credentials: false}
      - name: Compiler diagnostic controller checks
        if: ${{ inputs.compiler_probe }}
        run: node --test .github/ci/diagnostics/compiler-incremental.test.mjs
      - name: Build transport controller checks
        if: ${{ inputs.build_transport_probe || inputs.transport_origin_run != '' }}
        run: |
          node --test .github/ci/build-production.test.mjs .github/ci/build-transport.test.mjs
          python3 .github/ci/build-transport-extract.test.py
          python3 .github/ci/build-shim-paths.test.py
          python3 .github/ci/build-bundle.test.py
          python3 .github/ci/build-helper-cleanliness.test.py
      - name: Pin typed compiler-cache controller runtime
        if: ${{ inputs.compiler_transport_probe || inputs.compiler_origin_run != '' || inputs.managed_compiler_probe }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Validate compatible compiler probe selection
        if: ${{ inputs.compiler_compatible_probe }}
        env:
          ORIGINAL_RUN: ${{ inputs.compiler_origin_run }}
          ORIGINAL_SHA: ${{ inputs.compiler_origin_sha }}
          ORIGINAL_ARTIFACT: ${{ inputs.compiler_origin_artifact }}
          ORIGINAL_DIGEST: ${{ inputs.compiler_origin_digest }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          for(const key of ['ORIGINAL_RUN','ORIGINAL_ARTIFACT'])assert(/^[1-9][0-9]{0,15}$/.test(process.env[key]??''));
          assert(/^[a-f0-9]{40}$/.test(process.env.ORIGINAL_SHA??''));
          assert(/^[a-f0-9]{64}$/.test(process.env.ORIGINAL_DIGEST??''));
          NODE
      - name: Compiler transport controller checks
        if: ${{ inputs.compiler_transport_probe || inputs.compiler_origin_run != '' || inputs.managed_compiler_probe }}
        run: node --experimental-strip-types --test .github/ci/diagnostics/compiler-state.test.mjs .github/ci/diagnostics/compiler-transport.test.mjs .github/ci/diagnostics/compiler-cleanup.test.mjs .github/ci/diagnostics/compiler-compatible.test.mjs .github/ci/runner-capacity.test.mjs
      - name: Normal compiler/cache and release-boundary controller checks
        if: ${{ inputs.managed_compiler_probe }}
        run: node --experimental-strip-types --test .github/ci/compiler-cache.test.mjs .github/ci/compiler-wrapper.test.mjs .github/ci/diagnostics/compiler-compatible.test.mjs .github/ci/runner-capacity.test.mjs .github/ci/diagnostics/compiler-cleanup.test.mjs .github/ci/release-policy.test.mjs .github/ci/resume-source.test.mjs
      - name: Canonical application-build cache integrity and resource checks
        if: ${{ inputs.next_build_cache_phase != 'disabled' }}
        run: node --test .github/ci/next-build-cache-policy.test.mjs .github/ci/build-production.test.mjs .github/ci/runner-capacity.test.mjs
      - name: Validate explicit application-cache phase and original selector
        if: ${{ inputs.next_build_cache_phase != 'disabled' }}
        env:
          MODE: ${{ inputs.next_build_cache_phase }}
          ORIGIN: ${{ inputs.next_build_cache_origin }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {parseNextCacheOrigin} from './.github/ci/next-build-cache-policy.mjs';
          assert(['cold','warm','recover'].includes(process.env.MODE));
          if(process.env.MODE==='warm')parseNextCacheOrigin(process.env.ORIGIN);
          else assert(process.env.ORIGIN==='');
          NODE
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_BASE_SHA: ${{ vars.STAGING_DEPLOYED_SHA }}
        run: node .github/ci/resolve.mjs
  nodb-timing:
    if: ${{ inputs.nodb_probe }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: {run: {working-directory: source}}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.resolve.outputs.sha }}', path: source, fetch-depth: 0, persist-credentials: false}
      - uses: ./automation/.github/actions/setup-alpha
      - name: Record runner environment
        run: |
          node ../automation/.github/ci/runner-diagnostics.mjs
          free -b
          df -Pk .
      - name: Run each original failing file separately, retaining assertions and timeouts
        run: node ../automation/.github/ci/diagnostics/run-unchanged-nodb.mjs
      - name: Generate explicitly labelled ignored measurement copies
        if: ${{ inputs.instrument_copies }}
        run: node ../automation/.github/ci/diagnostics/instrument-nodb.mjs
      - name: Run measured copies; results remain diagnostic only
        if: ${{ inputs.instrument_copies }}
        run: node ../automation/.github/ci/diagnostics/run-unchanged-nodb.mjs --instrumented
      - name: Prove tracked candidate remained unchanged
        run: test -z "$(git status --porcelain)"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-nodb-timing
          path: |
            ${{ runner.temp }}/diagnostic-nodb-*/
            ${{ runner.temp }}/runner-resources.json
          if-no-files-found: error
          retention-days: 14
  layout:
    if: ${{ inputs.layout_probe }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: {engine: [chromium, firefox, webkit]}
    defaults: {run: {working-directory: source}}
    env: {ENGINE: '${{ matrix.engine }}'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.resolve.outputs.sha }}', path: source, fetch-depth: 0, persist-credentials: false}
      - uses: ./automation/.github/actions/setup-alpha
      - run: pnpm exec playwright install --with-deps "$ENGINE"
      - name: Record browser and font environment
        run: |
          node ../automation/.github/ci/runner-diagnostics.mjs
          fc-list > "$RUNNER_TEMP/font-list.txt"
      - name: Generate ignored replica probe and provenance
        run: node ../automation/.github/ci/diagnostics/generate-layout-diagnostic.mjs
      - name: Measure replica styles and geometry; save actual PNGs
        run: |
          set -o pipefail
          pnpm exec vitest run --config .vitest-attachments/layout-diagnostic.config.mts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/layout-results.json" 2>&1 | tee "$RUNNER_TEMP/layout-diagnostic.log"
      - name: Prove tracked candidate remained unchanged
        if: always()
        run: test -z "$(git status --porcelain)"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-layout-${{ matrix.engine }}
          include-hidden-files: true
          path: |
            source/.vitest-attachments/
            ${{ runner.temp }}/layout-results.json
            ${{ runner.temp }}/layout-diagnostic.log
            ${{ runner.temp }}/font-list.txt
            ${{ runner.temp }}/runner-resources.json
          if-no-files-found: error
          retention-days: 14

  statutory-timing:
    if: ${{ inputs.statutory_probe }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: {run: {working-directory: source}}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.resolve.outputs.sha }}', path: source, fetch-depth: 0, persist-credentials: false}
      - uses: ./automation/.github/actions/setup-alpha
      - run: node ../automation/.github/ci/diagnostics/statutory-probe.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: statutory-diagnostic
          path: ${{ runner.temp }}/statutory-diagnostic/
          if-no-files-found: error
          retention-days: 14

  fast-plan:
    if: ${{ inputs.plan_probe }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults: {run: {working-directory: source}}
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_CI_MIGRATION_BASE: ${{ needs.resolve.outputs.base }}
      AIHR_CI_CLASSIFIER_RUNTIME: native
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.resolve.outputs.sha }}', path: source, fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.3'}
      - name: Reconstruct complete plan without package installation and authenticate parity
        run: node ../automation/.github/ci/diagnostics/fast-plan.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-fast-plan
          path: ${{ runner.temp }}/diagnostic-fast-plan/
          if-no-files-found: error
          retention-days: 14

  compiler-incremental:
    if: ${{ inputs.compiler_probe }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: {run: {working-directory: source}}
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.resolve.outputs.sha }}', path: source, persist-credentials: false}
      - uses: ./automation/.github/actions/setup-alpha
      - name: Generate real Next route types
        run: pnpm exec next typegen
      - name: Measure whole compiler and unchanged-consumer/new-root error refusal
        run: bash ../automation/.github/ci/typecheck.sh --incremental-diagnostic
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-compiler-incremental
          path: ${{ runner.temp }}/diagnostic-compiler-incremental/
          if-no-files-found: error
          retention-days: 14

  build-transport-producer:
    if: ${{ inputs.build_transport_probe }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: {run: {working-directory: source}}
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.bundle.outputs.artifact-digest }}
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_BUILD_DIAGNOSTIC: transport-producer
      NODE_OPTIONS: --max-old-space-size=6144
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.resolve.outputs.sha }}', path: source, fetch-depth: 0, persist-credentials: false}
      - uses: ./automation/.github/actions/setup-alpha
        with: {node: '22.23.3', mobile: 'false'}
      - name: Canonical owned System Testing build and bounded byte bundle
        run: pnpm exec tsx ../automation/.github/ci/build-production.mjs --diagnostic "$RUNNER_TEMP/build-transport-producer"
      - id: bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-build-transport-producer
          path: ${{ runner.temp }}/build-transport-producer/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  build-transport-consumer:
    if: ${{ inputs.build_transport_probe }}
    needs: [resolve, build-transport-producer]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults: {run: {working-directory: recipient}}
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_BUILD_DIAGNOSTIC: transport-producer
      AIHR_BUILD_ARTIFACT_ID: ${{ needs.build-transport-producer.outputs.artifact_id }}
      AIHR_BUILD_ARTIFACT_DIGEST: ${{ needs.build-transport-producer.outputs.artifact_digest }}
      GH_TOKEN: ${{ github.token }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.resolve.outputs.sha }}', path: recipient, fetch-depth: 0, persist-credentials: false}
      - uses: ./automation/.github/actions/setup-alpha
        with: {node: '22.23.3', mobile: 'false', path: recipient}
      - name: Install independent PDF text and raster inspection tools
        run: |
          if ! command -v pdftoppm || ! command -v pdftotext; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          pdftoppm -v
          pdftotext -v
      - name: Authenticate, relocate and run the transported build without rebuilding
        run: pnpm exec tsx ../automation/.github/ci/build-transport.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-build-transport-consumer
          path: ${{ runner.temp }}/diagnostic-build-transport/
          if-no-files-found: error
          retention-days: 3

  build-transport-consumer-repair:
    if: ${{ inputs.transport_origin_run != '' }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults: {run: {working-directory: recipient}}
    env:
      AIHR_CI_HEAD: ${{ inputs.transport_origin_sha }}
      AIHR_BUILD_DIAGNOSTIC: transport-consumer-repair
      AIHR_BUILD_PRODUCER_RUN_ID: ${{ inputs.transport_origin_run }}
      AIHR_BUILD_PRODUCER_CONTROL_HEAD: ${{ inputs.transport_origin_sha }}
      AIHR_BUILD_ARTIFACT_ID: ${{ inputs.transport_origin_artifact }}
      AIHR_BUILD_ARTIFACT_DIGEST: ${{ inputs.transport_origin_digest }}
      GH_TOKEN: ${{ github.token }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ inputs.transport_origin_sha }}', path: recipient, fetch-depth: 0, persist-credentials: false}
      - uses: ./automation/.github/actions/setup-alpha
        with: {node: '22.23.3', mobile: 'false', path: recipient}
      - name: Install independent PDF text and raster inspection tools
        run: |
          if ! command -v pdftoppm || ! command -v pdftotext; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          pdftoppm -v
          pdftotext -v
      - name: Retest receiver only against authenticated original successful build
        run: pnpm exec tsx ../automation/.github/ci/build-transport.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-build-transport-consumer
          path: ${{ runner.temp }}/diagnostic-build-transport/
          if-no-files-found: error
          retention-days: 3

  compiler-state-producer:
    if: ${{ inputs.compiler_transport_probe && inputs.compiler_origin_run == '' && !inputs.compiler_compatible_probe }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: {run: {working-directory: source}}
    outputs:
      artifact_id: ${{ steps.snapshot.outputs.artifact-id }}
      artifact_digest: ${{ steps.snapshot.outputs.artifact-digest }}
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_COMPILER_TRANSPORT: producer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ needs.resolve.outputs.sha }}', path: source, persist-credentials: false}
      - uses: ./automation/.github/actions/setup-alpha
        with: {node: '22.23.3'}
      - name: Generate actual Next route types
        run: pnpm exec next typegen
      - name: Whole strict compiler and immutable state snapshot
        run: bash ../automation/.github/ci/typecheck.sh --state-transport-producer
      - name: Bind verified owned swap cleanup to compiler snapshot
        run: |
          test -f "$RUNNER_TEMP/compiler-transport-swap-cleanup.json"
          test ! -e "$RUNNER_TEMP/diagnostic-compiler-state-packet/swap-cleanup.json"
          cp "$RUNNER_TEMP/compiler-transport-swap-cleanup.json" "$RUNNER_TEMP/diagnostic-compiler-state-packet/swap-cleanup.json"
      - id: snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-compiler-state-producer
          path: ${{ runner.temp }}/diagnostic-compiler-state-packet/
          if-no-files-found: error
          retention-days: 1
      - name: Retain compiler resource cleanup
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/diagnostic-compiler-transport-producer" && test -f "$RUNNER_TEMP/compiler-transport-swap-cleanup.json"; then
            test ! -e "$RUNNER_TEMP/diagnostic-compiler-transport-producer/swap-cleanup.json"
            cp "$RUNNER_TEMP/compiler-transport-swap-cleanup.json" "$RUNNER_TEMP/diagnostic-compiler-transport-producer/swap-cleanup.json"
          fi
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-compiler-state-producer-debug
          path: ${{ runner.temp }}/diagnostic-compiler-transport-producer/
          if-no-files-found: ignore
          retention-days: 3

  compiler-state-consumer:
    if: ${{ inputs.compiler_transport_probe && inputs.compiler_origin_run == '' && !inputs.compiler_compatible_probe }}
    needs: [resolve, compiler-state-producer]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: {run: {working-directory: source}}
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_COMPILER_TRANSPORT: consumer
      AIHR_COMPILER_ARTIFACT_ID: ${{ needs.compiler-state-producer.outputs.artifact_id }}
      AIHR_COMPILER_ARTIFACT_DIGEST: ${{ needs.compiler-state-producer.outputs.artifact_digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.workflow_sha }}', path: automation, persist-credentials: false}

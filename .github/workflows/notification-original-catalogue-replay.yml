name: original-catalogue-replay-diagnostic
run-name: Read-only original catalogue pair 42440920409
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: original-catalogue-replay-42440920409
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 032b772c2387cbab348999a7b9574485050bb1b4
          path: original
          persist-credentials: false
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          package-manager-cache: false
      - name: Install frozen original offline dependencies without package hooks
        working-directory: original
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Metadata refusal controls
        run: node --test controller/.github/ci/diagnostics/catalogue-original-replay/policy.test.mjs
      - name: Authenticate and replay ORIGINAL pair only
        env:
          GH_TOKEN: ${{ github.token }}
        run: node controller/.github/ci/diagnostics/catalogue-original-replay/parent.mjs
      - name: Publish result and filtered API provenance only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-catalogue-replay-42440920409-diagnostic
          path: |
            ${{ runner.temp }}/original-catalogue-replay-public/result.json
            ${{ runner.temp }}/original-catalogue-replay-public/api-proof.json
          if-no-files-found: error
          retention-days: 7

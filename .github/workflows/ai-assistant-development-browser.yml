# SOURCE PROPOSAL: CI must review/merge this controller and explicitly approve its control SHA.
# Development smoke only; NEVER a release gate or proof of all three AI stages.
name: ai-assistant-development-browser
run-name: Assistant development browser smoke · ${{ inputs.candidate_ref }}
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Existing same-repository candidate branch
        required: true
        type: string
      expected_sha:
        description: Exact clean source SHA; no deployment
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: assistant-development-browser-${{ inputs.candidate_ref }}
  cancel-in-progress: false
env:
  TZ: Asia/Kuala_Lumpur
  LANG: en_US.UTF-8
  AIHR_CI_CONTROL_HEAD: ${{ github.workflow_sha }}
  AIHR_CI_PG_MEMORY_GIB: '2'
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require explicit CI review of this exact controller revision
        env:
          APPROVED_CONTROL_SHA: ${{ vars.AIHR_ASSISTANT_BROWSER_APPROVED_CONTROL_SHA }}
        run: |
          test "$GITHUB_REPOSITORY" = StradaverseHub/ai-hr
          test -n "$APPROVED_CONTROL_SHA"
          test "$APPROVED_CONTROL_SHA" = "$AIHR_CI_CONTROL_HEAD"
      - name: Resolve frozen candidate with maintained resolver
        id: candidate
        run: node .github/ci/resolve.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_BASE_SHA: ${{ vars.STAGING_DEPLOYED_SHA }}
  development-browser:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with:
          node: '20'
          mobile: 'false'
      - run: pnpm exec playwright install --with-deps chromium
      - name: Controller contracts (not browser acceptance)
        run: node --test ../automation/.github/ci/assistant-development-browser.test.mjs ../automation/.github/ci/assistant-provider-config-experience.test.mjs
      - name: Production renderer with actual full native fictional fixture
        run: node ../automation/.github/ci/assistant-development-browser.mjs "$RUNNER_TEMP/assistant-development-browser"
      - name: Cleanup exact job-owned database after cancellation
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/assistant-development-browser/private/owned-unit" && test -f "$RUNNER_TEMP/assistant-development-browser/private/cleanup-safe"; then
            export AIHR_CI_UNIT="$(cat "$RUNNER_TEMP/assistant-development-browser/private/owned-unit")"
            bash ../automation/.github/ci/postgres.sh stop
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assistant-development-browser-smoke-not-release-evidence
          path: ${{ runner.temp }}/assistant-development-browser/public/report.json
          if-no-files-found: error
          retention-days: 7

  # Each mode has its own runner, deterministic mode-bound container/database and FULL fixture.
  # Never reset/reuse a primary target or import the same fictional identity three times in one DB.
  development-import:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source_mode: [paste, csv, xlsx]
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_CI_BROWSER_JOURNEY: employee_import_${{ matrix.source_mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with:
          node: '20'
          mobile: 'false'
      - run: pnpm exec playwright install --with-deps chromium
      - name: Controller contracts (not browser acceptance)
        run: node --test ../automation/.github/ci/assistant-development-browser.test.mjs ../automation/.github/ci/assistant-provider-config-experience.test.mjs
      - name: One source mode with a fresh job-owned native fictional fixture
        run: node ../automation/.github/ci/assistant-development-browser.mjs "$RUNNER_TEMP/assistant-development-import-${{ matrix.source_mode }}"
      - name: Cleanup exact job-owned database after cancellation
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/assistant-development-import-${{ matrix.source_mode }}/private/owned-unit" && test -f "$RUNNER_TEMP/assistant-development-import-${{ matrix.source_mode }}/private/cleanup-safe"; then
            export AIHR_CI_UNIT="$(cat "$RUNNER_TEMP/assistant-development-import-${{ matrix.source_mode }}/private/owned-unit")"
            bash ../automation/.github/ci/postgres.sh stop
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assistant-development-import-${{ matrix.source_mode }}-smoke-not-release-evidence
          path: ${{ runner.temp }}/assistant-development-import-${{ matrix.source_mode }}/public/report.json
          if-no-files-found: error
          retention-days: 7

  # SOURCE PROPOSAL ONLY; same exact approved controller fence through resolve. No self-enable.
  development-native:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        journey: [specialist_governance, ai_controls, own_leave_retirement]
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
      AIHR_CI_BROWSER_JOURNEY: ${{ matrix.journey }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with:
          node: '20'
          mobile: 'false'
      - run: pnpm exec playwright install --with-deps chromium
      - name: Controller contracts (not browser acceptance)
        run: node --test ../automation/.github/ci/assistant-development-browser.test.mjs ../automation/.github/ci/assistant-specialist-governance-experience.test.mjs ../automation/.github/ci/assistant-ai-controls-experience.test.mjs ../automation/.github/ci/assistant-own-leave-retirement-experience.test.mjs
      - name: One closed native journey with a fresh job-owned fictional fixture
        run: node ../automation/.github/ci/assistant-development-browser.mjs "$RUNNER_TEMP/assistant-development-native-${{ matrix.journey }}"
      - name: Cleanup exact job-owned database after cancellation
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/assistant-development-native-${{ matrix.journey }}/private/owned-unit" && test -f "$RUNNER_TEMP/assistant-development-native-${{ matrix.journey }}/private/cleanup-safe"; then
            export AIHR_CI_UNIT="$(cat "$RUNNER_TEMP/assistant-development-native-${{ matrix.journey }}/private/owned-unit")"
            bash ../automation/.github/ci/postgres.sh stop
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assistant-development-native-${{ matrix.journey }}-smoke-not-release-evidence
          path: ${{ runner.temp }}/assistant-development-native-${{ matrix.journey }}/public/report.json
          if-no-files-found: error
          retention-days: 7

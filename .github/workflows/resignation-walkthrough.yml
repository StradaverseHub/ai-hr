name: resignation-walkthrough
run-name: Resignation production renderer · ${{ inputs.candidate_ref || github.ref_name }}
on:
  # Temporary, development-only bootstrap. It has no release or installation credentials.
  push:
    branches: ['codex/resignation-journey-20261116']
    paths: ['.github/workflows/resignation-walkthrough.yml']
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Existing same-repository harness candidate branch
        required: true
        type: string
      expected_sha:
        description: Exact clean candidate SHA; no staging deployment
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: resignation-renderer-${{ inputs.candidate_ref || github.ref_name }}
  cancel-in-progress: false
env:
  TZ: Asia/Kuala_Lumpur
  LANG: en_US.UTF-8
  AIHR_CI_CONTROL_HEAD: ${{ github.workflow_sha }}
  AIHR_CI_PG_PROFILE: '2'
  AIHR_CI_PG_CONFIGURED_CAP_BYTES: '2113929216'
  AIHR_CI_PG_PEAK_BUDGET_BYTES: '2147483648'
  AIHR_CI_PG_JIT: 'on'
jobs:
  resolve:
    if: ${{ github.repository == 'StradaverseHub/ai-hr' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/resignation-journey-20261116')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - run: node --test .github/ci/resignation-browser.test.mjs .github/ci/resignation-browser-push.test.mjs .github/ci/build-heap.test.mjs
      - name: Bind this exact development push or resolve the dispatched candidate
        id: candidate
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            node .github/ci/resignation-browser-push.mjs
          else
            node .github/ci/resolve.mjs
          fi
        env:
          AIHR_WORKFLOW_SHA: ${{ github.workflow_sha }}
          AIHR_WORKFLOW_REF: ${{ github.workflow_ref }}
          GH_TOKEN: ${{ github.token }}
          STAGING_BASE_SHA: ${{ vars.STAGING_DEPLOYED_SHA }}
  production-renderer:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
    env:
      AIHR_CI_HEAD: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/setup-alpha
        with:
          node: '20'
      - run: pnpm exec playwright install --with-deps chromium
      # Same bounded next build heap profile as the canonical build: exactly 8192 MB for the resignation renderer's
      # `next build` child only (migrations, server and Chromium keep their normal heap), only on a GitHub-hosted
      # 16 GB Linux runner; build-heap.mjs refuses anything else and any value above 8192. Raising the ceiling
      # needs owner review (docs/reviews/build-capacity-8192-proposal.md). Rollback: revert restores 6144.
      - name: Admit bounded next build heap
        id: build-heap
        run: node ../automation/.github/ci/build-heap.mjs admit
        env: {AIHR_CI_BUILD_HEAP_MB: '8192'}
      - name: Build and walk through the actual production renderer on fresh fictional data
        run: node ../automation/.github/ci/resignation-browser.mjs "$RUNNER_TEMP/resignation-production-renderer"
        env:
          AIHR_CI_BUILD_HEAP_PROFILE: ${{ steps.build-heap.outputs.heap_profile }}
          AIHR_CI_BUILD_HEAP_MEMTOTAL_KIB: ${{ steps.build-heap.outputs.memtotal_kib }}
      - name: Ensure owned database cleanup after interrupted walkthrough
        if: always()
        run: bash ../automation/.github/ci/postgres.sh stop
        env:
          AIHR_CI_UNIT: db-1
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resignation-production-renderer-development-evidence
          path: ${{ runner.temp }}/resignation-production-renderer/
          if-no-files-found: error
          retention-days: 14

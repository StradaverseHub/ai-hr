name: Frozen dependencies in the pinned browser image
description: Keep original web/mobile dependency scope without repeating browser OS installation
inputs:
  path:
    description: Frozen candidate checkout
    default: source
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      with: {version: 10.33.2}
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with: {node-version: '22.23.3', cache: pnpm, cache-dependency-path: '${{ inputs.path }}/pnpm-lock.yaml'}
    - name: Install unchanged frozen web and native SDK dependencies
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        set -euo pipefail
        pnpm install --frozen-lockfile
        npm ci --prefix mobile --no-audit --no-fund
        cp .env.example .env.local
    - name: Refuse image and Playwright package version drift
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        node -e 'const a=require("node:assert/strict");a.equal(process.platform,"linux");a.equal(process.arch,"x64");a.equal(process.env.GITHUB_ACTIONS,"true");a.equal(process.env.PLAYWRIGHT_BROWSERS_PATH,"/ms-playwright");a.equal(require("playwright/package.json").version,"1.62.1");a.equal(process.versions.node,"22.23.3");console.log("Pinned Playwright1.62.1 image/package and Node22.23.3 verified; application test coverage remains mandatory")'

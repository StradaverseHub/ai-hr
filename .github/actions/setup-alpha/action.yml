name: Isolated alpha toolchain
description: Install the candidate without staging credentials or shared Mac services
inputs:
  node:
    description: Exact Node version (fingerprints bind it)
    default: '22.23.3'
  path:
    description: Candidate checkout
    default: source
  mobile:
    description: Install native SDK dependencies; keep enabled for all test/compiler jobs
    default: 'true'
  capacity_profile:
    description: Legacy cleanup or reviewed bounded compiler/build/suite capacity
    default: legacy
  native_controller:
    description: Protect the native job owner before the first candidate package hook
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [[ "${{ inputs.capacity_profile }}" == bounded-suite-setup ]]; then
          bash "$GITHUB_ACTION_PATH/../../ci/prepare-runner.sh" | tee -a "$RUNNER_TEMP/suite-capacity-preparation.log"
        else
          bash "$GITHUB_ACTION_PATH/../../ci/prepare-runner.sh"
        fi
      env: {AIHR_CI_CAPACITY_PROFILE: '${{ inputs.capacity_profile }}'}
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      if: ${{ inputs.native_controller != 'true' }}
      with:
        version: 10.33.2
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      if: ${{ inputs.native_controller == 'true' }}
      with:
        version: 10.33.2
        run_install: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      if: ${{ inputs.native_controller != 'true' }}
      with:
        node-version: ${{ inputs.node }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.path }}/pnpm-lock.yaml
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      if: ${{ inputs.native_controller == 'true' }}
      with:
        node-version: ${{ inputs.node }}
        package-manager-cache: false
    - name: Protect native CI owner before package invocations
      if: ${{ inputs.native_controller == 'true' }}
      shell: bash
      run: /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/automation/.github/ci/native-controller-bootstrap.py"
    - name: Validate dependency scope
      shell: bash
      env: {INSTALL_MOBILE: '${{ inputs.mobile }}', NATIVE_CONTROLLER: '${{ inputs.native_controller }}'}
      run: |
        case "$INSTALL_MOBILE" in true|false) ;; *) echo 'Invalid mobile installation scope' >&2; exit 2 ;; esac
        case "$NATIVE_CONTROLLER" in true|false) ;; *) echo 'Invalid native controller scope' >&2; exit 2 ;; esac
    - name: Install web and tooling dependencies
      if: ${{ inputs.native_controller != 'true' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      run: pnpm install --frozen-lockfile
    - name: Install native dependencies through the protected owner
      if: ${{ inputs.native_controller == 'true' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        LD_PRELOAD: ''
        LD_LIBRARY_PATH: ''
        LD_AUDIT: ''
        GLIBC_TUNABLES: ''
        NODE_OPTIONS: ''
        NODE_PATH: ''
        NODE_EXTRA_CA_CERTS: ''
        BASH_ENV: /dev/null
        ENV: /dev/null
        SHELLOPTS: ''
        BASHOPTS: ''
      run: '"/var/lib/aihr-native-controller/$GITHUB_RUN_ID/node" "/var/lib/aihr-native-controller/$GITHUB_RUN_ID/automation/.github/ci/native-controller-owner.mjs" setup "${{ inputs.mobile }}"'
    - name: Install native SDK dependencies
      if: ${{ inputs.mobile == 'true' && inputs.native_controller != 'true' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      run: npm ci --prefix mobile --no-audit --no-fund
    - name: Prepare disposable environment
      if: ${{ inputs.native_controller != 'true' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      run: cp .env.example .env.local
    - name: Enforce post-dependency suite capacity
      if: ${{ inputs.capacity_profile == 'bounded-suite-setup' && inputs.native_controller != 'true' }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../../ci/prepare-runner.sh" | tee -a "$RUNNER_TEMP/suite-capacity-preparation.log"
      env: {AIHR_CI_CAPACITY_PROFILE: bounded-suite-ready}

# ai-hr query statistics (ADR 0181, Phase 0). Install as
#   /etc/postgresql/16/main/conf.d/50-aihr-query-statistics.conf
# shared_preload_libraries needs a Postgres restart. Staging only until the owner
# grants a separate production window (see README.md in this directory).
#
# If the server already sets shared_preload_libraries elsewhere, merge the lists
# there instead: the last assignment wins.
shared_preload_libraries = 'pg_stat_statements,auto_explain'

# Same statement statistics as CI (.github/ci/postgres.sh), smaller table.
compute_query_id = on
pg_stat_statements.max = 5000
pg_stat_statements.track = top
pg_stat_statements.track_utility = off
pg_stat_statements.track_planning = on
track_io_timing = on

# Sampled plans of slow statements only. No bind values in the log.
auto_explain.log_min_duration = '500ms'
auto_explain.sample_rate = 0.05
auto_explain.log_analyze = on
auto_explain.log_timing = off
auto_explain.log_buffers = on
auto_explain.log_nested_statements = on
auto_explain.log_format = 'json'
auto_explain.log_parameter_max_length = 0

# Include ONCE in nginx's http {} context. Test with nginx -t before reloading.
# Only configure real_ip_* for explicitly trusted upstreams; internet forwarding headers are untrusted.
limit_req_zone $binary_remote_addr zone=aihr_auth_source:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=aihr_mobile_source:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=aihr_careers_source:10m rate=5r/s;
# Careers application POSTs only: an empty key (any other method) is not counted.
map $request_method $aihr_careers_post_source {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $aihr_careers_post_source zone=aihr_careers_post:10m rate=1r/m;
limit_conn_zone $binary_remote_addr zone=aihr_careers_connections:10m;
limit_conn_zone $binary_remote_addr zone=aihr_source_connections:10m;

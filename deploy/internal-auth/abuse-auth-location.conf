# Include INSIDE the installation's existing /login/api/ proxy location.
# Preserve that location's current proxy_pass, canonical host/proto and TLS settings.
limit_req zone=aihr_auth_source burst=30 nodelay;
limit_req_status 429;
limit_conn aihr_source_connections 20;
limit_conn_status 429;
client_max_body_size 8k;
client_body_timeout 10s;
proxy_read_timeout 30s;
# OVERWRITE rather than append any client-supplied value.
proxy_set_header X-Aihr-Request-Source $remote_addr;

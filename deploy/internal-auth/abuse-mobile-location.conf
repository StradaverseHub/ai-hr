# Include INSIDE the installation's existing /api/mobile/ proxy location.
limit_req zone=aihr_mobile_source burst=60 nodelay;
limit_req_status 429;
limit_conn aihr_source_connections 20;
limit_conn_status 429;
client_max_body_size 12m;
client_body_timeout 30s;
proxy_read_timeout 45s;
proxy_set_header X-Aihr-Request-Source $remote_addr;

# Include INSIDE a dedicated `location ^~ /careers/ { ... }` block that repeats the installation's existing application
# proxy_pass and its canonical host/proto/TLS settings. The careers pages are the public Recruitment careers page
# (Recruitment slice 8): anonymous, so every visitor is told apart only by this proxy.
# All careers requests per source; then, stricter, application form POSTs only (the zone's key is empty for other
# methods, and nginx does not count empty keys); connections in a careers-only zone, apart from sign-in and mobile.
limit_req zone=aihr_careers_source burst=20 nodelay;
limit_req zone=aihr_careers_post burst=5 nodelay;
limit_req_status 429;
limit_conn aihr_careers_connections 10;
limit_conn_status 429;
# The application refuses a form body above 11 MB (a 10 MB resume plus the form) before parsing it.
client_max_body_size 11m;
client_body_timeout 30s;
proxy_read_timeout 30s;
# OVERWRITE rather than append any client-supplied value: the application hashes only this, never X-Forwarded-For.
proxy_set_header X-Aihr-Request-Source $remote_addr;

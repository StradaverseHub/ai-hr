# ADR-0181 — the parts of the AI HR Nginx site that zero-downtime releases depend on.
# Merge into the existing server block (TLS, server_name, logging stay as installed); the upstream
# file itself is written only by deploy/zero-downtime/release-web.sh.
#
# At http {} level (e.g. /etc/nginx/conf.d/aihr-upstream-include.conf):
#     include /etc/nginx/aihr-upstream.conf;
#
# Before `release-web.sh adopt`, create /etc/nginx/aihr-upstream.conf pointing at the LEGACY port so
# the site can move to `proxy_pass http://aihr_web` with no behaviour change:
#     upstream aihr_web { server 127.0.0.1:3000; keepalive 32; }

# Inside the server {} block:

    # Previous builds' JavaScript/CSS stay reachable after a switch: a tab opened before it may still
    # lazy-load a chunk of the old build. release-web.sh keeps the union of every kept release's
    # .next/static here (content-hashed names; adding never changes an existing file). Anything not
    # in the union falls through to the active slot, so an empty or rebuilding union is harmless.
    location ^~ /_next/static/ {
        root /opt/aihr-web/static;
        try_files $uri @aihr_web;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location @aihr_web {
        proxy_pass http://aihr_web;
        include /etc/nginx/aihr-proxy-params.conf;
    }

    location / {
        proxy_pass http://aihr_web;
        include /etc/nginx/aihr-proxy-params.conf;
    }

# /etc/nginx/aihr-proxy-params.conf:
#     proxy_http_version 1.1;
#     proxy_set_header Connection "";          # upstream keepalive
#     proxy_set_header Host $host;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_read_timeout 300s;
#     proxy_buffering off;                     # App Router streaming (Next self-hosting guide)
#
# Keep the client-body limit and any existing headers from the installed site.

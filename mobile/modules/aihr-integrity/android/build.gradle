plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ai.stradaverse.integrity'
version = '0.1.0'

android {
  namespace "ai.stradaverse.integrity"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// Pinned to the official Play Integrity setup documentation reviewed 2026-10-27.
dependencies {
  implementation 'com.google.android.play:integrity:1.6.0'
}
